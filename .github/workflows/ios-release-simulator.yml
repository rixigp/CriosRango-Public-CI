name: iOS Release Simulator Validation

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character commit SHA to build and link for iOS Simulator Release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-release-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-release-simulator:
    name: Compile and link iOS Release for generic Simulator
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1

      - name: Verify target SHA and prepare report
        id: metadata
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::target_sha must be a full 40-character SHA"; exit 1; }
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "$ACTUAL_SHA" == "$TARGET_SHA" ]] || { echo "::error::Checked out SHA differs from target"; exit 1; }
          mkdir -p ios-release-artifacts
          {
            echo "IOS RELEASE SIMULATOR COMPILE/LINK REPORT"
            echo "target_sha=$ACTUAL_SHA"
            echo "configuration=Release"
            echo "destination=generic/platform=iOS Simulator"
            echo "Shared.framework=NOT_CHECKED"
            echo "CriosRango.app=NOT_CHECKED"
            echo "xcodebuild_duration_seconds=NOT_RUN"
          } > ios-release-artifacts/ios-release-simulator-report.txt
          echo "target_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          DEVELOPER_DIR="/Applications/Xcode_26.6.app/Contents/Developer"
          test -d "$DEVELOPER_DIR"
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version | tee ios-release-artifacts/xcode-version.txt
          grep -q '^Xcode 26\.6$' ios-release-artifacts/xcode-version.txt
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install Java 17 for Kotlin Multiplatform
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native Konan downloads
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: macos-konan-release-v1-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'shared/build.gradle.kts') }}
          restore-keys: |
            macos-konan-release-v1-

      - name: Compile and link Release for generic Simulator
        id: release_build
        timeout-minutes: 50
        shell: bash
        env:
          TARGET_SHA: ${{ steps.metadata.outputs.target_sha }}
        run: |
          set -euo pipefail
          REPORT=ios-release-artifacts/ios-release-simulator-report.txt
          XCODE_LOG=ios-release-artifacts/ios-release-xcodebuild.log
          DERIVED_DATA="$RUNNER_TEMP/CriosRangoReleaseDerivedData"
          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphonesimulator/CriosRango.app"
          SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          SHARED_FRAMEWORK="$GITHUB_WORKSPACE/shared/build/xcode-frameworks/Release/iphonesimulator$SDK_VERSION/Shared.framework"
          START_EPOCH="$(date +%s)"
          set +e
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme CriosRangoKMPSpike \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$XCODE_LOG"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          DURATION=$(( $(date +%s) - START_EPOCH ))
          if [[ -d "$SHARED_FRAMEWORK" ]]; then FRAMEWORK_STATUS=FOUND; else
            SHARED_FRAMEWORK="$(find "$GITHUB_WORKSPACE/shared/build/xcode-frameworks" -path '*/Release/*/Shared.framework' -type d -print -quit 2>/dev/null || true)"
            [[ -n "$SHARED_FRAMEWORK" ]] && FRAMEWORK_STATUS=FOUND || FRAMEWORK_STATUS=NOT_FOUND
          fi
          [[ -d "$APP_PATH" ]] && APP_STATUS=FOUND || APP_STATUS=NOT_FOUND
          {
            echo "target_sha=$TARGET_SHA"
            echo "xcodebuild_duration_seconds=$DURATION"
            echo "Shared.framework=$FRAMEWORK_STATUS"
            echo "Shared.framework_path=$SHARED_FRAMEWORK"
            echo "CriosRango.app=$APP_STATUS"
            echo "CriosRango.app_path=$APP_PATH"
            echo "simulator_install=NOT_RUN"
            echo "app_launch=NOT_RUN"
            echo "screenshots=NOT_USED"
            echo "readiness_markers=NOT_USED"
          } | tee -a "$REPORT"
          echo "duration_seconds=$DURATION" >> "$GITHUB_OUTPUT"
          if [[ "$BUILD_STATUS" -ne 0 || "$FRAMEWORK_STATUS" != FOUND || "$APP_STATUS" != FOUND ]]; then
            echo "::error::Release compile/link failed or Shared.framework/CriosRango.app output is missing"
            exit 1
          fi
          BUILT_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          test "$BUILT_BUNDLE_ID" = "es.criosrango.app"

      - name: Upload Release compile/link evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-simulator-${{ github.run_id }}
          path: ios-release-artifacts/**
          if-no-files-found: warn
          retention-days: 14
