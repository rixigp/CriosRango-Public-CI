name: CI-only Outlet Variation Control Forensic

on:
  push:
    branches: [live-filter-forensic-ci-only]
    paths: [.github/workflows/ci-only-outlet-variation-control.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-control-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan Outlet 3XL parent variation records using GET only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forensic
          cat > scan.py <<'PY'
          import json,re,html,unicodedata,urllib.parse,urllib.request,urllib.error
          from pathlib import Path
          base="https://criosrango.es/wp-json/wc/store/v1"
          out=Path("forensic"); report=[]
          def norm(x):
              s=unicodedata.normalize("NFKD",html.unescape(str(x or ""))).encode("ascii","ignore").decode("ascii")
              return re.sub(r"[^a-z0-9]","",s.lower())
          def get(name,path,params=None):
              url=base+path
              if params: url+="?"+urllib.parse.urlencode(params,doseq=True)
              req=urllib.request.Request(url,headers={"User-Agent":"CriosRango-read-only-control-scan/1.0","Accept":"application/json"},method="GET")
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: status=r.status; body=r.read(); headers={k.lower():v for k,v in r.headers.items()}
              except urllib.error.HTTPError as e: status=e.code; body=e.read(); headers={k.lower():v for k,v in e.headers.items()}
              try: data=json.loads(body.decode("utf-8"))
              except Exception: data={"raw":body.decode("utf-8","replace")}
              (out/(name+".json")).write_text(json.dumps({"url":url,"status":status,"headers":headers,"data":data},ensure_ascii=False,indent=2))
              report.append(name+"_HTTP="+str(status))
              return status,data,headers
          _,parents,h=get("outlet_3xl_parents","/products",[("category","445"),("attributes[0][attribute]","pa_tallas"),("attributes[0][term_id]","342"),("per_page","12"),("page","1")])
          parents=parents if isinstance(parents,list) else []
          report.append("OUTLET_3XL_PARENT_COUNT="+str(len(parents)))
          candidates=[]
          def av(v): return v.get("is_in_stock") is True and v.get("is_purchasable") is True
          def value(attrs, name):
              for a in attrs or []:
                  if norm(a.get("name"))==norm(name):
                      return a.get("value")
              return None
          for p in parents:
              if p.get("type")!="variable": continue
              vs=[]
              for stub in p.get("variations") or []:
                  vid=stub.get("id") if isinstance(stub,dict) else stub
                  if not vid: continue
                  _,v,_=get("variation_"+str(vid),"/products/"+str(vid))
                  if isinstance(v,list): v=v[0] if v else {}
                  if not isinstance(v,dict): v={}
                  attrs=v.get("attributes") or (stub.get("attributes",[]) if isinstance(stub,dict) else [])
                  x={"id":int(vid),"attributes":attrs,"size":value(attrs,"Tallas"),"color":value(attrs,"Color"),"is_in_stock":v.get("is_in_stock"),"is_purchasable":v.get("is_purchasable"),"stock_status":v.get("stock_status"),"is_on_backorder":v.get("is_on_backorder")}
                  x["available_for_product_detail_rule"]=av(x)
                  vs.append(x)
              has_available_3xl=any(norm(v.get("size")) in ("3xl","xxxl") and av(v) for v in vs)
              has_unavailable_other=any(norm(v.get("size")) not in ("3xl","xxxl") and not av(v) for v in vs)
              record={"product":{"id":p.get("id"),"name":p.get("name"),"slug":p.get("slug"),"type":p.get("type"),"attributes":p.get("attributes")},"variations":vs,"has_available_3xl":has_available_3xl,"has_unavailable_other_size":has_unavailable_other,"strict_control_match":has_available_3xl and has_unavailable_other}
              candidates.append(record)
              if record["strict_control_match"]:
                  report.append("STRICT_CONTROL_PRODUCT_ID="+str(p.get("id")))
                  report.append("STRICT_CONTROL_PRODUCT_NAME="+str(p.get("name")))
                  report.append("STRICT_CONTROL_AVAILABLE_3XL="+json.dumps([v for v in vs if norm(v.get("size")) in ("3xl","xxxl") and av(v)],ensure_ascii=False))
                  report.append("STRICT_CONTROL_UNAVAILABLE_OTHER_SIZE="+json.dumps([v for v in vs if norm(v.get("size")) not in ("3xl","xxxl") and not av(v)],ensure_ascii=False))
          (out/"all_outlet_3xl_variation_records.json").write_text(json.dumps(candidates,ensure_ascii=False,indent=2))
          report.append("STRICT_CONTROL_FOUND="+("YES" if any(x["strict_control_match"] for x in candidates) else "NO_WITHIN_PAGE1_RESULT_SET"))
          report.append("RULE=available iff is_in_stock == true AND is_purchasable == true; matches Android Product Detail helper")
          (out/"report.txt").write_text("\n".join(report)+"\n")
          print("\n".join(report))
          PY
          python3 scan.py
      - name: Upload variation control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outlet-3xl-variation-control-forensic
          path: forensic/
          if-no-files-found: warn
          retention-days: 14
