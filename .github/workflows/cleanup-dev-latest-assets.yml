name: Cleanup dev-latest release APK assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only APK assets 119-136 and validate release
        env:
          GH_TOKEN: \${{ github.token }}
          REPOSITORY: \${{ github.repository }}
          RELEASE_ID: "392186031"
        shell: bash
        run: |
          set -euo pipefail

          assets=(
            590546988
            575571121
            575609625
            575638268
            575670248
            576424189
            576507752
            576606071
            576783448
            576962173
            577076933
            577351057
            577674211
            577745761
            578513758
            579596036
            579719138
            579764028
          )

          echo "Validating release \$RELEASE_ID before deletion..."
          release="\$(gh api "repos/\$REPOSITORY/releases/\$RELEASE_ID")"

          test "\$(jq -r '.id' <<<"\$release")" = "\$RELEASE_ID"
          test "\$(jq -r '.tag_name' <<<"\$release")" = "dev-latest"

          for asset_id in "\${assets[@]}"; do
            echo "Deleting asset ID \$asset_id..."
            gh api --method DELETE "repos/\$REPOSITORY/releases/assets/\$asset_id"
          done

          echo "Validating release after deletion..."
          release_after="\$(gh api "repos/\$REPOSITORY/releases/\$RELEASE_ID")"
          test "\$(jq -r '.id' <<<"\$release_after")" = "\$RELEASE_ID"
          test "\$(jq -r '.tag_name' <<<"\$release_after")" = "dev-latest"

          assets_after="\$(gh api "repos/\$REPOSITORY/releases/\$RELEASE_ID/assets?per_page=100")"

          expected_keep=(
            "CriosRango-latest.apk"
            "CriosRango-v1.0.137-code137.apk"
            "CriosRango-v1.0.138-code138.apk"
            "CriosRango-v1.0.139-code139.apk"
          )

          for name in "\${expected_keep[@]}"; do
            if ! jq -e --arg name "\$name" 'any(.[]; .name == \$name)' <<<"\$assets_after" >/dev/null; then
              echo "ERROR: required asset disappeared: \$name"
              exit 1
            fi
          done

          forbidden_ids=(
            591617158
            580830732
            581128408
            591617162
          )

          for asset_id in "\${forbidden_ids[@]}"; do
            if jq -e --argjson id "\$asset_id" 'any(.[]; .id == \$id)' <<<"\$assets_after" >/dev/null; then
              echo "OK: protected asset ID \$asset_id remains"
            else
              echo "ERROR: protected asset ID \$asset_id is missing"
              exit 1
            fi
          done

          forbidden_names=(
            "CriosRango-latest.apk"
            "CriosRango-v1.0.137-code137.apk"
            "CriosRango-v1.0.138-code138.apk"
            "CriosRango-v1.0.139-code139.apk"
          )

          for name in "\${forbidden_names[@]}"; do
            if jq -e --arg name "\$name" 'any(.[]; .name == \$name)' <<<"\$assets_after" >/dev/null; then
              echo "OK: protected asset remains: \$name"
            else
              echo "ERROR: protected asset missing: \$name"
              exit 1
            fi
          done

          old_names=(
            "CriosRango-v1.0.119-code119.apk"
            "CriosRango-v1.0.120-code120.apk"
            "CriosRango-v1.0.121-code121.apk"
            "CriosRango-v1.0.122-code122.apk"
            "CriosRango-v1.0.123-code123.apk"
            "CriosRango-v1.0.124-code124.apk"
            "CriosRango-v1.0.125-code125.apk"
            "CriosRango-v1.0.126-code126.apk"
            "CriosRango-v1.0.127-code127.apk"
            "CriosRango-v1.0.128-code128.apk"
            "CriosRango-v1.0.129-code129.apk"
            "CriosRango-v1.0.130-code130.apk"
            "CriosRango-v1.0.131-code131.apk"
            "CriosRango-v1.0.132-code132.apk"
            "CriosRango-v1.0.133-code133.apk"
            "CriosRango-v1.0.134-code134.apk"
            "CriosRango-v1.0.135-code135.apk"
            "CriosRango-v1.0.136-code136.apk"
          )

          for name in "\${old_names[@]}"; do
            if jq -e --arg name "\$name" 'any(.[]; .name == \$name)' <<<"\$assets_after" >/dev/null; then
              echo "ERROR: old asset still exists: \$name"
              exit 1
            fi
          done

          echo "Post-cleanup assets:"
          jq -r '.[].name' <<<"\$assets_after"
          echo "Release ID and tag remain intact: \$RELEASE_ID / dev-latest"
