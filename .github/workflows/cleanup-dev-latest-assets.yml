name: Cleanup dev-latest release APK assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only APK assets 119-136 and validate release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: "392186031"
        shell: bash
        run: |
          set -euo pipefail

          target_names=(
            "CriosRango-v1.0.119-code119.apk"
            "CriosRango-v1.0.120-code120.apk"
            "CriosRango-v1.0.121-code121.apk"
            "CriosRango-v1.0.122-code122.apk"
            "CriosRango-v1.0.123-code123.apk"
            "CriosRango-v1.0.124-code124.apk"
            "CriosRango-v1.0.125-code125.apk"
            "CriosRango-v1.0.126-code126.apk"
            "CriosRango-v1.0.127-code127.apk"
            "CriosRango-v1.0.128-code128.apk"
            "CriosRango-v1.0.129-code129.apk"
            "CriosRango-v1.0.130-code130.apk"
            "CriosRango-v1.0.131-code131.apk"
            "CriosRango-v1.0.132-code132.apk"
            "CriosRango-v1.0.133-code133.apk"
            "CriosRango-v1.0.134-code134.apk"
            "CriosRango-v1.0.135-code135.apk"
            "CriosRango-v1.0.136-code136.apk"
          )

          protected_names=(
            "CriosRango-latest.apk"
            "CriosRango-v1.0.137-code137.apk"
            "CriosRango-v1.0.138-code138.apk"
            "CriosRango-v1.0.139-code139.apk"
          )

          test -n "$GH_TOKEN"
          echo "GH_TOKEN is present"
          echo "GH_TOKEN length: ${#GH_TOKEN}"
          gh auth status

          echo "Validating release $RELEASE_ID before deletion..."
          release="$(gh api "repos/$REPOSITORY/releases/$RELEASE_ID")"
          test "$(jq -r '.id' <<<"$release")" = "$RELEASE_ID"
          test "$(jq -r '.tag_name' <<<"$release")" = "dev-latest"

          echo "Read-only release check OK: $RELEASE_ID / dev-latest"

          assets_json="$(gh api --paginate --slurp "repos/$REPOSITORY/releases/$RELEASE_ID/assets" | jq 'add')"

          echo "Current assets (ID<TAB>NAME):"
          jq -r '.[] | "\(.id)\t\(.name)"' <<<"$assets_json"

          for name in "${protected_names[@]}"; do
            count="$(jq --arg name "$name" '[.[] | select(.name == $name)] | length' <<<"$assets_json")"
            if [ "$count" -ne 1 ]; then
              echo "ERROR: protected asset must exist exactly once: $name (matches: $count)"
              exit 1
            fi
          done

          for name in "${target_names[@]}"; do
            count="$(jq --arg name "$name" '[.[] | select(.name == $name)] | length' <<<"$assets_json")"
            if [ "$count" -ne 1 ]; then
              echo "ERROR: target asset must exist exactly once before deletion: $name (matches: $count)"
              exit 1
            fi
          done

          echo "All protected assets and all 119-136 targets validated exactly once."
          echo "Read-only checks passed; entering DELETE phase..."

          for name in "${target_names[@]}"; do
            id="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .id' <<<"$assets_json")"
            echo "Deleting $name (asset id $id)"
            gh api --method DELETE "repos/$REPOSITORY/releases/assets/$id"
          done

          echo "Validating release after deletion..."
          release_after="$(gh api "repos/$REPOSITORY/releases/$RELEASE_ID")"
          test "$(jq -r '.id' <<<"$release_after")" = "$RELEASE_ID"
          test "$(jq -r '.tag_name' <<<"$release_after")" = "dev-latest"

          assets_after="$(gh api --paginate --slurp "repos/$REPOSITORY/releases/$RELEASE_ID/assets" | jq 'add')"

          for name in "${target_names[@]}"; do
            count="$(jq --arg name "$name" '[.[] | select(.name == $name)] | length' <<<"$assets_after")"
            if [ "$count" -ne 0 ]; then
              echo "ERROR: old asset still exists: $name (matches: $count)"
              exit 1
            fi
          done

          for name in "${protected_names[@]}"; do
            count="$(jq --arg name "$name" '[.[] | select(.name == $name)] | length' <<<"$assets_after")"
            if [ "$count" -ne 1 ]; then
              echo "ERROR: protected asset must exist exactly once after deletion: $name (matches: $count)"
              exit 1
            fi
            echo "OK: protected asset remains exactly once: $name"
          done

          echo "Post-cleanup assets:"
          jq -r '.[].name' <<<"$assets_after"
          echo "Release ID and tag remain intact: $RELEASE_ID / dev-latest"
