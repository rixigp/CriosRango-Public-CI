name: iOS KMP Gradle Task Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-kmp-gradle-diagnostic.yml"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Optional exact 40-character commit SHA; defaults to the event SHA"
        required: false
        type: string

permissions:
  contents: read

jobs:
  embed-framework-diagnostic:
    name: Isolated embedAndSignAppleFrameworkForXcode diagnostic
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}

      - name: Validate target and select Xcode
        shell: bash
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native Konan downloads
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: macos-konan-diagnostic-v1-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'shared/build.gradle.kts') }}
          restore-keys: |
            macos-konan-v1-

      - name: Capture Xcode Release Simulator settings and run Gradle task with 10-minute watchdog
        id: diagnostic
        timeout-minutes: 11
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          set -uo pipefail
          mkdir -p ios-kmp-diagnostic
          LOG="$GITHUB_WORKSPACE/ios-kmp-diagnostic/gradle-task.log"
          REPORT="$GITHUB_WORKSPACE/ios-kmp-diagnostic/diagnostic-report.txt"
          SETTINGS="$RUNNER_TEMP/xcode-build-settings.txt"
          : > "$LOG"
          echo "TARGET_SHA=$(git rev-parse HEAD)" | tee "$REPORT"
          XCODE_SETTINGS_START="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "XCODE_SETTINGS_START=$XCODE_SETTINGS_START" | tee -a "$REPORT"

          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme CriosRangoKMPSpike \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -showBuildSettings > "$SETTINGS" 2>&1
          SETTINGS_STATUS=$?
          if [[ "$SETTINGS_STATUS" -ne 0 ]]; then
            cat "$SETTINGS"
            echo "TASK_RESULT=FAILURE" | tee -a "$REPORT"
            echo "PUNTO EXACTO DONDE QUEDA BLOQUEADO=Xcode -showBuildSettings failed (status $SETTINGS_STATUS)" | tee -a "$REPORT"
            exit 1
          fi

          # Restrict parsing to the app target's settings block.
          python3 - "$SETTINGS" "$RUNNER_TEMP/xcode-env.sh" <<'PY'
          import re,sys
          source,dest=sys.argv[1:]
          blocks=open(source,errors="replace").read().split("Build settings for action")
          chosen=None
          for b in blocks:
              if "target CriosRangoKMPSpike" in b:
                  chosen=b
                  break
          if chosen is None:
              chosen=next((b for b in blocks if "CONFIGURATION = Release" in b and "SDK_NAME = iphonesimulator" in b), "")
          if not chosen:
              raise SystemExit("Could not find Release Simulator build settings block")
          vals={}
          for line in chosen.splitlines():
              m=re.match(r"\s*([A-Z][A-Z0-9_]+) = (.*)$",line)
              if m: vals[m.group(1)]=m.group(2).strip()
          required=["CONFIGURATION","SDK_NAME","ARCHS","TARGET_BUILD_DIR","FRAMEWORKS_FOLDER_PATH","CODE_SIGNING_ALLOWED"]
          missing=[k for k in required if not vals.get(k)]
          if missing: raise SystemExit("Missing required Xcode settings: "+", ".join(missing))
          # Explicit whitelist: do not source shell-special/read-only variables.
          allowed=[
              "CONFIGURATION","SDK_NAME","SDKROOT","PLATFORM_NAME",
              "EFFECTIVE_PLATFORM_NAME","ARCHS","TARGET_BUILD_DIR",
              "FRAMEWORKS_FOLDER_PATH","SRCROOT","PROJECT_DIR","PROJECT_NAME",
              "TARGET_NAME","BUILT_PRODUCTS_DIR","CONFIGURATION_BUILD_DIR",
              "CODE_SIGNING_ALLOWED","CODE_SIGNING_REQUIRED","CODE_SIGN_IDENTITY",
              "ACTION","XCODE_VERSION_ACTUAL","XCODE_VERSION_MAJOR","XCODE_VERSION_MINOR"
          ]
          with open(dest,"w") as f:
              for k in allowed:
                  v=vals.get(k)
                  if v is not None and "\n" not in v and "\r" not in v and "'" not in v:
                      f.write("export "+k+"='"+v+"'\n")
          for k in required: print(k+"="+vals[k])
          PY
          SETTINGS_PARSE_STATUS=$?
          if [[ "$SETTINGS_PARSE_STATUS" -ne 0 ]]; then
            echo "TASK_RESULT=FAILURE" | tee -a "$REPORT"
            echo "PUNTO EXACTO DONDE QUEDA BLOQUEADO=Could not establish required Xcode build environment" | tee -a "$REPORT"
            exit 1
          fi
          source "$RUNNER_TEMP/xcode-env.sh"
          # Match the Release Simulator arm64 environment used by Run #7.
          export CONFIGURATION=Release
          export SDK_NAME="iphonesimulator$(xcrun --sdk iphonesimulator --show-sdk-version)"
          export ARCHS=arm64
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          export SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          export PLATFORM_NAME=iphonesimulator
          export EFFECTIVE_PLATFORM_NAME=-iphonesimulator
          export SRCROOT="$GITHUB_WORKSPACE/iosApp/iosApp.xcodeproj"
          export PROJECT_DIR="$GITHUB_WORKSPACE/iosApp"
          export PROJECT_FILE_PATH="$GITHUB_WORKSPACE/iosApp/iosApp.xcodeproj"
          export TARGET_NAME=CriosRangoKMPSpike
          export ACTION=build
          export XCODE_VERSION_ACTUAL="$(xcodebuild -version | awk '/Xcode/{gsub(/\./,"",$2); print $2; exit}')"
          export XCODE_VERSION_MAJOR="${XCODE_VERSION_ACTUAL:0:2}"
          export XCODE_VERSION_MINOR="${XCODE_VERSION_ACTUAL:2}"
          export PROJECT_NAME="${PROJECT_NAME:-iosApp}"
          export JAVA_HOME="$(/usr/libexec/java_home -v 17)"
          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dorg.gradle.daemon=false"

          START="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          START_EPOCH="$(date '+%s')"
          LAST_CHANGE_EPOCH="$START_EPOCH"
          {
            echo "TASK_START=$START"
            echo "CONFIGURATION=$CONFIGURATION"
            echo "SDK_NAME=$SDK_NAME"
            echo "ARCHS=$ARCHS"
            echo "TARGET_BUILD_DIR=${TARGET_BUILD_DIR:-UNSET}"
            echo "FRAMEWORKS_FOLDER_PATH=${FRAMEWORKS_FOLDER_PATH:-UNSET}"
            echo "CODE_SIGNING_ALLOWED=$CODE_SIGNING_ALLOWED"
            echo "CODE_SIGNING_REQUIRED=$CODE_SIGNING_REQUIRED"
            echo "CODE_SIGN_IDENTITY=${CODE_SIGN_IDENTITY:-}"
            echo "SDKROOT=$SDKROOT"
            echo "PLATFORM_NAME=$PLATFORM_NAME"
            echo "EFFECTIVE_PLATFORM_NAME=$EFFECTIVE_PLATFORM_NAME"
            echo "SRCROOT=$SRCROOT"
            echo "PROJECT_DIR=$PROJECT_DIR"
            echo "PROJECT_NAME=$PROJECT_NAME"
            echo "TARGET_NAME=$TARGET_NAME"
            echo "BUILT_PRODUCTS_DIR=${BUILT_PRODUCTS_DIR:-UNSET}"
            echo "CONFIGURATION_BUILD_DIR=${CONFIGURATION_BUILD_DIR:-UNSET}"
            echo "JAVA_HOME=$JAVA_HOME"
            echo "XCODE_ENV_CAPTURED=YES"
          } | tee -a "$REPORT"

          echo "Gradle invocation start: $START" | tee -a "$LOG"
          (
            cd "$GITHUB_WORKSPACE"
            exec ./gradlew --no-daemon --console=plain --stacktrace --info :shared:embedAndSignAppleFrameworkForXcode
          ) > "$LOG" 2>&1 &
          GRADLE_PID=$!
          echo "GRADLE_PID=$GRADLE_PID" | tee -a "$REPORT"
          LAST_SIZE=0
          LAST_CHANGE_EPOCH="$START_EPOCH"
          DUMPED=0
          RESULT=TIMEOUT
          STATUS=124
          while kill -0 "$GRADLE_PID" 2>/dev/null; do
            sleep 15
            NOW="$(date '+%s')"
            SIZE="$(wc -c < "$LOG" | tr -d ' ')"
            if [[ "$SIZE" -ne "$LAST_SIZE" ]]; then
              LAST_SIZE="$SIZE"
              LAST_CHANGE_EPOCH="$NOW"
              echo "OUTPUT_ACTIVITY timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ') bytes=$SIZE" >> "$REPORT"
            fi
            SILENCE=$((NOW - LAST_CHANGE_EPOCH))
            if [[ "$SILENCE" -ge 180 && "$DUMPED" -eq 0 ]]; then
              echo "SILENCE_DIAGNOSTICS timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ') seconds=$SILENCE" | tee -a "$REPORT"
              ps -axo pid,ppid,stat,%cpu,%mem,etime,command > ios-kmp-diagnostic/processes-at-silence.txt
              (command -v pstree >/dev/null 2>&1 && pstree -ap "$GRADLE_PID" || true) > ios-kmp-diagnostic/process-tree-at-silence.txt
              if command -v jcmd >/dev/null 2>&1; then
                JAVA_PID="$(pgrep -P "$GRADLE_PID" java | head -1 || true)"
                [[ -n "$JAVA_PID" ]] || JAVA_PID="$(pgrep -f 'org.gradle.launcher.daemon.bootstrap.GradleDaemon|GradleWrapperMain' | head -1 || true)"
                if [[ -n "$JAVA_PID" ]]; then
                  echo "JAVA_PID_FOR_DUMP=$JAVA_PID" | tee -a "$REPORT"
                  jcmd "$JAVA_PID" Thread.print > ios-kmp-diagnostic/thread-dump-jcmd.txt 2>&1 && DUMPED=1 || true
                fi
              fi
              if [[ "$DUMPED" -eq 0 ]] && command -v jstack >/dev/null 2>&1; then
                JAVA_PID="$(pgrep -f 'org.gradle.launcher.daemon.bootstrap.GradleDaemon|GradleWrapperMain' | head -1 || true)"
                if [[ -n "$JAVA_PID" ]]; then
                  echo "JAVA_PID_FOR_DUMP=$JAVA_PID" | tee -a "$REPORT"
                  jstack -l "$JAVA_PID" > ios-kmp-diagnostic/thread-dump-jstack.txt 2>&1 && DUMPED=1 || true
                fi
              fi
              echo "THREAD_DUMP_CAPTURED=$([[ "$DUMPED" -eq 1 ]] && echo YES || echo NO)" | tee -a "$REPORT"
            fi
            ELAPSED=$((NOW - START_EPOCH))
            if [[ "$ELAPSED" -ge 600 ]]; then
              echo "WATCHDOG_TIMEOUT timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ') elapsed_seconds=$ELAPSED silence_seconds=$SILENCE" | tee -a "$REPORT"
              ps -axo pid,ppid,stat,%cpu,%mem,etime,command > ios-kmp-diagnostic/processes-at-timeout.txt
              (command -v pstree >/dev/null 2>&1 && pstree -ap "$GRADLE_PID" || true) > ios-kmp-diagnostic/process-tree-at-timeout.txt
              JAVA_PID="$(pgrep -f 'org.gradle.launcher.daemon.bootstrap.GradleDaemon|GradleWrapperMain' | head -1 || true)"
              if [[ -n "$JAVA_PID" ]] && command -v jcmd >/dev/null 2>&1; then
                jcmd "$JAVA_PID" Thread.print > ios-kmp-diagnostic/thread-dump-at-timeout.txt 2>&1 || true
              fi
              RESULT=TIMEOUT
              break
            fi
          done
          if ! kill -0 "$GRADLE_PID" 2>/dev/null; then
            wait "$GRADLE_PID"
            STATUS=$?
            [[ "$STATUS" -eq 0 ]] && RESULT=SUCCESS || RESULT=FAILURE
          fi
          if [[ "$RESULT" == TIMEOUT ]]; then
            # Only terminate processes belonging to this diagnostic's Gradle process group.
            pkill -TERM -P "$GRADLE_PID" 2>/dev/null || true
            kill -TERM "$GRADLE_PID" 2>/dev/null || true
            sleep 5
            pkill -KILL -P "$GRADLE_PID" 2>/dev/null || true
            kill -KILL "$GRADLE_PID" 2>/dev/null || true
            wait "$GRADLE_PID" 2>/dev/null || true
          fi
          END="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          END_EPOCH="$(date '+%s')"
          DURATION=$((END_EPOCH - START_EPOCH))
          LAST_LINE="$(tail -n 1 "$LOG" | tr '\n' ' ')"
          LAST_TASK="$(grep -E '^> Task |^\\* What went wrong:|^BUILD (SUCCESSFUL|FAILED)' "$LOG" | tail -n 1 || true)"
          echo "GRADLE_EXIT_CODE=$STATUS" | tee -a "$REPORT"
          FRAMEWORK="$(find shared/build/xcode-frameworks -type d -name Shared.framework -print -quit 2>/dev/null || true)"
          [[ -n "$FRAMEWORK" ]] && FRAMEWORK_STATUS=FOUND || FRAMEWORK_STATUS=NOT_FOUND
          {
            echo "TASK_END=$END"
            echo "TASK_DURATION=$DURATION seconds"
            echo "TASK_DURATION_SECONDS=$DURATION"
            echo "TASK_RESULT=$RESULT"
            echo "LAST_GRADLE_TASK=${LAST_TASK:-NOT_REPORTED}"
            echo "THREAD_DUMP_CAPTURED=$([[ -s ios-kmp-diagnostic/thread-dump-jcmd.txt || -s ios-kmp-diagnostic/thread-dump-jstack.txt || -s ios-kmp-diagnostic/thread-dump-at-timeout.txt ]] && echo YES || echo NO)"
            echo "Shared.framework=$FRAMEWORK_STATUS"
            echo "FRAMEWORK_PATH=${FRAMEWORK:-NOT_FOUND}"
          } | tee -a "$REPORT"
          cat "$LOG"
          echo "TASK_RESULT=$RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "LAST_GRADLE_TASK=${LAST_TASK:-NOT_REPORTED}" >> "$GITHUB_STEP_SUMMARY"
          echo "LAST_OUTPUT=${LAST_LINE:-NO_OUTPUT}" >> "$GITHUB_STEP_SUMMARY"
          echo "Shared.framework=$FRAMEWORK_STATUS" >> "$GITHUB_STEP_SUMMARY"
          [[ "$RESULT" == SUCCESS ]]

      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-kmp-gradle-diagnostic-${{ github.run_id }}
          path: ios-kmp-diagnostic/**
          if-no-files-found: warn
          retention-days: 14
