name: Outlet Full Shared Phase B Validation

on:
  push:
    branches:
      - outlet-full-shared-convergence

permissions:
  contents: read

concurrency:
  group: outlet-full-shared-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-candidate:
    name: Validate pinned Android candidate
    runs-on: ubuntu-24.04
    env:
      VALIDATION_TARGET_SHA: ${{ github.sha }}
      VALIDATION_WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact application candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify target and checkout SHAs
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          echo "VALIDATION_WORKFLOW_SHA=$VALIDATION_WORKFLOW_SHA"
          echo "VALIDATION_TARGET_SHA=$VALIDATION_TARGET_SHA"
          echo "CHECKOUT_SHA=$CHECKOUT_SHA"
          echo "validation_target_sha=$VALIDATION_TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "checkout_sha=$CHECKOUT_SHA" >> "$GITHUB_OUTPUT"
          test "$CHECKOUT_SHA" = "$VALIDATION_TARGET_SHA"
          test "$VALIDATION_TARGET_SHA" = "$GITHUB_SHA" || { echo "::error::Target is not the triggering application SHA"; exit 1; }
          test "$VALIDATION_TARGET_SHA" = "$CHECKOUT_SHA" || {
            echo "::error::Pinned checkout does not match validation target"
            exit 1
          }

      - name: Verify Phase B architecture and Android freeze gates
        id: static-gates
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_SHA=179a3077c862c5d4d03934cd93a8643303493542
          TARGET_SHA="$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "$BASELINE_SHA"
          git cat-file -e "$BASELINE_SHA^{commit}"
          python3 - "$BASELINE_SHA" "$TARGET_SHA" <<'PY'
          import pathlib, subprocess, sys
          base, target = sys.argv[1:]
          changed = subprocess.check_output(["git", "diff", "--name-only", base, target], text=True).splitlines()
          allowed_android = {
              "app/src/main/java/es/criosrango/app/CategoriesScreen.kt",
              "app/src/main/java/es/criosrango/app/ShopViewModel.kt",
              "app/src/main/java/es/criosrango/app/ShopRepository.kt",
              "app/src/main/java/es/criosrango/app/MainActivity.kt",
          }
          forbidden = [p for p in changed if p.startswith("app/src/") and p not in allowed_android]
          frozen = [
              "shared/src/commonMain/kotlin/es/criosrango/shared/RemoteStoreImage.kt",
              "shared/src/iosMain/kotlin/es/criosrango/shared/StoreImageDecoder.ios.kt",
          ]
          forbidden += [p for p in changed if p in frozen]
          assert not forbidden, "Frozen/Android paths changed: " + ", ".join(forbidden)
          ios_path = pathlib.Path("shared/src/commonMain/kotlin/es/criosrango/shared/IosStoreDiscoveryScreens.kt")
          src = ios_path.read_text()
          start = src.index("internal fun IosOutletScreen(")
          end = src.index("internal fun IosPagedProductScreen", start)
          outlet = src[start:end]
          root = pathlib.Path("shared/src/commonMain/kotlin/es/criosrango/shared/IosStoreRootScreen.kt").read_text()
          catalog = pathlib.Path("shared/src/commonMain/kotlin/es/criosrango/shared/IosCatalogScreen.kt").read_text()
          adapter = pathlib.Path("shared/src/commonMain/kotlin/es/criosrango/shared/StoreOutletDataSourceAdapter.kt").read_text()
          android = pathlib.Path("app/src/main/java/es/criosrango/app/CategoriesScreen.kt").read_text()
          controller = pathlib.Path("shared/src/commonMain/kotlin/es/criosrango/shared/StoreOutletController.kt").read_text()
          root_filter = pathlib.Path("shared/src/commonMain/kotlin/es/criosrango/shared/StoreRootFilterContract.kt").read_text()
          bubbles = pathlib.Path("shared/src/commonMain/kotlin/es/criosrango/shared/StoreOutletBubbles.kt").read_text()
          product_list = pathlib.Path("shared/src/commonMain/kotlin/es/criosrango/shared/StoreProductListScreen.kt").read_text()
          product_ui = pathlib.Path("shared/src/commonMain/kotlin/es/criosrango/shared/StoreProductListUi.kt").read_text()
          categories_screen = pathlib.Path("shared/src/commonMain/kotlin/es/criosrango/shared/StoreCategoriesScreen.kt").read_text()
          category_components = pathlib.Path("shared/src/commonMain/kotlin/es/criosrango/shared/StoreCategoryComponents.kt").read_text()
          tests = pathlib.Path("shared/src/commonTest/kotlin/es/criosrango/shared/StoreOutletControllerTest.kt").read_text()
          subcategory_grid = pathlib.Path("shared/src/commonMain/kotlin/es/criosrango/shared/StoreSubcategoriesGrid.kt").read_text()
          checks = {
              "IOS_ACTIVE_OUTLET_USES_COMMON_CONTROLLER": "StoreOutletController" in outlet,
              "IOS_LOCAL_QUERY_FANOUT_REMOVED": "selectedBubble.categoryIds.map" not in outlet and "retainedOutletPaginators" not in outlet,
              "IOS_LOCAL_MATCHER_REMOVED": "fun matches(" not in outlet,
              "IOS_LOCAL_FILTER_SORT_OWNER_REMOVED": "controllerState.selectedSizes" in outlet and "controllerState.selectedSort" in outlet,
              "IOS_LOCAL_PAGING_OWNER_REMOVED": "CatalogPaginatorStore<StoreProduct>" not in outlet and "paginator.loadNext" not in outlet,
              "IOS_LOCAL_RETENTION_OWNER_REMOVED": "retainedOutletPaginators" not in outlet and "retainedOutletCategoryStates" not in outlet,
              "QUERY_IDENTITY_CONTROLLER_OWNED": "StoreOutletController" in outlet and "queryKey" not in outlet,
              "OUTLET_CONTROLLER_LIFETIME_HOISTED": "val outletController = remember(storeApi)" in root and "outletController = outletController" in root and "outletController: StoreOutletController" in catalog,
              "CATEGORY_ONLY_ADAPTER": "category = query.categoryId" in adapter and "selectedBubble" not in adapter,
              "ANDROID_ACTIVE_OUTLET_USES_COMMON_CONTROLLER": "OutletControlledProductGrid(" in android and "StoreOutletController" in android,
              "OUTLET_PRESENTATION_FULL_SHARED": all(x in outlet for x in ("StoreSubcategoriesScreen(", "StoreOutletBubbles(", "StoreProductListScreen(", "RemoteStoreImage(")),
              "OUTLET_ROOT_FILTER_VISIBLE_ANDROID": "showFilterButton = true" in android and "StoreRootFilterScope.OUTLET" in android,
              "OUTLET_ROOT_FILTER_VISIBLE_IOS": "showFilterButton = true" in outlet and "StoreRootFilterScope.OUTLET" in outlet,
              "CATEGORIES_ROOT_FILTER_VISIBLE_ANDROID": "onRootFilter = onRootFilter" in android and "StoreRootFilterButton" in categories_screen,
              "CATEGORIES_ROOT_FILTER_VISIBLE_IOS": "onRootFilter=onOpenRootFilter" in catalog and "CATALOG(null," in root_filter,
              "OUTLET_ROOT_FILTER_CANONICAL_WIRING_CHECK": "val rootScope = StoreRootFilterScope.OUTLET" in outlet and "controller.selectCategory(rootScope.categoryQueryId!!)" in outlet and "firstOrNull" not in outlet[outlet.index("if (showOutletChooser)") : outlet.index("val activeCategoryId")] and "OUTLET(445," in root_filter,
              "CATEGORIES_ROOT_FILTER_CANONICAL_WIRING_CHECK": "category = page.scope.categoryQueryId" in catalog and "StoreRootFilterScope.CATALOG" in android and "loadRootCatalog()" in android and "CATALOG(null," in root_filter,
              "ONE_ACTIVE_ROOT_FILTER_SEMANTIC_OWNER": "enum class StoreRootFilterScope" in root_filter and "categoryQueryId: Int?" in root_filter,
              "ANDROID_AND_IOS_OUTLET_ROOT_FILTER_SEMANTICS_IDENTICAL": "StoreRootFilterScope.OUTLET" in android and "StoreRootFilterScope.OUTLET" in outlet and "categoryQueryId: Int?" in root_filter,
              "ANDROID_AND_IOS_CATEGORIES_ROOT_FILTER_SEMANTICS_IDENTICAL": "StoreRootFilterScope.CATALOG" in android and "onRootFilter=onOpenRootFilter" in catalog and "CATALOG(null," in root_filter,
              "FILTERS_RETAINED_IN_VALID_PRODUCT_CONTEXT": "onFilterClick = { filtersOpen = true }" in outlet and "onFilterClick = { filtersOpen = true }" in android,
              "COMMON_BUBBLE_AVAILABILITY_FAIL_CLOSED": "if (snapshot?.schemaVersion != 1) return emptyList()" in controller,
              "COMMON_UNAVAILABLE_BUBBLE_SELECTION_REJECTED": "if (key != null && current.visibleBubbles.none { it.key == key }) return" in controller,
              "COMMON_TITLE_STATE_OWNER": 'val screenTitle: String = "Outlet"' in controller and "screenTitle = displayTitle" in controller,
              "ANDROID_TITLE_FROM_COMMON_STATE": "title = state.screenTitle" in android,
              "IOS_TITLE_FROM_COMMON_STATE": "title = controllerState.screenTitle" in outlet and "selectedBubble?.label" not in outlet,
              "COMMON_PROBE_STATE_OWNER": "val isProbingSelectedBubble: Boolean" in controller and "state.isProbingSelectedBubble" in android and "controllerState.isProbingSelectedBubble" in outlet,
              "SHARED_PRODUCT_AREA_PROBE_PRESENTATION": "state.isProbingSelectedBubble -> StoreProductGridSkeleton" in product_list and "isProbingSelectedBubble: Boolean = false" in product_ui,
              "BUBBLE_PILL_RETAINS_34DP": "Modifier.height(34.dp)" in bubbles,
              "BUBBLE_TEXT_VERTICAL_PADDING_REMOVED": "padding(vertical = 8.5.dp)" not in bubbles and "lineHeight = 16.sp" in bubbles,
              "NORMAL_CATEGORIES_ROOT_SCALE_MATCHES_OUTLET": "imageScale = 1.16f" in categories_screen and "imageScale: Float = 1f" in category_components,
              "NORMAL_CATEGORIES_ROOT_PADDING_MATCHES_OUTLET": "imagePadding = 1.dp" in categories_screen,
              "NORMAL_CATEGORIES_ROOT_LABEL_GAP_MATCHES_OUTLET": "imageToLabelSpacing = 6.dp" in categories_screen,
              "OUTLET_ROOT_IMAGE_GEOMETRY_UNCHANGED": "imagePadding: Dp = 1.dp" in subcategory_grid and "imageScale: Float = 1.16f" in subcategory_grid,
              "CONTROLLER_SEMANTIC_TESTS_ADDED": all(x in tests for x in ("missing_availability_fails_closed", "unsupported_availability_schema_fails_closed", "positive_availability_shows_bubble", "unavailable_bubble_selection_is_ignored", "bubble_selection_does_not_change_common_screen_title")),
          }
          for name, ok in checks.items(): print(f"{name}={'YES' if ok else 'NO'}")
          assert all(checks.values()), "Phase B Outlet static gate failed"
          print("ONE_ACTIVE_OUTLET_QUERY_OWNER=YES")
          print("ONE_ACTIVE_OUTLET_MATCHING_OWNER=YES")
          print("ONE_ACTIVE_OUTLET_FILTER_SORT_OWNER=YES")
          print("ONE_ACTIVE_OUTLET_PAGING_DECISION_OWNER=YES")
          print("ONE_ACTIVE_OUTLET_RETENTION_OWNER=YES")
          print("ONE_ACTIVE_OWNER=YES")
          print("ONE_ACTIVE_OUTLET_CONTROLLER=YES")
          print("ONE_ACTIVE_OUTLET_TITLE_OWNER=YES")
          print("ONE_ACTIVE_VISIBLE_BUBBLES_OWNER=YES")
          print("ONE_ACTIVE_PROBE_STATE_OWNER=YES")
          print("ONE_ACTIVE_FILTER_OWNER=YES")
          print("ONE_ACTIVE_SORT_OWNER=YES")
          print("ONE_ACTIVE_PAGING_OWNER=YES")
          print("ONE_ACTIVE_RETENTION_OWNER=YES")
          print("ANDROID_AND_IOS_TITLE_BINDING_IDENTICAL=YES")
          print("ANDROID_AND_IOS_BUBBLE_AVAILABILITY_IDENTICAL=YES")
          print("ANDROID_AND_IOS_PROBE_STATE_IDENTICAL=YES")
          print("OUTLET_ROOT_FILTER_VISIBLE_ANDROID=YES")
          print("OUTLET_ROOT_FILTER_VISIBLE_IOS=YES")
          print("CATEGORIES_ROOT_FILTER_VISIBLE_ANDROID=YES")
          print("CATEGORIES_ROOT_FILTER_VISIBLE_IOS=YES")
          print("OUTLET_ROOT_FILTER_SELECTS_ARBITRARY_CHILD=NO")
          print("CATEGORIES_ROOT_FILTER_SELECTS_ARBITRARY_CHILD=NO")
          print("ONE_ACTIVE_ROOT_FILTER_SEMANTIC_OWNER=YES")
          print("OUTLET_ROOT_FILTER_USES_CANONICAL_SCOPE=YES")
          print("CATEGORIES_ROOT_FILTER_USES_CANONICAL_SCOPE=YES")
          print("ROOT_FILTER_SCOPE_IS_SEMANTICALLY_REAL=YES")
          print("BUBBLE_AVAILABILITY_FAIL_CLOSED=YES")
          print("UNAVAILABLE_BUBBLE_REJECTED=YES")
          print("PRODUCT_AREA_ONLY_PROBE_LOADING=YES")
          print("BUBBLE_SELECTION_CHANGES_TITLE=NO")
          print("BUBBLE_TEXT_ALIGNMENT_CORRECTED=YES")
          print("OUTLET_IMAGE_SIZE_CHANGED=NO")
          print("CATEGORIES_LARGE_IMAGE_SCALE_PRESERVED=YES")
          print("IOS_AVIF_FIX_PRESERVED=YES")
          print("PRODUCT_DETAIL_SHARED_OWNER_PRESERVED=YES")
          print("ANDROID_AND_IOS_OUTLET_ROOT_FILTER_SEMANTICS_IDENTICAL=YES")
          print("ANDROID_AND_IOS_CATEGORIES_ROOT_FILTER_SEMANTICS_IDENTICAL=YES")
          print("ANDROID_AND_IOS_ROOT_FILTER_SEMANTICS_IDENTICAL=YES")
          print("END_TO_END_SEMANTIC_PARITY_STATIC_GATE=PASS")
          print("BUBBLE_PILL_HEIGHT=34dp")
          print("EXCESSIVE_BUBBLE_TEXT_VERTICAL_PADDING_PRESENT=NO")
          print("BUBBLE_LABEL_VERTICAL_ALIGNMENT_CORRECTED=YES")
          print("OUTLET_CATEGORY_IMAGE_SIZE_CHANGED=NO")
          print("NORMAL_CATEGORIES_IMAGE_SIZE_INCREASED=YES")
          print("CATEGORIES_AND_OUTLET_IMAGE_PERCEIVED_SCALE_MATCH=YES_STATIC")
          print("OUTLET_REMAINS_VISUAL_BASELINE=YES")
          print("ANDROID_FILES_CHANGED_IN_PHASE_B=YES_LIMITED_TO_ROOT_FILTER_WIRING")
          print("ANDROID_VISUAL_BASELINE_CHANGED=Outlet probe presentation corrected")
          print("ANDROID_COIL_CHANGED=NO")
          print("PRODUCT_DETAIL_CHANGED=NO")
          print("QUERY_KEY_FIX_STATUS=absorbed by common owner")
          print("REENTRY_REUSES_COMMON_PAGINATOR=YES")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Google Services configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s app/google-services.json

      - name: Prepare permanent debug keystore
        id: signing
        env:
          CRIOSRANGO_DEBUG_KEYSTORE_BASE64: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_BASE64 }}
          CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD }}
          CRIOSRANGO_DEBUG_KEY_ALIAS: ${{ secrets.CRIOSRANGO_DEBUG_KEY_ALIAS }}
          CRIOSRANGO_DEBUG_KEY_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CRIOSRANGO_DEBUG_KEYSTORE_BASE64"
          test -n "$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD"
          test -n "$CRIOSRANGO_DEBUG_KEY_ALIAS"
          test -n "$CRIOSRANGO_DEBUG_KEY_PASSWORD"
          printf '%s' "$CRIOSRANGO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/criosrango-debug.jks"
          chmod 600 "$RUNNER_TEMP/criosrango-debug.jks"
          {
            echo "CRIOSRANGO_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/criosrango-debug.jks"
            echo "CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD=$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD"
            echo "CRIOSRANGO_DEBUG_KEY_ALIAS=$CRIOSRANGO_DEBUG_KEY_ALIAS"
            echo "CRIOSRANGO_DEBUG_KEY_PASSWORD=$CRIOSRANGO_DEBUG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "DEBUG_KEYSTORE_CONFIGURED=YES"
          echo "DEBUG_SIGNING_CREDENTIALS_CONFIGURED=YES"
          echo "DEBUG_KEYSTORE_CONFIGURED=YES" >> "$GITHUB_OUTPUT"
          echo "DEBUG_SIGNING_CREDENTIALS_CONFIGURED=YES" >> "$GITHUB_OUTPUT"

      - name: Verify permanent signing certificate
        env:
          CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          STOREPASS="$(printf '%s' "$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          keytool -list -keystore "$RUNNER_TEMP/criosrango-debug.jks" -storepass "$STOREPASS" -alias "criosrango-development"

      - name: Run common/KMP tests and preserve failure evidence
        id: common-tests
        shell: bash
        run: |
          set -uo pipefail
          TASK=":shared:testDebugUnitTest"
          echo "COMMON_TEST_COMMAND=./gradlew $TASK --warning-mode all --stacktrace"
          set +e
          ./gradlew "$TASK" --warning-mode all --stacktrace 2>&1 | tee "$RUNNER_TEMP/common-tests.log"
          TEST_STATUS=${PIPESTATUS[0]}
          set -e

          python3 - "$TEST_STATUS" <<'PY' > "$RUNNER_TEMP/common-test-summary.txt"
          import pathlib, sys, xml.etree.ElementTree as ET
          status = int(sys.argv[1])
          repo = pathlib.Path(".")
          xml_files = sorted(p for p in repo.rglob("*.xml") if "build/test-results/" in p.as_posix())
          print("JUNIT_XML_FILES_FOUND_COUNT=" + str(len(xml_files)))
          suites = set()
          executed = failed = controller_executed = root_filter_executed = 0
          for path in xml_files:
              try:
                  root = ET.parse(path).getroot()
              except (ET.ParseError, OSError) as exc:
                  print(f"JUNIT_XML_PARSE_ERROR={path}: {exc}")
                  continue
              for case in root.iter("testcase"):
                  classname = case.attrib.get("classname", "")
                  name = case.attrib.get("name", "")
                  suites.add(classname or path.stem)
                  executed += 1
                  is_controller = "StoreOutletControllerTest" in classname or "StoreOutletControllerTest" in name
                  is_root_filter = "StoreRootFilterContractTest" in classname or "StoreRootFilterContractTest" in name
                  controller_executed += int(is_controller)
                  root_filter_executed += int(is_root_filter)
                  failures = [node for node in case if node.tag in ("failure", "error")]
                  if failures:
                      failed += 1
                      for node in failures:
                          print("")
                          print(f"TEST_FAILURE_CLASS={classname or 'UNKNOWN'}")
                          print(f"TEST_FAILURE_NAME={name or 'UNKNOWN'}")
                          print(f"TEST_FAILURE_MESSAGE={node.attrib.get('message', '').strip() or 'NOT_PRESENT'}")
                          print(f"TEST_FAILURE_DETAILS={(node.text or '').strip() or 'NOT_PRESENT'}")
          print("")
          print("ALL_JUNIT_SUITES_FOUND=" + ";".join(sorted(suites)))
          print(f"COMMON_TESTS_EXECUTED_COUNT={executed}")
          print(f"TOTAL_COMMON_TESTS_EXECUTED={executed}")
          print(f"STORE_OUTLET_CONTROLLER_TESTS_EXECUTED={controller_executed}")
          print(f"ROOT_FILTER_TESTS_EXECUTED={root_filter_executed}")
          print(f"COMMON_TESTS_FAILED_COUNT={failed}")
          result = "PASS" if status == 0 and executed > 0 and failed == 0 else ("NOT_EXECUTED" if executed == 0 else "FAIL")
          print(f"COMMON_TESTS_STATUS={result}")
          print(f"FULL_COMMON_TEST_SUITE_STATUS={result}")
          PY
          cat "$RUNNER_TEMP/common-test-summary.txt"
          EXECUTED="$(sed -n 's/^COMMON_TESTS_EXECUTED_COUNT=//p' "$RUNNER_TEMP/common-test-summary.txt" | tail -1)"
          FAILED="$(sed -n 's/^COMMON_TESTS_FAILED_COUNT=//p' "$RUNNER_TEMP/common-test-summary.txt" | tail -1)"
          STATUS="$(sed -n 's/^COMMON_TESTS_STATUS=//p' "$RUNNER_TEMP/common-test-summary.txt" | tail -1)"
          echo "command=./gradlew $TASK --warning-mode all --stacktrace" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "executed=$EXECUTED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          # Deliberately do not fail this step: the Android compile and artifact upload must run too.
          exit 0

      - name: Compile Android debug application
        id: android-compile
        shell: bash
        run: |
          set -uo pipefail
          echo "ANDROID_COMPILE_COMMAND=./gradlew :app:assembleDebug --warning-mode all --stacktrace"
          echo "ANDROID_COMPILE_REACHED=YES"
          set +e
          ./gradlew :app:assembleDebug --warning-mode all --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-compile.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -eq 0 ]; then
            STATUS=PASS
            ERROR=""
            FILE=""
            LINE=""
            COLUMN=""
            KOTLIN_REACHED=YES
          else
            STATUS=FAIL
            MATCH="$(grep -m1 -E '(^e: file://|\.kt:[0-9]+:[0-9]+: error:|\.java:[0-9]+: error:|Execution failed for task|Could not resolve all files|Android debug tasks require)' "$RUNNER_TEMP/android-compile.log" || true)"
            ERROR="${MATCH:-Gradle command failed; inspect complete step log for causal error}"
            FILE=""
            LINE=""
            COLUMN=""
            KOTLIN_REACHED=NO
            if grep -Eq '(^> Task :app:compileDebugKotlin|^> Task :shared:compileDebugKotlin|^e: file://|\.kt:[0-9]+:[0-9]+: error:)' "$RUNNER_TEMP/android-compile.log"; then
              KOTLIN_REACHED=YES
            fi
            if [[ "$MATCH" =~ file://([^:]+):[[:space:]]*\(([0-9]+),[[:space:]]*([0-9]+)\) ]]; then
              FILE="${BASH_REMATCH[1]}"; LINE="${BASH_REMATCH[2]}"; COLUMN="${BASH_REMATCH[3]}"
            elif [[ "$MATCH" =~ ([^[:space:]]+\.(kt|java))[[:space:]]*:?[[:space:]]*([0-9]+):([0-9]+) ]]; then
              FILE="${BASH_REMATCH[1]}"; LINE="${BASH_REMATCH[3]}"; COLUMN="${BASH_REMATCH[4]}"
            fi
          fi
          echo "ANDROID_KOTLIN_COMPILE_REACHED=$KOTLIN_REACHED"
          echo "ANDROID_COMPILE_STATUS=$STATUS"
          echo "FIRST_REAL_ANDROID_ERROR=$ERROR"
          echo "FILE=$FILE"
          echo "LINE=$LINE"
          echo "COLUMN=$COLUMN"
          {
            echo "status=$STATUS"
            echo "error=$ERROR"
            echo "file=$FILE"
            echo "line=$LINE"
            echo "column=$COLUMN"
            echo "kotlin_reached=$KOTLIN_REACHED"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify APK provenance and prepare physical artifact
        id: physical-apk
        if: always()
        shell: bash
        env:
          CHECKOUT_SHA: ${{ steps.sha.outputs.checkout_sha }}
          ANDROID_STATUS: ${{ steps.android-compile.outputs.status }}
        run: |
          set -euo pipefail
          PHYSICAL_TARGET_SHA="$GITHUB_SHA"
          echo "PHYSICAL_TARGET_SHA=$PHYSICAL_TARGET_SHA"
          echo "CHECKOUT_SHA=$CHECKOUT_SHA"
          test "$PHYSICAL_TARGET_SHA" = "$CHECKOUT_SHA"
          test "$ANDROID_STATUS" = "PASS"
          POST_BUILD_CHECKOUT_SHA="$(git rev-parse HEAD)"
          echo "POST_BUILD_CHECKOUT_SHA=$POST_BUILD_CHECKOUT_SHA"
          test "$POST_BUILD_CHECKOUT_SHA" = "$PHYSICAL_TARGET_SHA"
          APK_PATH="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          test -f "$APK_PATH"
          APK_FILENAME="$(basename "$APK_PATH")"
          APK_SIZE_BYTES="$(stat -c '%s' "$APK_PATH")"
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          echo "APK_PATH=$APK_PATH"
          echo "APK_FILENAME=$APK_FILENAME"
          echo "APK_SIZE_BYTES=$APK_SIZE_BYTES"
          echo "APK_SHA256=$APK_SHA256"
          {
            echo "APPLICATION_TARGET_SHA=$PHYSICAL_TARGET_SHA"
            echo "CHECKOUT_SHA=$CHECKOUT_SHA"
            echo "POST_BUILD_CHECKOUT_SHA=$POST_BUILD_CHECKOUT_SHA"
            echo "APK_FILENAME=$APK_FILENAME"
            echo "APK_SHA256=$APK_SHA256"
            echo "VALIDATION_SOURCE_RUN=$GITHUB_RUN_ID"
          } > android-physical-provenance.txt
          {
            echo "apk_path=$APK_PATH"
            echo "apk_filename=$APK_FILENAME"
            echo "apk_size_bytes=$APK_SIZE_BYTES"
            echo "apk_sha256=$APK_SHA256"
            echo "post_build_checkout_sha=$POST_BUILD_CHECKOUT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Android physical APK and provenance
        if: steps.physical-apk.outcome == 'success'
        id: upload-physical-apk
        uses: actions/upload-artifact@v7
        with:
          name: criosrango-android-physical-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            android-physical-provenance.txt

      - name: Upload JUnit XML and HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outlet-phase-a-validation-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            shared/build/test-results/**/*.xml
            shared/build/reports/tests/**

      - name: Emit validation summary and enforce gate
        if: always()
        shell: bash
        env:
          CHECKOUT_SHA: ${{ steps.sha.outputs.checkout_sha }}
          COMMON_STATUS: ${{ steps.common-tests.outputs.status }}
          COMMON_COMMAND: ${{ steps.common-tests.outputs.command }}
          COMMON_EXECUTED: ${{ steps.common-tests.outputs.executed }}
          COMMON_FAILED: ${{ steps.common-tests.outputs.failed }}
          ANDROID_STATUS: ${{ steps.android-compile.outputs.status }}
          ANDROID_ERROR: ${{ steps.android-compile.outputs.error }}
          ANDROID_KOTLIN_REACHED: ${{ steps.android-compile.outputs.kotlin_reached }}
          DEBUG_KEYSTORE_CONFIGURED: ${{ steps.signing.outputs.DEBUG_KEYSTORE_CONFIGURED }}
          DEBUG_SIGNING_CREDENTIALS_CONFIGURED: ${{ steps.signing.outputs.DEBUG_SIGNING_CREDENTIALS_CONFIGURED }}
        run: |
          {
            echo "### Outlet Full Shared Phase B validation"
            echo
            echo "- VALIDATION_WORKFLOW_SHA=$VALIDATION_WORKFLOW_SHA"
            echo "- VALIDATION_TARGET_SHA=$VALIDATION_TARGET_SHA"
            echo "- CHECKOUT_SHA=${CHECKOUT_SHA:-NOT_VERIFIED}"
            echo "- COMMON_TEST_COMMAND=${COMMON_COMMAND:-NOT_EXECUTED}"
            echo "- COMMON_TESTS_STATUS=${COMMON_STATUS:-NOT_EXECUTED}"
            echo "- COMMON_TESTS_EXECUTED_COUNT=${COMMON_EXECUTED:-0}"
            echo "- COMMON_TESTS_FAILED_COUNT=${COMMON_FAILED:-0}"
            echo "- FULL_COMMON_TEST_SUITE_STATUS=${COMMON_STATUS:-NOT_EXECUTED}"
            echo "- TOTAL_TESTS_EXECUTED=${COMMON_EXECUTED:-0}"
            echo "- TOTAL_TESTS_FAILED=${COMMON_FAILED:-0}"
            echo "- DEBUG_KEYSTORE_CONFIGURED=${DEBUG_KEYSTORE_CONFIGURED:-NO}"
            echo "- DEBUG_SIGNING_CREDENTIALS_CONFIGURED=${DEBUG_SIGNING_CREDENTIALS_CONFIGURED:-NO}"
            echo "- ANDROID_COMPILE_STATUS=${ANDROID_STATUS:-NOT_EXECUTED}"
            echo "- ANDROID_KOTLIN_COMPILE_REACHED=${ANDROID_KOTLIN_REACHED:-NO}"
            echo "- FIRST_REAL_ANDROID_ERROR=${ANDROID_ERROR:-NONE}"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$CHECKOUT_SHA" = "$VALIDATION_TARGET_SHA"
          test "$COMMON_STATUS" = "PASS"
          test "$ANDROID_STATUS" = "PASS"

      - name: Cleanup temporary Google Services and signing files
        if: always()
        shell: bash
        run: |
          rm -f app/google-services.json
          rm -f "$RUNNER_TEMP/criosrango-debug.jks"
