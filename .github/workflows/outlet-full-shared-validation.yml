name: Outlet Full Shared Phase A Validation

on:
  push:
    branches:
      - outlet-full-shared-convergence

permissions:
  contents: read

concurrency:
  group: outlet-full-shared-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-candidate:
    name: Validate pinned Android candidate
    runs-on: ubuntu-24.04
    env:
      VALIDATION_TARGET_SHA: 179a3077c862c5d4d03934cd93a8643303493542
      VALIDATION_WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact application candidate
        uses: actions/checkout@v7
        with:
          ref: 179a3077c862c5d4d03934cd93a8643303493542
          persist-credentials: false

      - name: Verify target and checkout SHAs
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          echo "VALIDATION_WORKFLOW_SHA=$VALIDATION_WORKFLOW_SHA"
          echo "VALIDATION_TARGET_SHA=$VALIDATION_TARGET_SHA"
          echo "CHECKOUT_SHA=$CHECKOUT_SHA"
          echo "validation_target_sha=$VALIDATION_TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "checkout_sha=$CHECKOUT_SHA" >> "$GITHUB_OUTPUT"
          test "$VALIDATION_TARGET_SHA" = "179a3077c862c5d4d03934cd93a8643303493542"
          test "$CHECKOUT_SHA" = "179a3077c862c5d4d03934cd93a8643303493542"
          test "$VALIDATION_TARGET_SHA" = "$CHECKOUT_SHA" || {
            echo "::error::Pinned checkout does not match validation target"
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Google Services configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s app/google-services.json

      - name: Prepare permanent debug keystore
        id: signing
        env:
          CRIOSRANGO_DEBUG_KEYSTORE_BASE64: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_BASE64 }}
          CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD }}
          CRIOSRANGO_DEBUG_KEY_ALIAS: ${{ secrets.CRIOSRANGO_DEBUG_KEY_ALIAS }}
          CRIOSRANGO_DEBUG_KEY_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CRIOSRANGO_DEBUG_KEYSTORE_BASE64"
          test -n "$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD"
          test -n "$CRIOSRANGO_DEBUG_KEY_ALIAS"
          test -n "$CRIOSRANGO_DEBUG_KEY_PASSWORD"
          printf '%s' "$CRIOSRANGO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/criosrango-debug.jks"
          chmod 600 "$RUNNER_TEMP/criosrango-debug.jks"
          {
            echo "CRIOSRANGO_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/criosrango-debug.jks"
            echo "CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD=$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD"
            echo "CRIOSRANGO_DEBUG_KEY_ALIAS=$CRIOSRANGO_DEBUG_KEY_ALIAS"
            echo "CRIOSRANGO_DEBUG_KEY_PASSWORD=$CRIOSRANGO_DEBUG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "DEBUG_KEYSTORE_CONFIGURED=YES"
          echo "DEBUG_SIGNING_CREDENTIALS_CONFIGURED=YES"
          echo "DEBUG_KEYSTORE_CONFIGURED=YES" >> "$GITHUB_OUTPUT"
          echo "DEBUG_SIGNING_CREDENTIALS_CONFIGURED=YES" >> "$GITHUB_OUTPUT"

      - name: Verify permanent signing certificate
        env:
          CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          STOREPASS="$(printf '%s' "$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          keytool -list -keystore "$RUNNER_TEMP/criosrango-debug.jks" -storepass "$STOREPASS" -alias "criosrango-development"

      - name: Run common/KMP tests and preserve failure evidence
        id: common-tests
        shell: bash
        run: |
          set -uo pipefail
          TASK=":shared:testDebugUnitTest"
          echo "COMMON_TEST_COMMAND=./gradlew $TASK --warning-mode all --stacktrace"
          set +e
          ./gradlew "$TASK" --warning-mode all --stacktrace 2>&1 | tee "$RUNNER_TEMP/common-tests.log"
          TEST_STATUS=${PIPESTATUS[0]}
          set -e

          python3 - "$TEST_STATUS" <<'PY' > "$RUNNER_TEMP/common-test-summary.txt"
          import pathlib, re, sys, xml.etree.ElementTree as ET
          status = int(sys.argv[1])
          repo = pathlib.Path(".")
          test_file = repo / "shared/src/commonTest/kotlin/es/criosrango/shared/StoreOutletControllerTest.kt"
          source = test_file.read_text(errors="replace").splitlines() if test_file.exists() else []
          xml_files = sorted(p for p in repo.rglob("*.xml") if "build/test-results/" in p.as_posix())
          print("JUNIT_XML_FILES=")
          for p in xml_files:
              print(f"  {p}")
          executed = failed = 0
          failure_rows = []
          for path in xml_files:
              try:
                  root = ET.parse(path).getroot()
              except (ET.ParseError, OSError):
                  continue
              for case in root.iter("testcase"):
                  cname = case.attrib.get("classname", "")
                  name = case.attrib.get("name", "")
                  if "StoreOutletControllerTest" not in cname and "StoreOutletControllerTest" not in name:
                      continue
                  executed += 1
                  nodes = [n for n in case if n.tag in ("failure", "error")]
                  failed += len(nodes)
                  for node in nodes:
                      message = node.attrib.get("message", "").strip()
                      stack = (node.text or "").strip()
                      first = next((line.strip() for line in stack.splitlines()
                                    if "StoreOutletControllerTest.kt:" in line), "")
                      if not first:
                          first = next((line.strip() for line in stack.splitlines()
                                        if line.strip() and not line.lstrip().startswith("at org.junit")), "")
                      expected = actual = "NOT_PRESENT_IN_XML"
                      m = re.search(r"expected:<(.+?)> but was:<(.+?)>", message, re.S)
                      if m:
                          expected, actual = m.group(1), m.group(2)
                      elif stack:
                          m = re.search(r"expected:<(.+?)> but was:<(.+?)>", stack, re.S)
                          if m:
                              expected, actual = m.group(1), m.group(2)
                      print("")
                      print(f"TEST_NAME={name}")
                      print(f"TEST_CLASS={cname}")
                      print(f"ASSERTION_MESSAGE={message or 'NOT_PRESENT_IN_XML'}")
                      print(f"EXPECTED={expected}")
                      print(f"ACTUAL={actual}")
                      print(f"STACKTRACE_FIRST_RELEVANT_LINE={first or 'NOT_PRESENT_IN_XML'}")
                      # Resolve the test method, assertion and its preceding setup/action sequence.
                      method_name = name.split("(")[0]
                      method_line = next((i for i,line in enumerate(source)
                                          if re.search(r"fun\s+" + re.escape(method_name) + r"\s*\(", line)), None)
                      line_match = re.search(r"StoreOutletControllerTest\.kt:(\d+)", first)
                      target_line = int(line_match.group(1)) if line_match else None
                      if target_line and 1 <= target_line <= len(source):
                          lo, hi = max(1,target_line-2), min(len(source),target_line+2)
                          print("ASSERTION_SOURCE_CONTEXT=" + " | ".join(f"{i}:{source[i-1].strip()}" for i in range(lo,hi+1)))
                      else:
                          print("ASSERTION_SOURCE_CONTEXT=LINE_NOT_RESOLVED_FROM_XML")
                      if method_line is not None:
                          end = next((i for i in range(method_line+1,len(source))
                                      if source[i].strip().startswith("@Test fun ")), len(source))
                          body = source[method_line:end]
                          assertion_index = None
                          if target_line:
                              assertion_index = next((i for i,line in enumerate(source[method_line:end],method_line)
                                                      if i+1 == target_line), None)
                          if assertion_index is None:
                              assertion_index = next((i for i,line in enumerate(body,method_line)
                                                      if "assert" in line), method_line)
                          setup = [f"{i+1}:{source[i].strip()}" for i in range(method_line, min(assertion_index, end))
                                   if source[i].strip() and not source[i].strip().startswith("@Test")]
                          assertion = source[assertion_index].strip() if assertion_index < len(source) else "NOT_RESOLVED"
                          print(f"ASSERTION_EXPRESSION={assertion}")
                          print("TEST_SETUP=" + (" | ".join(setup) if setup else "SEE_SOURCE_CONTEXT"))
                          print("CONTROLLER_ACTIONS_BEFORE_ASSERTION=" + (" | ".join(x for x in setup if any(k in x for k in ("controller.", "advanceUntilIdle", "runCurrent", "gate.complete"))) or "NONE_RESOLVED"))
                      else:
                          print("ASSERTION_EXPRESSION=NOT_RESOLVED_FROM_TEST_METHOD_NAME")
                          print("TEST_SETUP=INSPECT_SOURCE_CONTEXT")
                          print("CONTROLLER_ACTIONS_BEFORE_ASSERTION=INSPECT_SOURCE_CONTEXT")
          print("")
          print(f"COMMON_TESTS_EXECUTED_COUNT={executed}")
          print(f"COMMON_TESTS_FAILED_COUNT={failed}")
          if status == 0 and executed > 0 and failed == 0:
              result = "PASS"
          elif executed > 0 and failed > 0:
              result = "FAIL"
          else:
              result = "NOT_EXECUTED" if executed == 0 else "FAIL"
          print(f"COMMON_TESTS_STATUS={result}")
          PY
          cat "$RUNNER_TEMP/common-test-summary.txt"
          EXECUTED="$(sed -n 's/^COMMON_TESTS_EXECUTED_COUNT=//p' "$RUNNER_TEMP/common-test-summary.txt" | tail -1)"
          FAILED="$(sed -n 's/^COMMON_TESTS_FAILED_COUNT=//p' "$RUNNER_TEMP/common-test-summary.txt" | tail -1)"
          STATUS="$(sed -n 's/^COMMON_TESTS_STATUS=//p' "$RUNNER_TEMP/common-test-summary.txt" | tail -1)"
          echo "command=./gradlew $TASK --warning-mode all --stacktrace" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "executed=$EXECUTED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          # Deliberately do not fail this step: the Android compile and artifact upload must run too.
          exit 0

      - name: Compile Android debug application
        id: android-compile
        shell: bash
        run: |
          set -uo pipefail
          echo "ANDROID_COMPILE_COMMAND=./gradlew :app:assembleDebug --warning-mode all --stacktrace"
          echo "ANDROID_COMPILE_REACHED=YES"
          set +e
          ./gradlew :app:assembleDebug --warning-mode all --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-compile.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -eq 0 ]; then
            STATUS=PASS
            ERROR=""
            FILE=""
            LINE=""
            COLUMN=""
            KOTLIN_REACHED=YES
          else
            STATUS=FAIL
            MATCH="$(grep -m1 -E '(^e: file://|\.kt:[0-9]+:[0-9]+: error:|\.java:[0-9]+: error:|Execution failed for task|Could not resolve all files|Android debug tasks require)' "$RUNNER_TEMP/android-compile.log" || true)"
            ERROR="${MATCH:-Gradle command failed; inspect complete step log for causal error}"
            FILE=""
            LINE=""
            COLUMN=""
            KOTLIN_REACHED=NO
            if grep -Eq '(^> Task :app:compileDebugKotlin|^> Task :shared:compileDebugKotlin|^e: file://|\.kt:[0-9]+:[0-9]+: error:)' "$RUNNER_TEMP/android-compile.log"; then
              KOTLIN_REACHED=YES
            fi
            if [[ "$MATCH" =~ file://([^:]+):[[:space:]]*\(([0-9]+),[[:space:]]*([0-9]+)\) ]]; then
              FILE="${BASH_REMATCH[1]}"; LINE="${BASH_REMATCH[2]}"; COLUMN="${BASH_REMATCH[3]}"
            elif [[ "$MATCH" =~ ([^[:space:]]+\.(kt|java))[[:space:]]*:?[[:space:]]*([0-9]+):([0-9]+) ]]; then
              FILE="${BASH_REMATCH[1]}"; LINE="${BASH_REMATCH[3]}"; COLUMN="${BASH_REMATCH[4]}"
            fi
          fi
          echo "ANDROID_KOTLIN_COMPILE_REACHED=$KOTLIN_REACHED"
          echo "ANDROID_COMPILE_STATUS=$STATUS"
          echo "FIRST_REAL_ANDROID_ERROR=$ERROR"
          echo "FILE=$FILE"
          echo "LINE=$LINE"
          echo "COLUMN=$COLUMN"
          {
            echo "status=$STATUS"
            echo "error=$ERROR"
            echo "file=$FILE"
            echo "line=$LINE"
            echo "column=$COLUMN"
            echo "kotlin_reached=$KOTLIN_REACHED"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify APK provenance and prepare physical artifact
        id: physical-apk
        if: always()
        shell: bash
        env:
          CHECKOUT_SHA: ${{ steps.sha.outputs.checkout_sha }}
          ANDROID_STATUS: ${{ steps.android-compile.outputs.status }}
        run: |
          set -euo pipefail
          PHYSICAL_TARGET_SHA="179a3077c862c5d4d03934cd93a8643303493542"
          echo "PHYSICAL_TARGET_SHA=$PHYSICAL_TARGET_SHA"
          echo "CHECKOUT_SHA=$CHECKOUT_SHA"
          test "$PHYSICAL_TARGET_SHA" = "$CHECKOUT_SHA"
          test "$ANDROID_STATUS" = "PASS"
          POST_BUILD_CHECKOUT_SHA="$(git rev-parse HEAD)"
          echo "POST_BUILD_CHECKOUT_SHA=$POST_BUILD_CHECKOUT_SHA"
          test "$POST_BUILD_CHECKOUT_SHA" = "$PHYSICAL_TARGET_SHA"
          APK_PATH="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          test -f "$APK_PATH"
          APK_FILENAME="$(basename "$APK_PATH")"
          APK_SIZE_BYTES="$(stat -c '%s' "$APK_PATH")"
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          echo "APK_PATH=$APK_PATH"
          echo "APK_FILENAME=$APK_FILENAME"
          echo "APK_SIZE_BYTES=$APK_SIZE_BYTES"
          echo "APK_SHA256=$APK_SHA256"
          {
            echo "APPLICATION_TARGET_SHA=$PHYSICAL_TARGET_SHA"
            echo "CHECKOUT_SHA=$CHECKOUT_SHA"
            echo "POST_BUILD_CHECKOUT_SHA=$POST_BUILD_CHECKOUT_SHA"
            echo "APK_FILENAME=$APK_FILENAME"
            echo "APK_SHA256=$APK_SHA256"
            echo "VALIDATION_SOURCE_RUN=38617182232"
          } > android-physical-provenance.txt
          {
            echo "apk_path=$APK_PATH"
            echo "apk_filename=$APK_FILENAME"
            echo "apk_size_bytes=$APK_SIZE_BYTES"
            echo "apk_sha256=$APK_SHA256"
            echo "post_build_checkout_sha=$POST_BUILD_CHECKOUT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Android physical APK and provenance
        if: steps.physical-apk.outcome == 'success'
        id: upload-physical-apk
        uses: actions/upload-artifact@v7
        with:
          name: criosrango-android-physical-179a3077
          retention-days: 14
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            android-physical-provenance.txt

      - name: Upload JUnit XML and HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outlet-phase-a-validation-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            shared/build/test-results/**/*.xml
            shared/build/reports/tests/**

      - name: Emit validation summary and enforce gate
        if: always()
        shell: bash
        env:
          CHECKOUT_SHA: ${{ steps.sha.outputs.checkout_sha }}
          COMMON_STATUS: ${{ steps.common-tests.outputs.status }}
          COMMON_COMMAND: ${{ steps.common-tests.outputs.command }}
          COMMON_EXECUTED: ${{ steps.common-tests.outputs.executed }}
          COMMON_FAILED: ${{ steps.common-tests.outputs.failed }}
          ANDROID_STATUS: ${{ steps.android-compile.outputs.status }}
          ANDROID_ERROR: ${{ steps.android-compile.outputs.error }}
          ANDROID_KOTLIN_REACHED: ${{ steps.android-compile.outputs.kotlin_reached }}
          DEBUG_KEYSTORE_CONFIGURED: ${{ steps.signing.outputs.DEBUG_KEYSTORE_CONFIGURED }}
          DEBUG_SIGNING_CREDENTIALS_CONFIGURED: ${{ steps.signing.outputs.DEBUG_SIGNING_CREDENTIALS_CONFIGURED }}
        run: |
          {
            echo "### Outlet Full Shared Phase A validation"
            echo
            echo "- VALIDATION_WORKFLOW_SHA=$VALIDATION_WORKFLOW_SHA"
            echo "- VALIDATION_TARGET_SHA=$VALIDATION_TARGET_SHA"
            echo "- CHECKOUT_SHA=${CHECKOUT_SHA:-NOT_VERIFIED}"
            echo "- COMMON_TEST_COMMAND=${COMMON_COMMAND:-NOT_EXECUTED}"
            echo "- COMMON_TESTS_STATUS=${COMMON_STATUS:-NOT_EXECUTED}"
            echo "- COMMON_TESTS_EXECUTED_COUNT=${COMMON_EXECUTED:-0}"
            echo "- COMMON_TESTS_FAILED_COUNT=${COMMON_FAILED:-0}"
            echo "- DEBUG_KEYSTORE_CONFIGURED=${DEBUG_KEYSTORE_CONFIGURED:-NO}"
            echo "- DEBUG_SIGNING_CREDENTIALS_CONFIGURED=${DEBUG_SIGNING_CREDENTIALS_CONFIGURED:-NO}"
            echo "- ANDROID_COMPILE_STATUS=${ANDROID_STATUS:-NOT_EXECUTED}"
            echo "- ANDROID_KOTLIN_COMPILE_REACHED=${ANDROID_KOTLIN_REACHED:-NO}"
            echo "- FIRST_REAL_ANDROID_ERROR=${ANDROID_ERROR:-NONE}"
            echo "- IOS_WORKFLOW_LAUNCHED=NO"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$CHECKOUT_SHA" = "$VALIDATION_TARGET_SHA"
          test "$COMMON_STATUS" = "PASS"
          test "$ANDROID_STATUS" = "PASS"

      - name: Cleanup temporary Google Services and signing files
        if: always()
        shell: bash
        run: |
          rm -f app/google-services.json
          rm -f "$RUNNER_TEMP/criosrango-debug.jks"
