name: Catalog read-only audit

on:
  push:
    branches:
      - kmp-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-audit:
    name: WooCommerce vs app catalog audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run read-only catalog audit
        run: |
          python3 tools/catalog_audit.py --output catalog-audit.json | tee catalog-audit.log

      - name: Upload audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: catalog-audit
          path: |
            catalog-audit.json
            catalog-audit.log
          if-no-files-found: error
