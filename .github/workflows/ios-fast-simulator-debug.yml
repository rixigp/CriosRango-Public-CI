name: iOS FAST Simulator Debug

on:
  push:
    branches: [main, compose-multiplatform-convergence]
    paths:
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/ios-fast-simulator-debug.yml"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character commit SHA to build and run (defaults to this event SHA)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ios-fast-simulator-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-debug-simulator:
    name: Build, install, launch and inspect iOS Debug
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}

      - name: Verify SHA and initialize report
        id: metadata
        shell: bash
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::target_sha must be a full 40-character SHA"; exit 1; }
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "$ACTUAL_SHA" == "$TARGET_SHA" ]] || { echo "::error::Checked out SHA differs from target"; exit 1; }
          mkdir -p ios-fast-debug-artifacts
          echo "RUN_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          {
            echo "IOS FAST SIMULATOR DEBUG REPORT"
            echo "target_sha=$ACTUAL_SHA"
            echo "bundle_id=es.criosrango.app"
            echo "configuration=Debug"
            echo "Shared.framework=NOT_CHECKED"
            echo "CriosRango.app=NOT_CHECKED"
            echo "simulator_install=NOT_RUN"
            echo "app_launch=NOT_RUN"
            echo "screenshot=NOT_CAPTURED"
            echo "products_result=NOT_CHECKED"
            echo "categories_result=NOT_CHECKED"
            echo "home_state=NOT_CHECKED"
          } > ios-fast-debug-artifacts/ios-fast-simulator-debug-report.txt
          echo "target_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          DEVELOPER_DIR="/Applications/Xcode_26.6.app/Contents/Developer"
          test -d "$DEVELOPER_DIR"
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version | tee ios-fast-debug-artifacts/xcode-version.txt
          grep -q '^Xcode 26\.6$' ios-fast-debug-artifacts/xcode-version.txt
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native Konan downloads
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: macos-konan-debug-v1-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'shared/build.gradle.kts') }}
          restore-keys: |
            macos-konan-debug-v1-

      - name: Select and boot iPhone Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_INFO="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin); devices=[]
          for runtime, entries in d.get("devices",{}).items():
              if "iOS" not in runtime: continue
              for x in entries:
                  if x.get("isAvailable") and x.get("name","").startswith("iPhone"):
                      devices.append((runtime,x))
          preferred=("iPhone 17 Pro","iPhone 17","iPhone 16 Pro","iPhone 16","iPhone 15 Pro","iPhone 15")
          for name in preferred:
              m=[(r,x) for r,x in devices if x["name"]==name]
              if m:
                  r,x=sorted(m,key=lambda z:z[0])[-1]
                  print(r+"|"+x["name"]+"|"+x["udid"]); raise SystemExit
          if devices:
              r,x=sorted(devices,key=lambda z:(z[0],z[1]["name"]))[-1]
              print(r+"|"+x["name"]+"|"+x["udid"]); raise SystemExit
          raise SystemExit("No available iPhone Simulator")')"
          IFS='|' read -r SIM_RUNTIME SIM_NAME SIM_UDID <<< "$DEVICE_INFO"
          test -n "$SIM_UDID"
          echo "runtime=$SIM_RUNTIME" >> "$GITHUB_OUTPUT"
          echo "name=$SIM_NAME" >> "$GITHUB_OUTPUT"
          echo "udid=$SIM_UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Build Debug app for Simulator
        id: ios_build
        timeout-minutes: 30
        shell: bash
        env:
          TARGET_SHA: ${{ steps.metadata.outputs.target_sha }}
          SIM_UDID: ${{ steps.simulator.outputs.udid }}
          SIM_NAME: ${{ steps.simulator.outputs.name }}
        run: |
          set -euo pipefail
          REPORT=ios-fast-debug-artifacts/ios-fast-simulator-debug-report.txt
          XCODE_LOG=ios-fast-debug-artifacts/ios-fast-xcodebuild.log
          DESTINATION="platform=iOS Simulator,id=$SIM_UDID"
          DERIVED_DATA="$RUNNER_TEMP/CriosRangoDebugDerivedData"
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/CriosRango.app"
          SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          SHARED_FRAMEWORK="$GITHUB_WORKSPACE/shared/build/xcode-frameworks/Debug/iphonesimulator$SDK_VERSION/Shared.framework"
          START_EPOCH="$(date +%s)"
          XCODEBUILD_START="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "debug_build_start=$XCODEBUILD_START"
            echo "simulator_destination=$DESTINATION"
            echo "simulator_name=$SIM_NAME"
            echo "shared_framework_path=$SHARED_FRAMEWORK"
            echo "app_path=$APP_PATH"
          } | tee -a "$REPORT"
          set +e
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme CriosRangoKMPSpike \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$XCODE_LOG"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          END_EPOCH="$(date +%s)"
          XCODEBUILD_END="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          DURATION_SECONDS=$((END_EPOCH - START_EPOCH))
          if [[ -d "$SHARED_FRAMEWORK" ]]; then FRAMEWORK_STATUS=FOUND; else
            SHARED_FRAMEWORK="$(find "$GITHUB_WORKSPACE/shared/build/xcode-frameworks" -path '*/Debug/*/Shared.framework' -type d -print -quit 2>/dev/null || true)"
            [[ -n "$SHARED_FRAMEWORK" ]] && FRAMEWORK_STATUS=FOUND || FRAMEWORK_STATUS=NOT_FOUND
          fi
          [[ -d "$APP_PATH" ]] && APP_STATUS=FOUND || APP_STATUS=NOT_FOUND
          {
            echo "debug_build_end=$XCODEBUILD_END"
            echo "debug_build_duration_seconds=$DURATION_SECONDS"
            echo "Shared.framework=$FRAMEWORK_STATUS"
            echo "Shared.framework_path=${SHARED_FRAMEWORK:-NOT_FOUND}"
            echo "CriosRango.app=$APP_STATUS"
            echo "CriosRango.app_path=$APP_PATH"
          } | tee -a "$REPORT"
          echo "duration_seconds=$DURATION_SECONDS" >> "$GITHUB_OUTPUT"
          echo "shared_framework=$FRAMEWORK_STATUS" >> "$GITHUB_OUTPUT"
          echo "app_bundle=$APP_STATUS" >> "$GITHUB_OUTPUT"
          if [[ "$BUILD_STATUS" -ne 0 || "$FRAMEWORK_STATUS" != FOUND || "$APP_STATUS" != FOUND ]]; then
            echo "::error::Debug build failed or Shared.framework/CriosRango.app output is missing"
            exit 1
          fi
          BUILT_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          test "$BUILT_BUNDLE_ID" = "es.criosrango.app"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Install, launch, capture screenshots and logs
        id: runtime
        if: steps.ios_build.outcome == 'success'
        timeout-minutes: 7
        env:
          SIM_UDID: ${{ steps.simulator.outputs.udid }}
          SIM_NAME: ${{ steps.simulator.outputs.name }}
        shell: bash
        run: |
          set -uo pipefail
          ARTIFACT_DIR="$GITHUB_WORKSPACE/ios-fast-debug-artifacts"
          REPORT="$ARTIFACT_DIR/ios-fast-simulator-debug-report.txt"
          LOG_FILE="$ARTIFACT_DIR/ios-fast-simulator.log"
          LAUNCH_STDOUT="$ARTIFACT_DIR/ios-fast-launch.stdout.txt"
          LAUNCH_STDERR="$ARTIFACT_DIR/ios-fast-launch.stderr.txt"
          CRASH_LOG="$ARTIFACT_DIR/ios-fast-crash-diagnostics.log"
          ROOT_SCREENSHOT="$ARTIFACT_DIR/ios-fast-debug-after-root.png"
          HOME_SCREENSHOT="$ARTIFACT_DIR/ios-fast-debug-home.png"
          FINAL_SCREENSHOT="$ARTIFACT_DIR/ios-fast-debug-final.png"
          : > "$LOG_FILE"; : > "$LAUNCH_STDOUT"; : > "$LAUNCH_STDERR"; : > "$CRASH_LOG"
          LOG_PID=""
          LAUNCH_EXIT_CODE=NOT_RECORDED
          NOTIFICATION_PREAUTH=SKIPPED
          APP_PID=NOT_FOUND
          APP_PROCESS_AFTER_LAUNCH=UNKNOWN
          APP_PROCESS_AFTER_ROOT=UNKNOWN
          ROOT_SCREEN=NOT_FOUND
          HOME_READY=NOT_FOUND
          PRODUCTS_COUNT=NOT_FOUND
          CATEGORIES_COUNT=NOT_FOUND
          SCREENSHOT_AFTER_ROOT=NOT_CAPTURED
          SCREENSHOT_HOME=NOT_CAPTURED
          screenshot() {
            local path="$1"
            if xcrun simctl io "$SIM_UDID" screenshot "$path" >> "$LOG_FILE" 2>&1 && [[ -s "$path" ]]; then
              echo "Screenshot captured: $(basename "$path")" | tee -a "$LOG_FILE"
              return 0
            fi
            echo "Screenshot failed: $(basename "$path")" | tee -a "$LOG_FILE"
            return 1
          }
          app_process_state() {
            local pid="$APP_PID"
            if [[ "$pid" =~ ^[0-9]+$ ]]; then
              if xcrun simctl spawn "$SIM_UDID" launchctl procinfo "$pid" >/dev/null 2>&1; then
                printf 'RUNNING'
                return
              fi
            fi
            if xcrun simctl spawn "$SIM_UDID" launchctl list 2>/dev/null | grep -Fq 'es.criosrango.app'; then
              printf 'RUNNING_PID_UNKNOWN'
            else
              printf 'NOT_RUNNING'
            fi
          }
          collect_crash_diagnostics() {
            {
              echo "===== recent simulator crash/termination diagnostics ====="
              xcrun simctl spawn "$SIM_UDID" log show --last 10m --style compact --predicate '(process == "CriosRango" OR process == "CriosRangoKMPSpike") AND (eventMessage CONTAINS[c] "crash" OR eventMessage CONTAINS[c] "exception" OR eventMessage CONTAINS[c] "terminat" OR eventMessage CONTAINS[c] "abort" OR eventMessage CONTAINS[c] "killed")' 2>&1 || true
              echo "===== app-related crash reports ====="
              find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \( -iname '*CriosRango*' -o -iname '*CriosRangoKMPSpike*' \) -mmin -20 -print -exec tail -n 100 {} \; 2>/dev/null || true
            } >> "$CRASH_LOG"
          }
          cleanup() {
            if [[ -n "$LOG_PID" ]]; then kill "$LOG_PID" 2>/dev/null || true; wait "$LOG_PID" 2>/dev/null || true; fi
            xcrun simctl spawn "$SIM_UDID" log show --last 10m --style compact --predicate 'process == "CriosRango" OR process == "CriosRangoKMPSpike" OR eventMessage CONTAINS[c] "KMP_RUNTIME" OR eventMessage CONTAINS[c] "Ktor" OR eventMessage CONTAINS[c] "HTTP" OR eventMessage CONTAINS[c] "exception" OR eventMessage CONTAINS[c] "crash" OR eventMessage CONTAINS[c] "terminat"' >> "$LOG_FILE" 2>&1 || true
            collect_crash_diagnostics
            {
              echo "SIMCTL_LAUNCH_STDOUT=$(tr '\n' ' ' < "$LAUNCH_STDOUT" | sed -E 's/[[:space:]]+$//')"
              echo "SIMCTL_LAUNCH_EXIT_CODE=$LAUNCH_EXIT_CODE"
              echo "APP_PID=$APP_PID"
              echo "APP_PROCESS_AFTER_LAUNCH=$APP_PROCESS_AFTER_LAUNCH"
              echo "ROOT_SCREEN=$ROOT_SCREEN"
              echo "APP_PROCESS_AFTER_ROOT=$APP_PROCESS_AFTER_ROOT"
              echo "HOME_READY=$HOME_READY"
              echo "PRODUCTS_COUNT=$PRODUCTS_COUNT"
              echo "CATEGORIES_COUNT=$CATEGORIES_COUNT"
              if [[ "$LAUNCH_EXIT_CODE" == "0" && "$HOME_READY" != "FOUND" ]]; then
                echo "MARKER_CLASSIFICATION=OBSERVABILITY_REVIEW_REQUIRED"
                echo "Marker absence is not a functional failure by itself; inspect final screenshot."
              else
                echo "MARKER_CLASSIFICATION=MARKERS_CAPTURED_OR_LAUNCH_FAILED"
              fi
              echo "SCREENSHOT_AFTER_ROOT=$SCREENSHOT_AFTER_ROOT"
              echo "SCREENSHOT_HOME=$SCREENSHOT_HOME"
            } >> "$REPORT"
            {
              echo "simctl_launch_exit_code=$LAUNCH_EXIT_CODE"
              echo "app_pid=$APP_PID"
              echo "app_process_after_launch=$APP_PROCESS_AFTER_LAUNCH"
              echo "root_screen=$ROOT_SCREEN"
              echo "app_process_after_root=$APP_PROCESS_AFTER_ROOT"
              echo "home_ready=$HOME_READY"
              echo "products_count=$PRODUCTS_COUNT"
              echo "categories_count=$CATEGORIES_COUNT"
              echo "screenshot_after_root=$SCREENSHOT_AFTER_ROOT"
              echo "screenshot_home=$SCREENSHOT_HOME"
            } >> "$GITHUB_OUTPUT"
          }
          trap cleanup EXIT

          echo "Simulator: $SIM_NAME ($SIM_UDID)" | tee -a "$LOG_FILE"
          if xcrun simctl install "$SIM_UDID" "$APP_PATH" 2>&1 | tee -a "$LOG_FILE"; then
            echo "simulator_install=GREEN" | tee -a "$LOG_FILE" "$GITHUB_OUTPUT"
            echo "simulator_install=GREEN" >> "$REPORT"
          else
            echo "simulator_install=RED" | tee -a "$LOG_FILE" "$GITHUB_OUTPUT"
            echo "simulator_install=RED" >> "$REPORT"
            exit 1
          fi

          # Optional notification preauthorization: never install Homebrew packages in FAST.
          if command -v applesimutils >/dev/null 2>&1; then
            if applesimutils --byId "$SIM_UDID" --bundle "es.criosrango.app" --setPermissions "notifications=YES" 2>&1 | tee -a "$LOG_FILE"; then
              NOTIFICATION_PREAUTH=GRANTED
            else
              NOTIFICATION_PREAUTH=SKIPPED
            fi
          else
            NOTIFICATION_PREAUTH=SKIPPED
          fi
          echo "NOTIFICATION_PREAUTH=$NOTIFICATION_PREAUTH" | tee -a "$LOG_FILE" "$REPORT"

          # Keep the unified log stream independent from simctl launch's process.
          xcrun simctl spawn "$SIM_UDID" log stream --style compact --level debug --predicate 'process == "CriosRango" OR process == "CriosRangoKMPSpike" OR eventMessage CONTAINS[c] "KMP_RUNTIME" OR eventMessage CONTAINS[c] "Ktor" OR eventMessage CONTAINS[c] "HTTP" OR eventMessage CONTAINS[c] "exception" OR eventMessage CONTAINS[c] "crash" OR eventMessage CONTAINS[c] "terminat"' >> "$LOG_FILE" 2>&1 &
          LOG_PID=$!
          sleep 2

          set +e
          xcrun simctl launch --terminate-running-process "$SIM_UDID" es.criosrango.app >"$LAUNCH_STDOUT" 2>"$LAUNCH_STDERR"
          LAUNCH_EXIT_CODE=$?
          set -e
          cat "$LAUNCH_STDOUT" | tee -a "$LOG_FILE"
          cat "$LAUNCH_STDERR" | tee -a "$LOG_FILE"
          echo "SIMCTL_LAUNCH_EXIT_CODE=$LAUNCH_EXIT_CODE" | tee -a "$LOG_FILE"
          LAUNCH_STDOUT_VALUE="$(tr '\n' ' ' < "$LAUNCH_STDOUT" | sed -E 's/[[:space:]]+$//')"
          echo "SIMCTL_LAUNCH_STDOUT=$LAUNCH_STDOUT_VALUE" | tee -a "$LOG_FILE"
          echo "SIMCTL_LAUNCH_STDOUT=$LAUNCH_STDOUT_VALUE" >> "$REPORT"
          echo "SIMCTL_LAUNCH_EXIT_CODE=$LAUNCH_EXIT_CODE" >> "$REPORT"
          echo "simctl_launch_exit_code=$LAUNCH_EXIT_CODE" >> "$GITHUB_OUTPUT"

          # simctl may print "es.criosrango.app: 50386" rather than "pid: 50386".
          # Extract the final integer token and reject anything non-numeric.
          APP_PID="$(grep -Eo '[0-9]+' "$LAUNCH_STDOUT" | tail -1 || true)"
          [[ "$APP_PID" =~ ^[0-9]+$ ]] || APP_PID=NOT_FOUND
          APP_PROCESS_AFTER_LAUNCH="$(app_process_state)"
          echo "APP_PID=$APP_PID" | tee -a "$LOG_FILE"
          echo "APP_PROCESS_AFTER_LAUNCH=$APP_PROCESS_AFTER_LAUNCH" | tee -a "$LOG_FILE"

          # Launch-command failure and a process that dies are hard failures.
          if [[ "$LAUNCH_EXIT_CODE" -ne 0 ]]; then
            echo "LAUNCH_FAILURE=YES" | tee -a "$LOG_FILE"
            exit 1
          fi

          # Allow startup briefly, then gate on process liveness rather than UI markers.
          sleep 3
          APP_PROCESS_AFTER_LAUNCH="$(app_process_state)"
          echo "APP_PROCESS_AFTER_GRACE_PERIOD=$APP_PROCESS_AFTER_LAUNCH" | tee -a "$LOG_FILE"
          if [[ "$APP_PROCESS_AFTER_LAUNCH" == NOT_RUNNING ]]; then
            echo "APP_PROCESS_ALIVE_AFTER_GRACE_PERIOD=NO" | tee -a "$LOG_FILE"
            collect_crash_diagnostics
            exit 1
          fi
          echo "APP_PROCESS_ALIVE_AFTER_GRACE_PERIOD=YES" | tee -a "$LOG_FILE"

          # ROOT/HOME are diagnostic markers only. One bounded 15-second window.
          for i in $(seq 1 15); do
            if [[ "$ROOT_SCREEN" == NOT_FOUND ]] && grep -q 'KMP_RUNTIME_ROOT_SCREEN_READY' "$LOG_FILE"; then
              ROOT_SCREEN=FOUND
              echo "ROOT_SCREEN_READY=FOUND" | tee -a "$LOG_FILE"
            fi
            HOME_LINE="$(grep -E 'KMP_RUNTIME_HOME_READY.*products=[0-9]+.*categories=[0-9]+' "$LOG_FILE" | tail -1 || true)"
            if [[ -n "$HOME_LINE" ]]; then
              HOME_READY=FOUND
              PRODUCTS_COUNT="$(printf '%s' "$HOME_LINE" | sed -nE 's/.*products=([0-9]+).*/\1/p')"
              CATEGORIES_COUNT="$(printf '%s' "$HOME_LINE" | sed -nE 's/.*categories=([0-9]+).*/\1/p')"
            fi
            APP_PROCESS_AFTER_ROOT="$(app_process_state)"
            if [[ "$APP_PROCESS_AFTER_ROOT" == NOT_RUNNING ]]; then
              echo "APP_PROCESS_ALIVE_DURING_MARKER_WINDOW=NO" | tee -a "$LOG_FILE"
              collect_crash_diagnostics
              exit 1
            fi
            [[ "$ROOT_SCREEN" == FOUND && "$HOME_READY" == FOUND ]] && break
            sleep 1
          done

          if [[ "$ROOT_SCREEN" == FOUND ]]; then
            if screenshot "$ROOT_SCREENSHOT"; then SCREENSHOT_AFTER_ROOT=FOUND; else SCREENSHOT_AFTER_ROOT=FAILED; fi
          else
            echo "ROOT_SCREEN_READY=ABSENT (OBSERVABILITY_WARNING)" | tee -a "$LOG_FILE"
          fi
          if [[ "$HOME_READY" == FOUND ]]; then
            if screenshot "$HOME_SCREENSHOT"; then SCREENSHOT_HOME=FOUND; else SCREENSHOT_HOME=FAILED; fi
          else
            echo "HOME_READY=ABSENT (OBSERVABILITY_WARNING)" | tee -a "$LOG_FILE"
          fi

          # Screenshot capture is best-effort; it is not a FAST gate.
          screenshot "$FINAL_SCREENSHOT" || true
          APP_PROCESS_AFTER_ROOT="$(app_process_state)"
          [[ "$APP_PROCESS_AFTER_ROOT" != NOT_RUNNING ]] || { echo "APP_PROCESS_ALIVE_AFTER_GRACE_PERIOD=NO"; exit 1; }
          echo "OBSERVABILITY_WARNING=$([[ "$ROOT_SCREEN" == FOUND && "$HOME_READY" == FOUND ]] && echo NO || echo YES)" >> "$REPORT"
          echo "APP_PROCESS_ALIVE_AFTER_GRACE_PERIOD=YES" >> "$REPORT"
          echo "app_launch=GREEN" >> "$REPORT"
          echo "home_state=$([[ "$HOME_READY" == FOUND ]] && echo OK || echo OBSERVABILITY_WARNING)" >> "$REPORT"
          echo "screenshot=$([[ "$SCREENSHOT_HOME" == FOUND ]] && echo FOUND || echo OBSERVABILITY_WARNING)" >> "$REPORT"
          exit 0

      - name: Final report and total duration
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.ios_build.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          INSTALL_RESULT: ${{ steps.runtime.outputs.simulator_install }}
          LAUNCH_EXIT_CODE: ${{ steps.runtime.outputs.simctl_launch_exit_code }}
          APP_PID: ${{ steps.runtime.outputs.app_pid }}
          PROCESS_AFTER_LAUNCH: ${{ steps.runtime.outputs.app_process_after_launch }}
          ROOT_SCREEN: ${{ steps.runtime.outputs.root_screen }}
          PROCESS_AFTER_ROOT: ${{ steps.runtime.outputs.app_process_after_root }}
          HOME_READY: ${{ steps.runtime.outputs.home_ready }}
          PRODUCTS_COUNT: ${{ steps.runtime.outputs.products_count }}
          CATEGORIES_COUNT: ${{ steps.runtime.outputs.categories_count }}
          SCREENSHOT_AFTER_ROOT: ${{ steps.runtime.outputs.screenshot_after_root }}
          SCREENSHOT_HOME: ${{ steps.runtime.outputs.screenshot_home }}
          SHARED_FRAMEWORK: ${{ steps.ios_build.outputs.shared_framework }}
          APP_BUNDLE: ${{ steps.ios_build.outputs.app_bundle }}
          BUILD_DURATION: ${{ steps.ios_build.outputs.duration_seconds }}
          TARGET_SHA: ${{ steps.metadata.outputs.target_sha }}
        run: |
          set -u
          REPORT=ios-fast-debug-artifacts/ios-fast-simulator-debug-report.txt
          [[ -f "$REPORT" ]] || { mkdir -p ios-fast-debug-artifacts; echo "IOS FAST SIMULATOR DEBUG REPORT" > "$REPORT"; }
          [[ -f ios-fast-debug-artifacts/ios-fast-simulator.log ]] || : > ios-fast-debug-artifacts/ios-fast-simulator.log
          [[ -f ios-fast-debug-artifacts/ios-fast-xcodebuild.log ]] || : > ios-fast-debug-artifacts/ios-fast-xcodebuild.log
          [[ -f ios-fast-debug-artifacts/ios-fast-launch.stdout.txt ]] || : > ios-fast-debug-artifacts/ios-fast-launch.stdout.txt
          [[ -f ios-fast-debug-artifacts/ios-fast-launch.stderr.txt ]] || : > ios-fast-debug-artifacts/ios-fast-launch.stderr.txt
          [[ -f ios-fast-debug-artifacts/ios-fast-crash-diagnostics.log ]] || : > ios-fast-debug-artifacts/ios-fast-crash-diagnostics.log
          ROOT_STATUS="${ROOT_SCREEN:-NOT_RECORDED}"
          HOME_STATUS="${HOME_READY:-NOT_RECORDED}"
          PRODUCTS="${PRODUCTS_COUNT:-NOT_RECORDED}"
          CATEGORIES="${CATEGORIES_COUNT:-NOT_RECORDED}"
          ROOTSHOT="${SCREENSHOT_AFTER_ROOT:-NOT_RECORDED}"
          HOMESHOT="${SCREENSHOT_HOME:-NOT_RECORDED}"
          [[ -s ios-fast-debug-artifacts/ios-fast-debug-after-root.png ]] && ROOTSHOT=FOUND
          [[ -s ios-fast-debug-artifacts/ios-fast-debug-home.png ]] && HOMESHOT=FOUND
          FINALSHOT=NOT_FOUND
          [[ -s ios-fast-debug-artifacts/ios-fast-debug-final.png ]] && FINALSHOT=FOUND
          START_EPOCH="${RUN_START_EPOCH:-$(date +%s)}"
          TOTAL_DURATION=$(( $(date +%s) - START_EPOCH ))
          {
            echo "target_sha=$TARGET_SHA"
            echo "debug_build_duration_seconds=${BUILD_DURATION:-NOT_RECORDED}"
            echo "total_duration_seconds=$TOTAL_DURATION"
            echo "Shared.framework=${SHARED_FRAMEWORK:-NOT_CHECKED}"
            echo "CriosRango.app=${APP_BUNDLE:-NOT_CHECKED}"
            echo "simulator_install=${INSTALL_RESULT:-NOT_RECORDED}"
            echo "SIMCTL_LAUNCH_EXIT_CODE=${LAUNCH_EXIT_CODE:-NOT_RECORDED}"
            echo "APP_PID=${APP_PID:-NOT_FOUND}"
            echo "APP_PROCESS_AFTER_LAUNCH=${PROCESS_AFTER_LAUNCH:-UNKNOWN}"
            echo "ROOT_SCREEN=$ROOT_STATUS"
            echo "APP_PROCESS_AFTER_ROOT=${PROCESS_AFTER_ROOT:-UNKNOWN}"
            echo "HOME_READY=$HOME_STATUS"
            echo "PRODUCTS_COUNT=$PRODUCTS"
            echo "CATEGORIES_COUNT=$CATEGORIES"
            echo "SCREENSHOT_AFTER_ROOT=$ROOTSHOT"
            echo "SCREENSHOT_HOME=$HOMESHOT"
            echo "SCREENSHOT_FINAL=$FINALSHOT"
            echo "app_launch=${LAUNCH_EXIT_CODE:-NOT_RECORDED}"
            echo "home_state=$([[ "$HOME_STATUS" == FOUND ]] && echo OK || echo ERROR)"
            echo "products_count=$PRODUCTS"
            echo "categories_count=$CATEGORIES"
            echo "screenshot=$HOMESHOT"
          } >> "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug Simulator evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-fast-simulator-debug-${{ github.run_id }}
          path: ios-fast-debug-artifacts/**
          if-no-files-found: warn
          retention-days: 14
