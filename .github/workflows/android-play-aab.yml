name: Android Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-play-aab:
    name: Build and verify signed Play AAB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: kmp-migration

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Check required signing secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          test -n "$ANDROID_UPLOAD_STORE_PASSWORD"
          test -n "$ANDROID_UPLOAD_KEY_ALIAS"
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD"

      - name: Prepare Google Services
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s app/google-services.json
          chmod 600 app/google-services.json

      - name: Reconstruct temporary upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/criosrango-upload.jks"
          test -s "$RUNNER_TEMP/criosrango-upload.jks"
          chmod 600 "$RUNNER_TEMP/criosrango-upload.jks"

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/criosrango-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:bundleRelease --stacktrace

      - name: Verify exactly one AAB
        id: aab
        run: |
          set -euo pipefail
          AAB_COUNT=$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | wc -l)
          test "$AAB_COUNT" -eq 1
          AAB_PATH="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -s "$AAB_PATH"
          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"
          echo "AAB_NAME=$(basename "$AAB_PATH")"
          echo "AAB_SIZE=$(stat -c '%s' "$AAB_PATH") bytes"
          echo "AAB_SHA256=$(sha256sum "$AAB_PATH" | awk '{print $1}')"

      - name: Verify AAB signature
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/criosrango-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list -v             -keystore "$ANDROID_KEYSTORE_PATH"             -storepass:env ANDROID_KEYSTORE_PASSWORD             -alias "$ANDROID_KEY_ALIAS"             | grep -E 'Alias name:|Entry type:|SHA256:'
          AAB_PATH="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          jarsigner -verify -verbose -certs "$AAB_PATH"

      - name: Inspect AAB manifest and contents
        run: |
          set -euo pipefail
          BUNDLETOOL_VERSION="1.18.3"
          curl --fail --silent --show-error --location             "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"             --output "$RUNNER_TEMP/bundletool.jar"

          AAB_PATH="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          MANIFEST="$RUNNER_TEMP/aab-manifest.txt"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$AAB_PATH" > "$MANIFEST"

          grep -q 'package="es.criosrango.app"' "$MANIFEST"
          grep -q 'android:versionCode="165"' "$MANIFEST"
          grep -q 'android:versionName="1.0.165"' "$MANIFEST"
          ! grep -q 'CrashlyticsDebugCrashActivity' "$MANIFEST"

          unzip -t "$AAB_PATH" >/dev/null
          unzip -l "$AAB_PATH" | grep -E 'base/manifest/AndroidManifest.xml|base/dex/|base/res/|BundleConfig.pb'

      - name: Write non-sensitive metadata
        id: metadata
        run: |
          set -euo pipefail
          AAB_PATH="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          {
            echo "applicationId=es.criosrango.app"
            echo "versionName=1.0.165"
            echo "versionCode=165"
            echo "minSdk=24"
            echo "targetSdk=36"
            echo "minifyEnabled=true"
            echo "shrinkResources=true"
            echo "aabSha256=$(sha256sum "$AAB_PATH" | awk '{print $1}')"
          } > "$RUNNER_TEMP/criosrango-aab-metadata.txt"
          cp "$RUNNER_TEMP/criosrango-aab-metadata.txt" criosrango-aab-metadata.txt

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: criosrango-1.0.165-play-aab
          retention-days: 7
          path: |
            ${{ steps.aab.outputs.aab_path }}
            criosrango-aab-metadata.txt
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/criosrango-upload.jks"
          rm -f app/google-services.json
          rm -f "$RUNNER_TEMP/bundletool.jar"
          rm -f "$RUNNER_TEMP/aab-manifest.txt"
          rm -f "$RUNNER_TEMP/criosrango-aab-metadata.txt"
          rm -f criosrango-aab-metadata.txt
