name: Android Play AAB

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact commit SHA to build"
        required: true
        type: string
      play_track:
        description: "Google Play destination track"
        required: true
        type: choice
        options:
          - internal
          - production
        default: internal

permissions:
  contents: read

env:
  BUNDLETOOL_VERSION: "1.18.3"
  BUNDLETOOL_SHA256: "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
  EXPECTED_PACKAGE: "es.criosrango.app"
  DEFAULT_TRACK: "internal"
  EXPECTED_MIN_SDK: "24"
  EXPECTED_TARGET_SDK: "36"
  EXPECTED_UPLOAD_ALIAS: "criosrango-upload"

jobs:
  android-play-aab:
    name: Build and verify signed Play AAB
    runs-on: ubuntu-24.04
    steps:
      - name: Guard develop/1.0.3 provenance before checkout or build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/develop/1.0.3" ]] || { echo "::error::Android Play AAB must be dispatched from develop/1.0.3"; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::target_sha must be exactly 40 hexadecimal characters"; exit 1; }
          CURRENT_BRANCH_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop/1.0.3" --jq '.object.sha')"
          [[ "$CURRENT_BRANCH_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve current develop/1.0.3 SHA"; exit 1; }
          [[ "$TARGET_SHA" == "$CURRENT_BRANCH_SHA" ]] || { echo "::error::target_sha is not current develop/1.0.3"; exit 1; }
          echo "CURRENT_BRANCH_SHA=$CURRENT_BRANCH_SHA"

      - name: Checkout exact target SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha }}

      - name: Verify checked out SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "${{ inputs.target_sha }}" ]]; then
            echo "::error::Checked out SHA does not match target_sha"
            exit 1
          fi
          echo "Checked out requested target SHA."

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Read application version
        id: app-version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep -E 'versionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          VERSION_CODE="$(grep -E 'versionCode[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/')"
          test "$VERSION_NAME" = "1.0.3" || { echo "::error::VERSION_NAME must be 1.0.3"; exit 1; }
          test "$VERSION_CODE" = "20012" || { echo "::error::VERSION_CODE must be 20012"; exit 1; }
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION_NAME / $VERSION_CODE"

      - name: Check required secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          test -n "$ANDROID_UPLOAD_STORE_PASSWORD"
          test -n "$ANDROID_UPLOAD_KEY_ALIAS"
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD"
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          echo "Required release secrets are present."

      - name: Prepare Google Services
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          chmod 600 app/google-services.json
          test -s app/google-services.json

      - name: Reconstruct temporary upload JKS
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/criosrango-upload.jks"
          chmod 600 "$RUNNER_TEMP/criosrango-upload.jks"
          test -s "$RUNNER_TEMP/criosrango-upload.jks"

      - name: Verify upload certificate before build
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ "$ANDROID_UPLOAD_KEY_ALIAS" != "$EXPECTED_UPLOAD_ALIAS" ]]; then
            echo "::error::Upload key alias does not match the expected release alias"
            exit 1
          fi

          export LANG=C
          export LC_ALL=C
          if ! keytool -J-Duser.language=en -J-Duser.country=US -list \
            -keystore "$RUNNER_TEMP/criosrango-upload.jks" \
            -storepass "$ANDROID_UPLOAD_STORE_PASSWORD" \
            > "$RUNNER_TEMP/upload-keystore-check.txt" 2>&1; then
            echo "::error::Upload keystore cannot be opened with the configured store password (wrong password or invalid/corrupt keystore data)"
            exit 1
          fi

          if ! keytool -J-Duser.language=en -J-Duser.country=US -list -v \
            -keystore "$RUNNER_TEMP/criosrango-upload.jks" \
            -storepass "$ANDROID_UPLOAD_STORE_PASSWORD" \
            -alias "$ANDROID_UPLOAD_KEY_ALIAS" \
            > "$RUNNER_TEMP/upload-cert.txt" 2>&1; then
            echo "::error::Expected upload alias is not present in the configured upload keystore"
            exit 1
          fi

          if ! grep -q '^Entry type: PrivateKeyEntry$' "$RUNNER_TEMP/upload-cert.txt"; then
            echo "::error::Upload keystore alias is not a PrivateKeyEntry"
            exit 1
          fi

          PUBKEY_LINE="$(grep -m1 '^Subject Public Key Algorithm:' "$RUNNER_TEMP/upload-cert.txt" || true)"
          if [[ "$PUBKEY_LINE" != *RSA* ]]; then
            echo "::error::Upload certificate public key algorithm is not RSA"
            exit 1
          fi
          if [[ "$PUBKEY_LINE" != *4096-bit* ]]; then
            echo "::error::Upload certificate RSA key size is not 4096 bits"
            exit 1
          fi

          echo "Upload certificate: expected alias, PrivateKeyEntry, RSA-4096 validated."

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/criosrango-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew clean :app:bundleRelease --warning-mode all --stacktrace

      - name: Locate exact release AAB
        id: aab
        shell: bash
        run: |
          set -euo pipefail
          AAB_COUNT=$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | wc -l)
          test "$AAB_COUNT" -eq 1
          SOURCE_AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -s "$SOURCE_AAB"
          AAB_NAME="CriosRango-v${VERSION_NAME}-build${VERSION_CODE}-release.aab"
          cp "$SOURCE_AAB" "$AAB_NAME"
          SHA256="$(sha256sum "$AAB_NAME" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$AAB_NAME")"
          echo "aab_path=$AAB_NAME" >> "$GITHUB_OUTPUT"
          echo "aab_sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "aab_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "AAB: $AAB_NAME"
          echo "AAB SHA-256: $SHA256"
          echo "AAB size: $SIZE bytes"

      - name: Verify AAB signature and certificate match
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          AAB="${{ steps.aab.outputs.aab_path }}"
          KEYSTORE_CERT="$RUNNER_TEMP/keystore-cert.txt"
          AAB_CERT="$RUNNER_TEMP/aab-cert.txt"
          keytool -list -v \
            -keystore "$RUNNER_TEMP/criosrango-upload.jks" \
            -storepass "$ANDROID_UPLOAD_STORE_PASSWORD" \
            -alias "$ANDROID_UPLOAD_KEY_ALIAS" > "$KEYSTORE_CERT"
          jarsigner -verify -verbose -certs "$AAB" > "$RUNNER_TEMP/jarsigner.txt"
          grep -q "jar verified." "$RUNNER_TEMP/jarsigner.txt"
          SIGNATURE_ENTRY="$(unzip -Z1 "$AAB" | grep -E '^META-INF/[^/]+\.(RSA|DSA|EC)$' | head -1)"
          test -n "$SIGNATURE_ENTRY"
          unzip -p "$AAB" "$SIGNATURE_ENTRY" > "$RUNNER_TEMP/aab-cert.der"
          keytool -printcert -file "$RUNNER_TEMP/aab-cert.der" > "$AAB_CERT"
          EXPECTED_SHA1="$(grep -m1 'SHA1:' "$KEYSTORE_CERT" | sed 's/.*SHA1: //' | tr -d '[:space:]')"
          ACTUAL_SHA1="$(grep -m1 'SHA1:' "$AAB_CERT" | sed 's/.*SHA1: //' | tr -d '[:space:]')"
          EXPECTED_SHA256="$(grep -m1 'SHA256:' "$KEYSTORE_CERT" | sed 's/.*SHA256: //' | tr -d '[:space:]')"
          ACTUAL_SHA256="$(grep -m1 'SHA256:' "$AAB_CERT" | sed 's/.*SHA256: //' | tr -d '[:space:]')"
          test -n "$EXPECTED_SHA1"
          test -n "$ACTUAL_SHA1"
          test -n "$EXPECTED_SHA256"
          test -n "$ACTUAL_SHA256"
          test "$EXPECTED_SHA1" = "$ACTUAL_SHA1"
          test "$EXPECTED_SHA256" = "$ACTUAL_SHA256"
          SUBJECT="$(grep -m1 'Owner:' "$AAB_CERT" | sed 's/.*Owner: //')"
          echo "AAB signature: VALID"
          echo "Upload certificate SHA-1: $ACTUAL_SHA1"
          echo "Upload certificate SHA-256: $ACTUAL_SHA256"
          echo "Upload certificate subject: $SUBJECT"
          echo "Upload certificate algorithm/key size: RSA 4096"
          echo "Certificate match against supplied upload keystore: PASS"
          echo "Debug certificate check: PASS"

      - name: Validate AAB with pinned bundletool
        shell: bash
        run: |
          set -euo pipefail
          AAB="${{ steps.aab.outputs.aab_path }}"
          BUNDLETOOL="$RUNNER_TEMP/bundletool.jar"
          curl --fail --silent --show-error --location \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "$BUNDLETOOL"
          echo "${BUNDLETOOL_SHA256}  $BUNDLETOOL" | sha256sum --check --status
          java -jar "$BUNDLETOOL" version
          java -jar "$BUNDLETOOL" validate --bundle "$AAB"
          MANIFEST="$RUNNER_TEMP/aab-manifest.xml"
          java -jar "$BUNDLETOOL" dump manifest --bundle "$AAB" > "$MANIFEST"
          grep -q 'package="es.criosrango.app"' "$MANIFEST"
          grep -Fq "android:versionName=\"$VERSION_NAME\"" "$MANIFEST"
          grep -Fq "android:versionCode=\"$VERSION_CODE\"" "$MANIFEST"
          grep -q 'android:minSdkVersion="24"' "$MANIFEST"
          grep -q 'android:targetSdkVersion="36"' "$MANIFEST"
          if grep -q 'CrashlyticsDebugCrashActivity' "$MANIFEST"; then
            echo "::error::CrashlyticsDebugCrashActivity leaked into release AAB"
            exit 1
          fi
          if grep -Eq 'android.intent.category.LAUNCHER.*Debug|Debug.*android.intent.category.LAUNCHER' "$MANIFEST"; then
            echo "::error::Debug-only launcher leaked into release AAB"
            exit 1
          fi
          unzip -t "$AAB" >/dev/null
          AAB_CONTENTS="$RUNNER_TEMP/aab-contents.txt"
          unzip -Z1 "$AAB" > "$AAB_CONTENTS"
          grep -q '^base/manifest/AndroidManifest.xml$' "$AAB_CONTENTS"
          grep -q '^base/dex/.*\.dex$' "$AAB_CONTENTS"
          grep -q '^base/resources.pb$' "$AAB_CONTENTS"
          grep -q '^BundleConfig.pb$' "$AAB_CONTENTS"
          echo "bundletool version: $BUNDLETOOL_VERSION"
          echo "bundletool validation: PASS"
          echo "Base manifest/resources/dex: PASS"
          echo "CrashlyticsDebugCrashActivity: ABSENT"
          echo "Debug-only launcher: ABSENT"

      - name: Validate R8, resource shrinking, and Crashlytics mapping
        run: |
          set -euo pipefail
          test -s app/build/outputs/mapping/release/mapping.txt
          test -s app/build/outputs/mapping/release/resources.txt
          grep -q 'isMinifyEnabled = true' app/build.gradle.kts
          grep -q 'isShrinkResources = true' app/build.gradle.kts
          APP_TASKS="$RUNNER_TEMP/app-tasks.txt"
          ./gradlew :app:tasks --all > "$APP_TASKS"
          grep -q 'uploadCrashlyticsMappingFileRelease' "$APP_TASKS"
          echo "R8 mapping.txt: GENERATED"
          echo "Resource shrink diagnostic resources.txt: GENERATED"
          echo "Release minify: ENABLED"
          echo "Release shrinkResources: ENABLED"
          echo "Crashlytics mapping upload task: CONFIGURED"

      - name: Upload Crashlytics mapping
        run: |
          set -euo pipefail
          ./gradlew :app:uploadCrashlyticsMappingFileRelease --stacktrace
          echo "Crashlytics mapping upload task: COMPLETED"
          echo "Firebase-side receipt is not asserted beyond successful Gradle upload task."

      - name: Write non-sensitive release report
        run: |
          set -euo pipefail
          {
            echo "applicationId=$EXPECTED_PACKAGE"
            echo "versionName=$VERSION_NAME"
            echo "versionCode=$VERSION_CODE"
            echo "minSdk=$EXPECTED_MIN_SDK"
            echo "targetSdk=$EXPECTED_TARGET_SDK"
            echo "minifyEnabled=true"
            echo "shrinkResources=true"
            echo "crashlytics=integrated"
            echo "CrashlyticsDebugCrashActivity=absent"
            echo "debug-only-launcher=absent"
            echo "bundletool=$BUNDLETOOL_VERSION"
            echo "aab_name=${{ steps.aab.outputs.aab_path }}"
            echo "aab_sha256=${{ steps.aab.outputs.aab_sha256 }}"
            echo "aab_size_bytes=${{ steps.aab.outputs.aab_size }}"
            echo "upload_alias=$EXPECTED_UPLOAD_ALIAS"
            echo "keystore_published=false"
            echo "secret_values_published=false"
            echo "google_services_json_published=false"
          } > criosrango-release-aab-report.txt

      - name: Upload signed AAB
        uses: actions/upload-artifact@v7
        with:
          name: CriosRango-v${{ steps.app-version.outputs.version_name }}-build${{ steps.app-version.outputs.version_code }}-release-aab
          retention-days: 7
          path: ${{ steps.aab.outputs.aab_path }}
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: CriosRango-v${{ steps.app-version.outputs.version_name }}-build${{ steps.app-version.outputs.version_code }}-r8-mapping
          retention-days: 7
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload non-sensitive release report
        uses: actions/upload-artifact@v7
        with:
          name: CriosRango-v${{ steps.app-version.outputs.version_name }}-build${{ steps.app-version.outputs.version_code }}-release-report
          retention-days: 7
          path: criosrango-release-aab-report.txt
          if-no-files-found: error

      - name: Validate manual Play publishing selection
        id: play-selection
        shell: bash
        env:
          PLAY_TRACK: ${{ inputs.play_track || env.DEFAULT_TRACK }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || { echo "::error::Google Play publishing is manual-dispatch only"; exit 1; }
          case "$PLAY_TRACK" in
            internal|production) ;;
            *) echo "::error::Invalid play_track; only internal or production is accepted"; exit 1 ;;
          esac
          echo "play_track=$PLAY_TRACK" >> "$GITHUB_OUTPUT"
          echo "PLAY_TRACK=$PLAY_TRACK" >> "$GITHUB_ENV"

      - name: Publish validated AAB to Google Play
        id: play-publish
        shell: bash
        env:
          GOOGLE_PLAY_AUTH: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: ${{ env.EXPECTED_PACKAGE }}
          PLAY_TRACK: ${{ steps.play-selection.outputs.play_track }}
          AAB_PATH: ${{ steps.aab.outputs.aab_path }}
          EXPECTED_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_PLAY_AUTH" || { echo "::error::GOOGLE_PLAY_AUTH secret is missing"; exit 1; }
          test -s "$AAB_PATH"
          python3 -m pip install --disable-pip-version-check --quiet google-api-python-client google-auth google-auth-httplib2
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError

          package = os.environ["PACKAGE_NAME"]
          track = os.environ["PLAY_TRACK"]
          expected_code = int(os.environ["EXPECTED_VERSION_CODE"])
          aab_path = Path(os.environ["AAB_PATH"])
          output_path = os.environ["GITHUB_OUTPUT"]

          def output(key, value):
              with open(output_path, "a", encoding="utf-8") as stream:
                  stream.write(f"{key}={value}\n")

          output("auth", "FAILURE")
          output("edit_id", "")
          output("bundle_version_code", "")
          output("release_status", "NOT_PUBLISHED")
          output("committed", "false")
          output("upload_status", "FAILURE")

          edit_id = None
          verification_edit_id = None
          committed = False
          try:
              info = json.loads(os.environ["GOOGLE_PLAY_AUTH"])
              credentials = service_account.Credentials.from_service_account_info(
                  info,
                  scopes=["https://www.googleapis.com/auth/androidpublisher"],
              )
              publisher = build("androidpublisher", "v3", credentials=credentials, cache_discovery=False)
              edit = publisher.edits().insert(packageName=package, body={}).execute()
              edit_id = edit["id"]
              output("auth", "SUCCESS")
              print("PLAY_AUTH=SUCCESS")
              output("edit_id", edit_id)
              print(f"PLAY_EDIT_ID={edit_id}")

              existing = []
              token = None
              while True:
                  request = publisher.edits().bundles().list(
                      packageName=package, editId=edit_id, pageToken=token
                  )
                  response = request.execute()
                  existing.extend(int(item["versionCode"]) for item in response.get("bundles", []))
                  token = response.get("nextPageToken")
                  if not token:
                      break
              if expected_code in existing:
                  print(f"::error::PLAY_VERSION_CODE_ALREADY_EXISTS versionCode={expected_code}")
                  output("upload_status", "PLAY_VERSION_CODE_ALREADY_EXISTS")
                  sys.exit(23)

              upload = publisher.edits().bundles().upload(
                  packageName=package,
                  editId=edit_id,
                  media_body=MediaFileUpload(str(aab_path), mimetype="application/octet-stream", resumable=True),
              ).execute()
              bundle_code = int(upload["versionCode"])
              output("bundle_version_code", bundle_code)
              print(f"PLAY_BUNDLE_VERSION_CODE={bundle_code}")
              if bundle_code != expected_code:
                  raise RuntimeError(f"Uploaded versionCode {bundle_code} does not match expected {expected_code}")

              release_status = "completed"
              publisher.edits().tracks().update(
                  packageName=package,
                  editId=edit_id,
                  track=track,
                  body={"releases": [{"versionCodes": [str(bundle_code)], "status": release_status}]},
              ).execute()
              output("release_status", release_status)
              print(f"PLAY_RELEASE_STATUS={release_status}")

              # Verify the staged track contents before committing the edit.
              staged = publisher.edits().tracks().get(
                  packageName=package, editId=edit_id, track=track
              ).execute()
              staged_codes = {
                  str(code)
                  for release in staged.get("releases", [])
                  for code in release.get("versionCodes", [])
              }
              if str(bundle_code) not in staged_codes:
                  raise RuntimeError("Track verification did not return the uploaded versionCode")

              publisher.edits().commit(packageName=package, editId=edit_id).execute()
              committed = True
              output("committed", "true")
              output("upload_status", "SUCCESS")
              print("PLAY_EDIT_COMMITTED=true")

              # Read back the committed track in a fresh edit, then discard that read-only edit.
              verification_edit = publisher.edits().insert(packageName=package, body={}).execute()
              verification_edit_id = verification_edit["id"]
              verified = publisher.edits().tracks().get(
                  packageName=package, editId=verification_edit_id, track=track
              ).execute()
              verified_releases = [
                  release for release in verified.get("releases", [])
                  if str(bundle_code) in {str(code) for code in release.get("versionCodes", [])}
              ]
              if not verified_releases or any(r.get("status") != release_status for r in verified_releases):
                  raise RuntimeError("Committed Google Play track read-back verification failed")
              publisher.edits().delete(packageName=package, editId=verification_edit_id).execute()
              verification_edit_id = None
              print("PLAY_TRACK_READBACK=PASS")
          except SystemExit:
              raise
          except Exception as exc:
              # Deliberately avoid printing exception bodies, request headers, credentials, or tokens.
              print(f"::error::Google Play publishing failed ({type(exc).__name__})")
              output("upload_status", "FAILURE_AFTER_COMMIT" if committed else "FAILURE")
              raise
          finally:
              if verification_edit_id:
                  try:
                      publisher.edits().delete(packageName=package, editId=verification_edit_id).execute()
                  except Exception:
                      print("::warning::Could not discard read-back verification edit")
              if edit_id and not committed:
                  try:
                      publisher.edits().delete(packageName=package, editId=edit_id).execute()
                  except Exception:
                      print("::warning::Could not discard uncommitted Google Play edit")
          PY

      - name: Final Google Play publishing report
        if: always()
        shell: bash
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          TARGET_SHA: ${{ inputs.target_sha }}
          PLAY_TRACK: ${{ inputs.play_track }}
          AAB_PATH: ${{ steps.aab.outputs.aab_path }}
          AAB_SIGNED: ${{ steps.signature-validation.outcome }}
          BUNDLETOOL_VALIDATION: ${{ steps.bundletool-validation.outcome }}
          PLAY_AUTH: ${{ steps.play-publish.outputs.auth }}
          PLAY_EDIT_ID: ${{ steps.play-publish.outputs.edit_id }}
          PLAY_BUNDLE_VERSION_CODE: ${{ steps.play-publish.outputs.bundle_version_code }}
          PLAY_RELEASE_STATUS: ${{ steps.play-publish.outputs.release_status }}
          PLAY_EDIT_COMMITTED: ${{ steps.play-publish.outputs.committed }}
          PLAY_UPLOAD_STATUS: ${{ steps.play-publish.outputs.upload_status }}
        run: |
          {
            echo "PACKAGE_NAME=$EXPECTED_PACKAGE"
            echo "VERSION_NAME=${VERSION_NAME:-NOT_BUILT}"
            echo "VERSION_CODE=${VERSION_CODE:-NOT_BUILT}"
            echo "TARGET_SHA=$TARGET_SHA"
            echo "PLAY_TRACK=${PLAY_TRACK:-NOT_SELECTED}"
            echo "AAB_PATH=${AAB_PATH:-NOT_BUILT}"
            echo "AAB_SIGNED=${AAB_SIGNED:-NOT_REACHED}"
            echo "BUNDLETOOL_VALIDATION=${BUNDLETOOL_VALIDATION:-NOT_REACHED}"
            echo "PLAY_AUTH=${PLAY_AUTH:-NOT_ATTEMPTED}"
            echo "PLAY_EDIT_ID=${PLAY_EDIT_ID:-NOT_CREATED}"
            echo "PLAY_BUNDLE_VERSION_CODE=${PLAY_BUNDLE_VERSION_CODE:-NOT_UPLOADED}"
            echo "PLAY_RELEASE_STATUS=${PLAY_RELEASE_STATUS:-NOT_PUBLISHED}"
            echo "PLAY_EDIT_COMMITTED=${PLAY_EDIT_COMMITTED:-false}"
            echo "PLAY_UPLOAD_STATUS=${PLAY_UPLOAD_STATUS:-NOT_ATTEMPTED}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cleanup all temporary signing/config material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/criosrango-upload.jks"
          rm -f "$RUNNER_TEMP/upload-cert.txt"
          rm -f "$RUNNER_TEMP/upload-keystore-check.txt"
          rm -f "$RUNNER_TEMP/keystore-cert.txt"
          rm -f "$RUNNER_TEMP/aab-cert.txt"
          rm -f "$RUNNER_TEMP/aab-cert.der"
          rm -f "$RUNNER_TEMP/jarsigner.txt"
          rm -f "$RUNNER_TEMP/bundletool.jar"
          rm -f "$RUNNER_TEMP/aab-manifest.xml"
          rm -f "$RUNNER_TEMP/aab-contents.txt"
          rm -f "$RUNNER_TEMP/app-tasks.txt"
          rm -f app/google-services.json
