name: KMP Migration iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  android:
    name: Android validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Google Services
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s app/google-services.json

      - name: Prepare permanent debug keystore
        env:
          CRIOSRANGO_DEBUG_KEYSTORE_BASE64: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_BASE64 }}
          CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD }}
          CRIOSRANGO_DEBUG_KEY_ALIAS: ${{ secrets.CRIOSRANGO_DEBUG_KEY_ALIAS }}
          CRIOSRANGO_DEBUG_KEY_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CRIOSRANGO_DEBUG_KEYSTORE_BASE64"
          test -n "$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD"
          test -n "$CRIOSRANGO_DEBUG_KEY_ALIAS"
          test -n "$CRIOSRANGO_DEBUG_KEY_PASSWORD"

          printf '%s' "$CRIOSRANGO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/criosrango-debug.jks"
          chmod 600 "$RUNNER_TEMP/criosrango-debug.jks"
          test -s "$RUNNER_TEMP/criosrango-debug.jks"

          {
            echo "CRIOSRANGO_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/criosrango-debug.jks"
            echo "CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD=$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD"
            echo "CRIOSRANGO_DEBUG_KEY_ALIAS=$CRIOSRANGO_DEBUG_KEY_ALIAS"
            echo "CRIOSRANGO_DEBUG_KEY_PASSWORD=$CRIOSRANGO_DEBUG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Verify permanent signing certificate
        env:
          CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD }}
          CRIOSRANGO_DEBUG_KEY_ALIAS: ${{ secrets.CRIOSRANGO_DEBUG_KEY_ALIAS }}
        run: |
          set -euo pipefail

          FINGERPRINT="$(
            keytool -list -v \
              -keystore "$RUNNER_TEMP/criosrango-debug.jks" \
              -storepass "$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD" \
              -alias "$CRIOSRANGO_DEBUG_KEY_ALIAS" |
            awk -F': ' '/SHA256:/{print $2; exit}'
          )"

          EXPECTED="53:A6:C9:CA:97:22:5E:9A:62:E1:0F:FD:45:EA:27:4F:3B:B2:27:16:77:E0:F8:79:90:68:A8:CD:69:E7:DC:CE"

          test "$FINGERPRINT" = "$EXPECTED"

          echo "Android signing certificate SHA-256: $FINGERPRINT"

      - name: Build Android
        run: ./gradlew :app:assembleDebug :shared:compileDebugKotlinAndroid --stacktrace

      - name: Prepare named APKs
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -E 'versionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/')
          VERSIONED_APK="CriosRango-v${VERSION_NAME}-code${VERSION_CODE}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$VERSIONED_APK"
          cp app/build/outputs/apk/debug/app-debug.apk CriosRango-latest.apk
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "versioned_apk=$VERSIONED_APK" >> "$GITHUB_OUTPUT"
          ls -lh "$VERSIONED_APK" CriosRango-latest.apk

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: CriosRango-v${{ steps.apk.outputs.version_name }}-code${{ steps.apk.outputs.version_code }}
          retention-days: 2
          path: |
            ${{ steps.apk.outputs.versioned_apk }}
            CriosRango-latest.apk

      - name: Publish latest development APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONED_APK: ${{ steps.apk.outputs.versioned_apk }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
        run: |
          set -euo pipefail
          RELEASE_NOTES="CriosRango v${VERSION_NAME} code ${VERSION_CODE} - automatic development build from commit ${GITHUB_SHA}"

          if ! gh release view dev-latest >/dev/null 2>&1; then
            gh release create dev-latest \
              --title "Development latest" \
              --notes "$RELEASE_NOTES" \
              --prerelease \
              --target "${GITHUB_SHA}"
          else
            gh release edit dev-latest \
              --title "Development latest" \
              --notes "$RELEASE_NOTES" \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi

          gh release upload dev-latest \
            "$VERSIONED_APK" \
            CriosRango-latest.apk \
            --clobber

      - name: Cleanup Google Services
        if: always()
        run: rm -f app/google-services.json

      - name: Cleanup signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/criosrango-debug.jks"

  ios:
    name: iOS simulator build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Google Services
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s app/google-services.json

      - name: Build Kotlin iOS framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build iOS app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme CriosRangoKMPSpike \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$GITHUB_WORKSPACE/ios-derived-data" \
            build

      - name: Runtime smoke test on iOS Simulator
        run: |
          set -euo pipefail
          echo "Available iOS Simulator devices:"
          xcrun simctl list devices available

          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; data=json.load(sys.stdin); [print(d["udid"]) or sys.exit(0) for devices in data.get("devices", {}).values() for d in devices if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]; sys.exit("No available iPhone Simulator device found")')"
          echo "Selected available iPhone Simulator UDID: $UDID"

          trap 'xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH="$GITHUB_WORKSPACE/ios-derived-data/Build/Products/Debug-iphonesimulator/CriosRangoKMPSpike.app"
          echo "Generated iOS app Info.plist:"
          plutil -p "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print" "$APP_PATH/Info.plist"
          CADISABLE_FRAME_DURATION="$(/usr/libexec/PlistBuddy -c "Print :CADisableMinimumFrameDurationOnPhone" "$APP_PATH/Info.plist")"
          echo "CADisableMinimumFrameDurationOnPhone=$CADISABLE_FRAME_DURATION"
          test "$CADISABLE_FRAME_DURATION" = "true"
          CF_BUNDLE_EXECUTABLE="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")"
          EXECUTABLE_NAME="$(xcodebuild -project iosApp/iosApp.xcodeproj -scheme CriosRangoKMPSpike -configuration Debug -sdk iphonesimulator -showBuildSettings | awk -F " = " '/^[[:space:]]*EXECUTABLE_NAME = / {print $2; exit}')"
          echo "CFBundleExecutable=$CF_BUNDLE_EXECUTABLE"
          echo "EXECUTABLE_NAME=$EXECUTABLE_NAME"
          test -n "$CF_BUNDLE_EXECUTABLE"
          test "$CF_BUNDLE_EXECUTABLE" = "$EXECUTABLE_NAME"
          test -f "$APP_PATH/$CF_BUNDLE_EXECUTABLE"
          echo "Validated executable: $APP_PATH/$CF_BUNDLE_EXECUTABLE"
          xcrun simctl install "$UDID" "$APP_PATH"
          CONSOLE_LOG="$GITHUB_WORKSPACE/kmp-runtime-console.log"
          rm -f "$CONSOLE_LOG"
          xcrun simctl launch --console-pty "$UDID" es.criosrango.kmpspike >"$CONSOLE_LOG" 2>&1 &
          CONSOLE_PID=$!
          echo "simctl console PID: $CONSOLE_PID"

          FOUND=0
          for i in $(seq 1 30); do
            if grep -q "KMP_RUNTIME_HTTP_STATUS_PRODUCTS status=200" "$CONSOLE_LOG" && grep -q "KMP_RUNTIME_HTTP_STATUS_CATEGORIES status=200" "$CONSOLE_LOG" && grep -Eq "KMP_RUNTIME_PRODUCTS_COUNT count=[1-9][0-9]*" "$CONSOLE_LOG" && grep -Eq "KMP_RUNTIME_CATEGORIES_COUNT count=[1-9][0-9]*" "$CONSOLE_LOG" && grep -q "KMP_MODEL_ASSERTION_PRODUCT_IS_IN_STOCK_MATCH=PASS" "$CONSOLE_LOG" && grep -q "KMP_MODEL_ASSERTION_PRODUCT_PURCHASABLE_MATCH=PASS" "$CONSOLE_LOG" && grep -q "KMP_MODEL_ASSERTION_CATEGORY_PARENT_MATCH=PASS" "$CONSOLE_LOG" && grep -q "KMP_MODEL_ASSERTION_CATEGORY_COUNT_MATCH=PASS" "$CONSOLE_LOG" && grep -q "KMP_MODEL_PRODUCT_PERMALINK_PRESENT=true" "$CONSOLE_LOG" && grep -q "KMP_MODEL_PRODUCT_PRICE_PRESENT=true" "$CONSOLE_LOG" && grep -q "KMP_MODEL_PRODUCT_IMAGE_SRC_PRESENT=true" "$CONSOLE_LOG" && grep -q "KMP_MODEL_PRODUCT_DESCRIPTION_PRESENT=true" "$CONSOLE_LOG" && grep -q "KMP_MODEL_CATEGORY_SLUG_PRESENT=true" "$CONSOLE_LOG"; then
              FOUND=1
              break
            fi
            if ! kill -0 "$CONSOLE_PID" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          if kill -0 "$CONSOLE_PID" >/dev/null 2>&1; then
            kill "$CONSOLE_PID" >/dev/null 2>&1 || true
          fi
          wait "$CONSOLE_PID" >/dev/null 2>&1 || true

          echo "Runtime console output:"
          cat "$CONSOLE_LOG" || true
          echo "Application PID(s):"
          xcrun simctl spawn "$UDID" pgrep -f "es.criosrango.kmpspike" 2>&1 || true

          if [ "$FOUND" -ne 1 ]; then
            echo "Runtime smoke markers were not all captured from direct app console."
            echo "Crash indicators:"
            grep -Ei "crash|exception|fatal|abort|terminated|killed" "$CONSOLE_LOG" || true
            echo "First likely error:"
            grep -Ein "error|exception|fatal|crash|abort|failed" "$CONSOLE_LOG" | head -n 1 || true
            exit 1
          fi

      - name: Cleanup Google Services
        if: always()
        run: rm -f app/google-services.json
