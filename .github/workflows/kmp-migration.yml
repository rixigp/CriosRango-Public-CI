name: KMP Migration iOS

on:
  push:
    branches:
      - main
      - kmp-migration
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  android:
    name: Android validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Google Services
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s app/google-services.json

      - name: Prepare permanent debug keystore
        env:
          CRIOSRANGO_DEBUG_KEYSTORE_BASE64: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_BASE64 }}
          CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD }}
          CRIOSRANGO_DEBUG_KEY_ALIAS: ${{ secrets.CRIOSRANGO_DEBUG_KEY_ALIAS }}
          CRIOSRANGO_DEBUG_KEY_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CRIOSRANGO_DEBUG_KEYSTORE_BASE64"
          test -n "$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD"
          test -n "$CRIOSRANGO_DEBUG_KEY_ALIAS"
          test -n "$CRIOSRANGO_DEBUG_KEY_PASSWORD"

          printf '%s' "$CRIOSRANGO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/criosrango-debug.jks"
          chmod 600 "$RUNNER_TEMP/criosrango-debug.jks"
          test -s "$RUNNER_TEMP/criosrango-debug.jks"

          {
            echo "CRIOSRANGO_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/criosrango-debug.jks"
            echo "CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD=$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD"
            echo "CRIOSRANGO_DEBUG_KEY_ALIAS=$CRIOSRANGO_DEBUG_KEY_ALIAS"
            echo "CRIOSRANGO_DEBUG_KEY_PASSWORD=$CRIOSRANGO_DEBUG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Verify permanent signing certificate
        env:
          CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          STOREPASS="$(printf '%s' "$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          echo "STOREPASS length: ${#STOREPASS}"

          keytool -list \
            -keystore "$RUNNER_TEMP/criosrango-debug.jks" \
            -storepass "$STOREPASS" \
            -alias "criosrango-development"

      - name: Compile and test shared KMP checkout
        run: ./gradlew :shared:compileDebugKotlinAndroid :shared:testDebugUnitTest --stacktrace

      - name: Read-only checkout gateway audit
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -D "$RUNNER_TEMP/cart.headers" \
            "https://criosrango.es/wp-json/wc/store/v1/cart" \
            -o "$RUNNER_TEMP/cart.json"
          CART_TOKEN="$(awk 'BEGIN{IGNORECASE=1} /^Cart-Token:/ {gsub("\r","",$2); print $2}' "$RUNNER_TEMP/cart.headers")"
          test -n "$CART_TOKEN"
          curl --fail --silent --show-error --location \
            -H "Cart-Token: $CART_TOKEN" \
            "https://criosrango.es/wp-json/wc/store/v1/checkout" \
            -o "$RUNNER_TEMP/checkout.json"
          python3 - "$RUNNER_TEMP/checkout.json" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text())
          methods=[]
          methods.extend(data.get("payment_methods") or [])
          methods.extend((data.get("__experimentalCart") or {}).get("payment_methods") or [])
          print("CHECKOUT_GATEWAYS_RAW=" + ",".join(dict.fromkeys(str(x).strip() for x in methods if str(x).strip())))
          PY

      - name: Live cart add-clear-add smoke test
        shell: bash
        run: |
          set -euo pipefail
          HEADERS="$RUNNER_TEMP/live-cart.headers"
          CART="$RUNNER_TEMP/live-cart.json"
          PRODUCTS="$RUNNER_TEMP/live-products.json"
          curl --fail --silent --show-error --location -D "$HEADERS" \
            "https://criosrango.es/wp-json/wc/store/v1/cart" -o "$CART"
          CART_TOKEN="$(awk 'BEGIN{IGNORECASE=1} /^Cart-Token:/ {gsub("\r","",$2); print $2}' "$HEADERS")"
          NONCE="$(awk 'BEGIN{IGNORECASE=1} /^Nonce:/ {gsub("\r","",$2); print $2}' "$HEADERS")"
          COOKIE="$(awk 'BEGIN{IGNORECASE=1} /^Set-Cookie:/ {gsub("\r","",$0); sub(/^[^:]*:[[:space:]]*/,""); sub(/;.*/,""); print}' "$HEADERS" | paste -sd ';' -)"
          test -n "$CART_TOKEN"
          curl --fail --silent --show-error --location \
            -H "Cart-Token: $CART_TOKEN" -H "Nonce: $NONCE" -H "Cookie: $COOKIE" \
            "https://criosrango.es/wp-json/wc/store/v1/products?per_page=20" -o "$PRODUCTS"
          PRODUCT_ID="$(python3 - "$PRODUCTS" <<'PY'
          import json, sys
          for p in json.load(open(sys.argv[1])):
              if p.get("id") and p.get("is_purchasable", True):
                  print(p["id"]); break
          else:
              raise SystemExit("No purchasable product found for isolated live cart smoke test")
          PY
          )"
          test -n "$PRODUCT_ID"
          curl --fail --silent --show-error --location \
            -H "Cart-Token: $CART_TOKEN" -H "Nonce: $NONCE" -H "Cookie: $COOKIE" \
            -H "Content-Type: application/json" --data "{\"id\":$PRODUCT_ID,\"quantity\":1}" \
            "https://criosrango.es/wp-json/wc/store/v1/cart/add-item" -o "$RUNNER_TEMP/live-add-1.json"
          python3 - "$RUNNER_TEMP/live-add-1.json" "$PRODUCT_ID" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1])); pid=int(sys.argv[2])
          assert any(int(x.get("id",0)) == pid and int(x.get("quantity",0)) == 1 for x in d.get("items",[])), d
          PY
          curl --fail --silent --show-error --location -X DELETE \
            -H "Cart-Token: $CART_TOKEN" -H "Nonce: $NONCE" -H "Cookie: $COOKIE" \
            "https://criosrango.es/wp-json/wc/store/v1/cart/items" -o "$RUNNER_TEMP/live-clear.json"
          curl --fail --silent --show-error --location \
            -H "Cart-Token: $CART_TOKEN" -H "Nonce: $NONCE" -H "Cookie: $COOKIE" \
            "https://criosrango.es/wp-json/wc/store/v1/cart" -o "$RUNNER_TEMP/live-after-clear.json"
          python3 - "$RUNNER_TEMP/live-after-clear.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1])); assert d.get("items") == [], d
          PY
          curl --fail --silent --show-error --location \
            -H "Cart-Token: $CART_TOKEN" -H "Nonce: $NONCE" -H "Cookie: $COOKIE" \
            -H "Content-Type: application/json" --data "{\"id\":$PRODUCT_ID,\"quantity\":1}" \
            "https://criosrango.es/wp-json/wc/store/v1/cart/add-item" -o "$RUNNER_TEMP/live-add-2.json"
          curl --fail --silent --show-error --location \
            -H "Cart-Token: $CART_TOKEN" -H "Nonce: $NONCE" -H "Cookie: $COOKIE" \
            "https://criosrango.es/wp-json/wc/store/v1/cart" -o "$RUNNER_TEMP/live-after-add-2.json"
          python3 - "$RUNNER_TEMP/live-after-add-2.json" "$PRODUCT_ID" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1])); pid=int(sys.argv[2]); items=d.get("items",[])
          assert len(items) == 1 and int(items[0].get("id",0)) == pid and int(items[0].get("quantity",0)) == 1, d
          print(f"LIVE_CART_ADD_CLEAR_ADD_PASS product={pid} quantity=1")
          PY

      - name: Compile Android app
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Assemble Android debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare named APKs
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -E 'versionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/')
          VERSIONED_APK="CriosRango-v${VERSION_NAME}-code${VERSION_CODE}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$VERSIONED_APK"
          cp app/build/outputs/apk/debug/app-debug.apk CriosRango-latest.apk
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "versioned_apk=$VERSIONED_APK" >> "$GITHUB_OUTPUT"
          ls -lh "$VERSIONED_APK" CriosRango-latest.apk

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: CriosRango-v${{ steps.apk.outputs.version_name }}-code${{ steps.apk.outputs.version_code }}
          retention-days: 2
          path: |
            ${{ steps.apk.outputs.versioned_apk }}
            CriosRango-latest.apk

      - name: Publish latest development APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONED_APK: ${{ steps.apk.outputs.versioned_apk }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
        run: |
          set -euo pipefail
          RELEASE_NOTES="CriosRango v${VERSION_NAME} code ${VERSION_CODE} - automatic development build from commit ${GITHUB_SHA}"

          if ! gh release view dev-latest >/dev/null 2>&1; then
            gh release create dev-latest \
              --title "Development latest" \
              --notes "$RELEASE_NOTES" \
              --prerelease \
              --target "${GITHUB_SHA}"
          else
            gh release edit dev-latest \
              --title "Development latest" \
              --notes "$RELEASE_NOTES" \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi

          gh release upload dev-latest \
            "$VERSIONED_APK" \
            CriosRango-latest.apk \
            --clobber

      - name: Cleanup Google Services
        if: always()
        run: rm -f app/google-services.json

      - name: Cleanup signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/criosrango-debug.jks"

  ios:
    name: iOS simulator build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Google Services
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s app/google-services.json

      - name: Prepare permanent debug keystore
        env:
          CRIOSRANGO_DEBUG_KEYSTORE_BASE64: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_BASE64 }}
          CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD }}
          CRIOSRANGO_DEBUG_KEY_ALIAS: ${{ secrets.CRIOSRANGO_DEBUG_KEY_ALIAS }}
          CRIOSRANGO_DEBUG_KEY_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CRIOSRANGO_DEBUG_KEYSTORE_BASE64"
          test -n "$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD"
          test -n "$CRIOSRANGO_DEBUG_KEY_ALIAS"
          test -n "$CRIOSRANGO_DEBUG_KEY_PASSWORD"

          printf '%s' "$CRIOSRANGO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/criosrango-debug.jks"
          chmod 600 "$RUNNER_TEMP/criosrango-debug.jks"
          test -s "$RUNNER_TEMP/criosrango-debug.jks"

          {
            echo "CRIOSRANGO_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/criosrango-debug.jks"
            echo "CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD=$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD"
            echo "CRIOSRANGO_DEBUG_KEY_ALIAS=$CRIOSRANGO_DEBUG_KEY_ALIAS"
            echo "CRIOSRANGO_DEBUG_KEY_PASSWORD=$CRIOSRANGO_DEBUG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Kotlin iOS framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build iOS app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme CriosRangoKMPSpike \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$GITHUB_WORKSPACE/ios-derived-data" \
            build

      - name: Runtime smoke test on iOS Simulator
        run: |
          set -euo pipefail
          echo "Available iOS Simulator devices:"
          xcrun simctl list devices available

          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; data=json.load(sys.stdin); [print(d["udid"]) or sys.exit(0) for devices in data.get("devices", {}).values() for d in devices if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]; sys.exit("No available iPhone Simulator device found")')"
          echo "Selected available iPhone Simulator UDID: $UDID"

          trap 'xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH="$GITHUB_WORKSPACE/ios-derived-data/Build/Products/Debug-iphonesimulator/CriosRangoKMPSpike.app"
          echo "Generated iOS app Info.plist:"
          plutil -p "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print" "$APP_PATH/Info.plist"
          CADISABLE_FRAME_DURATION="$(/usr/libexec/PlistBuddy -c "Print :CADisableMinimumFrameDurationOnPhone" "$APP_PATH/Info.plist")"
          echo "CADisableMinimumFrameDurationOnPhone=$CADISABLE_FRAME_DURATION"
          test "$CADISABLE_FRAME_DURATION" = "true"
          CF_BUNDLE_EXECUTABLE="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")"
          EXECUTABLE_NAME="$(xcodebuild -project iosApp/iosApp.xcodeproj -scheme CriosRangoKMPSpike -configuration Debug -sdk iphonesimulator -showBuildSettings | awk -F " = " '/^[[:space:]]*EXECUTABLE_NAME = / {print $2; exit}')"
          echo "CFBundleExecutable=$CF_BUNDLE_EXECUTABLE"
          echo "EXECUTABLE_NAME=$EXECUTABLE_NAME"
          test -n "$CF_BUNDLE_EXECUTABLE"
          test "$CF_BUNDLE_EXECUTABLE" = "$EXECUTABLE_NAME"
          test -f "$APP_PATH/$CF_BUNDLE_EXECUTABLE"
          echo "Validated executable: $APP_PATH/$CF_BUNDLE_EXECUTABLE"
          xcrun simctl install "$UDID" "$APP_PATH"
          CONSOLE_LOG="$GITHUB_WORKSPACE/kmp-runtime-console.log"
          rm -f "$CONSOLE_LOG"
          xcrun simctl launch --console-pty "$UDID" es.criosrango.kmpspike >"$CONSOLE_LOG" 2>&1 &
          CONSOLE_PID=$!
          echo "simctl console PID: $CONSOLE_PID"

          FOUND=0
          for i in $(seq 1 30); do
            if grep -q "KMP_RUNTIME_HTTP_STATUS_PRODUCTS status=200" "$CONSOLE_LOG" && grep -q "KMP_RUNTIME_HTTP_STATUS_CATEGORIES status=200" "$CONSOLE_LOG" && grep -Eq "KMP_RUNTIME_PRODUCTS_COUNT count=[1-9][0-9]*" "$CONSOLE_LOG" && grep -Eq "KMP_RUNTIME_CATEGORIES_COUNT count=[1-9][0-9]*" "$CONSOLE_LOG" && grep -q "KMP_MODEL_ASSERTION_PRODUCT_IS_IN_STOCK_MATCH=PASS" "$CONSOLE_LOG" && grep -q "KMP_MODEL_ASSERTION_PRODUCT_PURCHASABLE_MATCH=PASS" "$CONSOLE_LOG" && grep -q "KMP_MODEL_ASSERTION_CATEGORY_PARENT_MATCH=PASS" "$CONSOLE_LOG" && grep -q "KMP_MODEL_ASSERTION_CATEGORY_COUNT_MATCH=PASS" "$CONSOLE_LOG" && grep -q "KMP_MODEL_PRODUCT_PERMALINK_PRESENT=true" "$CONSOLE_LOG" && grep -q "KMP_MODEL_PRODUCT_PRICE_PRESENT=true" "$CONSOLE_LOG" && grep -q "KMP_MODEL_PRODUCT_IMAGE_SRC_PRESENT=true" "$CONSOLE_LOG" && grep -q "KMP_MODEL_PRODUCT_DESCRIPTION_PRESENT=true" "$CONSOLE_LOG" && grep -q "KMP_MODEL_CATEGORY_SLUG_PRESENT=true" "$CONSOLE_LOG" && grep -q "KMP_RUNTIME_HTTP_STATUS_CART status=200" "$CONSOLE_LOG" && grep -q "KMP_RUNTIME_HTTP_STATUS_CART_SECOND status=200" "$CONSOLE_LOG" && grep -q "KMP_MODEL_ASSERTION_CART_MODEL_PARSED=PASS" "$CONSOLE_LOG" && grep -q "KMP_MODEL_ASSERTION_CART_TOKEN_RETAINED=PASS" "$CONSOLE_LOG" && grep -q "KMP_MODEL_ASSERTION_NONCE_RETAINED=PASS" "$CONSOLE_LOG" && grep -q "KMP_MODEL_ASSERTION_COOKIE_RETAINED=PASS" "$CONSOLE_LOG"; then
              FOUND=1
              break
            fi
            if ! kill -0 "$CONSOLE_PID" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          if kill -0 "$CONSOLE_PID" >/dev/null 2>&1; then
            kill "$CONSOLE_PID" >/dev/null 2>&1 || true
          fi
          wait "$CONSOLE_PID" >/dev/null 2>&1 || true

          echo "Runtime console output:"
          cat "$CONSOLE_LOG" || true
          echo "Application PID(s):"
          xcrun simctl spawn "$UDID" pgrep -f "es.criosrango.kmpspike" 2>&1 || true

          if [ "$FOUND" -ne 1 ]; then
            echo "Runtime smoke markers were not all captured from direct app console."
            echo "Crash indicators:"
            grep -Ei "crash|exception|fatal|abort|terminated|killed" "$CONSOLE_LOG" || true
            echo "First likely error:"
            grep -Ein "error|exception|fatal|crash|abort|failed" "$CONSOLE_LOG" | head -n 1 || true
            exit 1
          fi

      - name: Cleanup signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/criosrango-debug.jks"

      - name: Cleanup Google Services
        if: always()
        run: rm -f app/google-services.json
