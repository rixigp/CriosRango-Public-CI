name: KMP Migration iOS

on:
  push:
    branches:
      - main
      - kmp-migration
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  validation:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Android validation
            platform: android
            runner: ubuntu-24.04
          - name: iOS simulator build
            platform: ios
            runner: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Google Services
        if: ${{ matrix.platform == 'android' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s app/google-services.json
      - name: Prepare permanent debug keystore
        if: ${{ matrix.platform == 'android' }}
        env:
          CRIOSRANGO_DEBUG_KEYSTORE_BASE64: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_BASE64 }}
          CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD }}
          CRIOSRANGO_DEBUG_KEY_ALIAS: ${{ secrets.CRIOSRANGO_DEBUG_KEY_ALIAS }}
          CRIOSRANGO_DEBUG_KEY_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CRIOSRANGO_DEBUG_KEYSTORE_BASE64"
          test -n "$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD"
          test -n "$CRIOSRANGO_DEBUG_KEY_ALIAS"
          test -n "$CRIOSRANGO_DEBUG_KEY_PASSWORD"
          printf '%s' "$CRIOSRANGO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/criosrango-debug.jks"
          chmod 600 "$RUNNER_TEMP/criosrango-debug.jks"
          test -s "$RUNNER_TEMP/criosrango-debug.jks"
          {
            echo "CRIOSRANGO_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/criosrango-debug.jks"
            echo "CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD=$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD"
            echo "CRIOSRANGO_DEBUG_KEY_ALIAS=$CRIOSRANGO_DEBUG_KEY_ALIAS"
            echo "CRIOSRANGO_DEBUG_KEY_PASSWORD=$CRIOSRANGO_DEBUG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Verify permanent signing certificate
        if: ${{ matrix.platform == 'android' }}
        env:
          CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          STOREPASS="$(printf '%s' "$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          echo "STOREPASS length: ${#STOREPASS}"
          keytool -list -keystore "$RUNNER_TEMP/criosrango-debug.jks" -storepass "$STOREPASS" -alias "criosrango-development"
      - name: Compile and test shared KMP checkout
        if: ${{ matrix.platform == 'android' }}
        run: ./gradlew :shared:compileDebugKotlinAndroid :shared:testDebugUnitTest :app:testDebugUnitTest --stacktrace
      - name: Read-only checkout gateway audit
        if: ${{ matrix.platform == 'android' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location -D "$RUNNER_TEMP/cart.headers" "https://criosrango.es/wp-json/wc/store/v1/cart" -o "$RUNNER_TEMP/cart.json"
          CART_TOKEN="$(awk 'BEGIN{IGNORECASE=1} /^Cart-Token:/ {gsub("\r","",$2); print $2}' "$RUNNER_TEMP/cart.headers")"
          test -n "$CART_TOKEN"
          curl --fail --silent --show-error --location -H "Cart-Token: $CART_TOKEN" "https://criosrango.es/wp-json/wc/store/v1/checkout" -o "$RUNNER_TEMP/checkout.json"
          python3 - "$RUNNER_TEMP/checkout.json" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text())
          methods=[]
          methods.extend(data.get("payment_methods") or [])
          methods.extend((data.get("__experimentalCart") or {}).get("payment_methods") or [])
          print("CHECKOUT_GATEWAYS_RAW=" + ",".join(dict.fromkeys(str(x).strip() for x in methods if str(x).strip())))
          PY
      - name: Compile Android app
        if: ${{ matrix.platform == 'android' }}
        run: ./gradlew :app:compileDebugKotlin --stacktrace
      - name: Assemble Android debug APK
        if: ${{ matrix.platform == 'android' }}
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Prepare named APKs
        if: ${{ matrix.platform == 'android' }}
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -E 'versionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/')
          VERSIONED_APK="CriosRango-v${VERSION_NAME}-code${VERSION_CODE}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$VERSIONED_APK"
          cp app/build/outputs/apk/debug/app-debug.apk CriosRango-latest.apk
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "versioned_apk=$VERSIONED_APK" >> "$GITHUB_OUTPUT"
          ls -lh "$VERSIONED_APK" CriosRango-latest.apk
      - name: Upload APK artifact
        if: ${{ matrix.platform == 'android' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: CriosRango-v${{ steps.apk.outputs.version_name }}-code${{ steps.apk.outputs.version_code }}
          retention-days: 2
          path: |
            ${{ steps.apk.outputs.versioned_apk }}
            CriosRango-latest.apk
      - name: Publish latest development APK
        if: ${{ matrix.platform == 'android' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONED_APK: ${{ steps.apk.outputs.versioned_apk }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
        run: |
          set -euo pipefail
          RELEASE_NOTES="CriosRango v${VERSION_NAME} code ${VERSION_CODE} - automatic development build from commit ${GITHUB_SHA}"
          if ! gh release view dev-latest >/dev/null 2>&1; then
            gh release create dev-latest --title "Development latest" --notes "$RELEASE_NOTES" --prerelease --target "${GITHUB_SHA}"
          else
            gh release edit dev-latest --title "Development latest" --notes "$RELEASE_NOTES" --prerelease --target "${GITHUB_SHA}"
          fi
          gh release upload dev-latest "$VERSIONED_APK" CriosRango-latest.apk --clobber
      - name: Cleanup Google Services
        if: always() && matrix.platform == 'android'
        run: rm -f app/google-services.json
      - name: Cleanup signing material
        if: always() && matrix.platform == 'android'
        run: rm -f "$RUNNER_TEMP/criosrango-debug.jks"
      - name: Prepare Google Services
        if: ${{ matrix.platform == 'ios' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s app/google-services.json
      - name: Prepare permanent debug keystore
        if: ${{ matrix.platform == 'ios' }}
        env:
          CRIOSRANGO_DEBUG_KEYSTORE_BASE64: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_BASE64 }}
          CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD }}
          CRIOSRANGO_DEBUG_KEY_ALIAS: ${{ secrets.CRIOSRANGO_DEBUG_KEY_ALIAS }}
          CRIOSRANGO_DEBUG_KEY_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CRIOSRANGO_DEBUG_KEYSTORE_BASE64"
          test -n "$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD"
          test -n "$CRIOSRANGO_DEBUG_KEY_ALIAS"
          test -n "$CRIOSRANGO_DEBUG_KEY_PASSWORD"
          printf '%s' "$CRIOSRANGO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/criosrango-debug.jks"
          chmod 600 "$RUNNER_TEMP/criosrango-debug.jks"
          test -s "$RUNNER_TEMP/criosrango-debug.jks"
          {
            echo "CRIOSRANGO_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/criosrango-debug.jks"
            echo "CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD=$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD"
            echo "CRIOSRANGO_DEBUG_KEY_ALIAS=$CRIOSRANGO_DEBUG_KEY_ALIAS"
            echo "CRIOSRANGO_DEBUG_KEY_PASSWORD=$CRIOSRANGO_DEBUG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Select and validate Xcode 26 toolchain
        if: ${{ matrix.platform == 'ios' }}
        shell: bash
        run: |
          set -euo pipefail
          DEVELOPER_DIR="/Applications/Xcode_26.6.app/Contents/Developer"
          test -d "$DEVELOPER_DIR"
          sudo xcode-select -s "$DEVELOPER_DIR"
          echo "===== XCODE TOOLCHAIN ====="
          xcodebuild -version
          echo "iPhoneOS SDK version:"
          xcrun --sdk iphoneos --show-sdk-version
          echo "Swift:"
          xcrun swiftc --version
          echo "xcode-select path:"
          xcode-select -p
          XCODE_INFO="$(xcodebuild -version)"
          printf "%s\\n" "$XCODE_INFO"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          XCODE_MAJOR="$(printf "%s\\n" "$XCODE_INFO" | awk '/^Xcode / {split($2,v,"."); print v[1]; exit}')"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          echo "Xcode major: $XCODE_MAJOR"
          echo "iPhoneOS SDK major: $SDK_MAJOR"
          test "$XCODE_MAJOR" -ge 26
          test "$SDK_MAJOR" -ge 26
          test "$(xcode-select -p)" = "$DEVELOPER_DIR"
      - name: Build iOS Simulator app
        if: ${{ matrix.platform == 'ios' }}
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme CriosRangoKMPSpike -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath "$GITHUB_WORKSPACE/ios-derived-data" build
      - name: Compile iOS device app (unsigned)
        if: ${{ matrix.platform == 'ios' }}
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme CriosRangoKMPSpike -sdk iphoneos -configuration Debug -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -derivedDataPath "$GITHUB_WORKSPACE/ios-device-derived-data" build
      - name: Inspect effective iOS Release build settings
        if: ${{ matrix.platform == 'ios' }}
        run: |
          set -euo pipefail
          SETTINGS_FILE="$RUNNER_TEMP/ios-release-build-settings.txt"
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target CriosRangoKMPSpike \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -showBuildSettings \
            > "$SETTINGS_FILE"
          cat "$SETTINGS_FILE"
          echo "===== CRITICAL RELEASE TARGET SETTINGS ====="
          for KEY in CONFIGURATION CONFIGURATION_BUILD_DIR CONFIGURATION_TEMP_DIR BUILT_PRODUCTS_DIR TARGET_BUILD_DIR SDK_NAME PLATFORM_NAME PRODUCT_NAME PRODUCT_BUNDLE_IDENTIFIER SWIFT_OPTIMIZATION_LEVEL SWIFT_ACTIVE_COMPILATION_CONDITIONS FRAMEWORK_SEARCH_PATHS SYMROOT OBJROOT BUILD_DIR BUILD_ROOT SKIP_INSTALL INSTALL_PATH DEPLOYMENT_LOCATION DSTROOT ACTION; do
            grep -E "^[[:space:]]*$KEY[[:space:]]*=" "$SETTINGS_FILE" || true
          done
          EFFECTIVE_CONFIGURATION="$(grep -E '^[[:space:]]*CONFIGURATION[[:space:]]*=' "$SETTINGS_FILE" | tail -n 1 | sed -E 's/^[[:space:]]*CONFIGURATION[[:space:]]*=[[:space:]]*//')"
          EFFECTIVE_OPTIMIZATION="$(grep -E '^[[:space:]]*SWIFT_OPTIMIZATION_LEVEL[[:space:]]*=' "$SETTINGS_FILE" | tail -n 1 | sed -E 's/^[[:space:]]*SWIFT_OPTIMIZATION_LEVEL[[:space:]]*=[[:space:]]*//')"
          EFFECTIVE_CONDITIONS="$(sed -n -E 's/^[[:space:]]*SWIFT_ACTIVE_COMPILATION_CONDITIONS[[:space:]]*=[[:space:]]*//p' "$SETTINGS_FILE" | tail -n 1)"
          EFFECTIVE_FRAMEWORK_SEARCH_PATHS="$(grep -E '^[[:space:]]*FRAMEWORK_SEARCH_PATHS[[:space:]]*=' "$SETTINGS_FILE" | tail -n 1 | sed -E 's/^[[:space:]]*FRAMEWORK_SEARCH_PATHS[[:space:]]*=[[:space:]]*//')"
          echo "Effective target CONFIGURATION=$EFFECTIVE_CONFIGURATION"
          echo "Effective target SWIFT_OPTIMIZATION_LEVEL=$EFFECTIVE_OPTIMIZATION"
          echo "Effective target SWIFT_ACTIVE_COMPILATION_CONDITIONS=$EFFECTIVE_CONDITIONS"
          echo "Effective target FRAMEWORK_SEARCH_PATHS=$EFFECTIVE_FRAMEWORK_SEARCH_PATHS"
          test "$EFFECTIVE_CONFIGURATION" = "Release"
          test "$EFFECTIVE_OPTIMIZATION" != "-Onone"
          if printf '%s\n' "$EFFECTIVE_CONDITIONS" | grep -Eq '(^|[[:space:]])DEBUG([[:space:]]|$)'; then
            echo "::error::Effective Release SWIFT_ACTIVE_COMPILATION_CONDITIONS contains DEBUG"
            exit 1
          fi
          case "$EFFECTIVE_FRAMEWORK_SEARCH_PATHS" in
            *"shared/build/xcode-frameworks/Release/"*) ;;
            *) echo "::error::Release FRAMEWORK_SEARCH_PATHS does not contain shared/build/xcode-frameworks/Release/"; exit 1 ;;
          esac

      - name: Compile iOS device app Release (unsigned)
        if: ${{ matrix.platform == 'ios' }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/ios-release-derived-data"
          rm -rf "$GITHUB_WORKSPACE/shared/build/xcode-frameworks/Release"
          rm -rf "$GITHUB_WORKSPACE/shared/build/xcode-frameworks/Debug"
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme CriosRangoKMPSpike \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath "$GITHUB_WORKSPACE/ios-release-derived-data" \
            build
          echo "===== IOS RELEASE PRODUCTS ====="
          find "$GITHUB_WORKSPACE/ios-release-derived-data/Build/Products" -maxdepth 3 -print || true
          APP_PATH="$(find "$GITHUB_WORKSPACE/ios-release-derived-data/Build/Products" -path '*/CriosRango.app' -type d -print -quit)"
          echo "Release app path: $APP_PATH"
          test -n "$APP_PATH"
          case "$APP_PATH" in
            */Release-iphoneos/*) ;;
            */Debug-iphoneos/*) echo "::error::Release build produced Debug-iphoneos product: $APP_PATH"; exit 1 ;;
            *) echo "::error::Release build produced unexpected product path: $APP_PATH"; exit 1 ;;
          esac
          echo "===== KMP XCODE FRAMEWORKS ====="
          find "$GITHUB_WORKSPACE/shared/build/xcode-frameworks" -maxdepth 5 -print || true
          RELEASE_FRAMEWORK_PATH="$(find "$GITHUB_WORKSPACE/shared/build/xcode-frameworks" -path '*/Release/iphoneos*' -print -quit)"
          test -n "$RELEASE_FRAMEWORK_PATH"
          test -e "$RELEASE_FRAMEWORK_PATH"
      - name: Archive iOS Release (unsigned)
        if: ${{ matrix.platform == 'ios' }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/CriosRango.xcarchive"
          ARCHIVE_LOG="$RUNNER_TEMP/CriosRango-archive.log"
          rm -rf "$ARCHIVE_PATH"
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme CriosRangoKMPSpike \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tee "$ARCHIVE_LOG"
          echo "===== EXPECTED ARCHIVE ====="
          echo "$ARCHIVE_PATH"
          echo "===== ARCHIVE CONFIGURATION EVIDENCE ====="
          grep -E 'Release-iphoneos|Debug-iphoneos|xcode-frameworks/(Release|Debug)|link(Release|Debug)Framework|assemble(Release|Debug)AppleFrameworkForXcode' "$ARCHIVE_LOG" || true
          if grep -q 'Debug-iphoneos' "$ARCHIVE_LOG"; then
            echo "::error::Archive used Debug-iphoneos"
            exit 1
          fi
          grep -q 'Release-iphoneos' "$ARCHIVE_LOG"
          grep -q 'shared/build/xcode-frameworks/Release/' "$ARCHIVE_LOG"
          echo "===== ARCHIVES IN RUNNER_TEMP ====="
          find "$RUNNER_TEMP" -maxdepth 5 -name '*.xcarchive' -print || true
          echo "===== ARCHIVES UNDER XCODE ====="
          find "$HOME/Library/Developer/Xcode" -maxdepth 10 -name '*.xcarchive' -print 2>/dev/null || true
          echo "===== ARCHIVE INTERMEDIATES ====="
          find "$HOME/Library/Developer/Xcode" -path '*ArchiveIntermediates*' -print 2>/dev/null | tail -n 300 || true
          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "::error::ARCHIVE SUCCEEDED but expected xcarchive was not materialized at $ARCHIVE_PATH"
            exit 1
          fi
          APP_PATH="$ARCHIVE_PATH/Products/Applications/CriosRango.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          test -f "$APP_PATH/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "es.criosrango.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")" = "Críos&Rango"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "1.0.139"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "139"
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP_PATH/Info.plist")" = "AppIcon"
          fi
          echo "Validated unsigned archive: $ARCHIVE_PATH"
          echo "Validated archive app: $APP_PATH"
      - name: Runtime smoke test on iOS Simulator
        if: ${{ matrix.platform == 'ios' }}
        run: |
          set -euo pipefail
          echo "Available iOS Simulator devices:"
          xcrun simctl list devices available
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; data=json.load(sys.stdin); [print(d["udid"]) or sys.exit(0) for devices in data.get("devices", {}).values() for d in devices if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]; sys.exit("No available iPhone Simulator device found")')"
          echo "Selected available iPhone Simulator UDID: $UDID"
          trap 'xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH="$GITHUB_WORKSPACE/ios-derived-data/Build/Products/Debug-iphonesimulator/CriosRango.app"
          echo "Generated iOS app Info.plist:"
          plutil -p "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print" "$APP_PATH/Info.plist"
          CADISABLE_FRAME_DURATION="$(/usr/libexec/PlistBuddy -c "Print :CADisableMinimumFrameDurationOnPhone" "$APP_PATH/Info.plist")"
          echo "CADisableMinimumFrameDurationOnPhone=$CADISABLE_FRAME_DURATION"
          test "$CADISABLE_FRAME_DURATION" = "true"
          CF_BUNDLE_EXECUTABLE="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")"
          EXECUTABLE_NAME="$(xcodebuild -project iosApp/iosApp.xcodeproj -scheme CriosRangoKMPSpike -configuration Debug -sdk iphonesimulator -showBuildSettings | awk -F " = " '/^[[:space:]]*EXECUTABLE_NAME = / {print $2; exit}')"
          echo "CFBundleExecutable=$CF_BUNDLE_EXECUTABLE"
          echo "EXECUTABLE_NAME=$EXECUTABLE_NAME"
          test -n "$CF_BUNDLE_EXECUTABLE"
          test "$CF_BUNDLE_EXECUTABLE" = "$EXECUTABLE_NAME"
          test -f "$APP_PATH/$CF_BUNDLE_EXECUTABLE"
          echo "Validated executable: $APP_PATH/$CF_BUNDLE_EXECUTABLE"
          xcrun simctl install "$UDID" "$APP_PATH"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")"
          echo "BUNDLE_ID=$BUNDLE_ID"
          test -n "$BUNDLE_ID"
          echo "Installed app container:"
          xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" app
          LOG_STREAM="$GITHUB_WORKSPACE/kmp-runtime-log-stream.log"
          LOG_SHOW="$GITHUB_WORKSPACE/kmp-runtime-log-show.log"
          rm -f "$LOG_STREAM" "$LOG_SHOW"
          echo "Starting independent Simulator log capture..."
          xcrun simctl spawn "$UDID" log stream --style compact --level debug --predicate "process == \"$CF_BUNDLE_EXECUTABLE\"" >"$LOG_STREAM" 2>&1 &
          LOG_STREAM_PID=$!
          echo "log stream PID: $LOG_STREAM_PID"
          echo "Launching $BUNDLE_ID..."
          set +e
          LAUNCH_OUTPUT="$(xcrun simctl launch "$UDID" "$BUNDLE_ID" 2>&1)"
          LAUNCH_STATUS=$?
          set -e
          echo "Launch exit code: $LAUNCH_STATUS"
          echo "Launch output:"
          printf '%s\n' "$LAUNCH_OUTPUT"
          test "$LAUNCH_STATUS" -eq 0
          APP_PID="$(printf '%s\n' "$LAUNCH_OUTPUT" | grep -Eo '[0-9]+' | tail -n 1 || true)"
          if [ -z "$APP_PID" ]; then
            echo "::error::simctl launch succeeded but did not return an application PID"
            exit 1
          fi
          echo "Application PID: $APP_PID"
          sleep 3
          if ! xcrun simctl spawn "$UDID" kill -0 "$APP_PID" >/dev/null 2>&1; then
            echo "::error::CriosRango process is not alive after launch"
            exit 1
          fi
          echo "Application process is alive after launch."
          FOUND=0
          for i in $(seq 1 27); do
            if grep -q "KMP_RUNTIME_ROOT_SCREEN_READY" "$LOG_STREAM" && grep -q "KMP_RUNTIME_HOME_READY" "$LOG_STREAM"; then
              FOUND=1
              break
            fi
            if ! xcrun simctl spawn "$UDID" kill -0 "$APP_PID" >/dev/null 2>&1; then
              echo "::error::CriosRango process died during runtime smoke"
              break
            fi
            sleep 1
          done
          echo "Stopping independent log capture..."
          kill "$LOG_STREAM_PID" >/dev/null 2>&1 || true
          wait "$LOG_STREAM_PID" >/dev/null 2>&1 || true
          echo "Runtime log stream output:"
          cat "$LOG_STREAM" || true
          echo "Post-launch application process check:"
          if xcrun simctl spawn "$UDID" kill -0 "$APP_PID" >/dev/null 2>&1; then
            echo "Application PID $APP_PID is still alive."
            APP_ALIVE=1
          else
            echo "Application PID $APP_PID is no longer alive."
            APP_ALIVE=0
          fi
          echo "Independent Simulator log snapshot:"
          xcrun simctl spawn "$UDID" log show --style compact --last 2m --predicate "process == \"$CF_BUNDLE_EXECUTABLE\"" >"$LOG_SHOW" 2>&1 || true
          cat "$LOG_SHOW" || true
          echo "Crash report candidates:"
          CRASH_REPORTS="$(find "$HOME/Library/Logs/DiagnosticReports" -type f -mmin -10 -print 2>/dev/null | grep -E "/$CF_BUNDLE_EXECUTABLE[^/]*\\.(ips|crash)$" || true)"
          printf '%s\n' "$CRASH_REPORTS"
          if [ -n "$CRASH_REPORTS" ]; then
            echo "::error::Crash report for $CF_BUNDLE_EXECUTABLE detected"
            exit 1
          fi
