name: iOS Physical TestFlight

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character commit SHA to archive, sign and upload"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-physical-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-target:
    name: Resolve and freeze requested target SHA
    runs-on: ubuntu-latest
    outputs:
      requested_sha: ${{ steps.resolve.outputs.requested_sha }}
      resolved_sha: ${{ steps.resolve.outputs.resolved_sha }}
      workflow_run_sha: ${{ steps.resolve.outputs.workflow_run_sha }}
      branch: ${{ steps.resolve.outputs.branch }}
    steps:
      - name: Validate and freeze explicit target SHA
        id: resolve
        shell: bash
        env:
          DISPATCH_TARGET_SHA: ${{ inputs.target_sha }}
          WORKFLOW_RUN_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$BRANCH_NAME" == "develop/1.0.3" ]] || { echo "::error::Physical TestFlight must be dispatched from develop/1.0.3"; exit 1; }
          REQUESTED_TARGET_SHA="$DISPATCH_TARGET_SHA"
          [[ "$REQUESTED_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::target_sha must be an exact lowercase 40-character commit SHA"; exit 1; }
          [[ "$REQUESTED_TARGET_SHA" == "$WORKFLOW_RUN_SHA" ]] || { echo "::error::target_sha must equal the workflow-dispatch branch HEAD SHA"; exit 1; }
          RESOLVED_TARGET_SHA="$REQUESTED_TARGET_SHA"
          TARGET_APPLICATION_SHA="$RESOLVED_TARGET_SHA"
          echo "TARGET_APPLICATION_SHA=$TARGET_APPLICATION_SHA"
          echo "REQUESTED_TARGET_SHA=$REQUESTED_TARGET_SHA"
          echo "RESOLVED_TARGET_SHA=$RESOLVED_TARGET_SHA"
          echo "BRANCH=$BRANCH_NAME"
          echo "WORKFLOW_RUN_SHA=$WORKFLOW_RUN_SHA"
          echo "requested_sha=$REQUESTED_TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "resolved_sha=$RESOLVED_TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "workflow_run_sha=$WORKFLOW_RUN_SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

  build-release-ipa:
    name: Archive, sign and validate iPhone IPA
    needs: resolve-target
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      ipa_name: ${{ steps.metadata.outputs.ipa_name }}
      signing_ready: ${{ steps.credentials.outputs.ready }}
      start_epoch: ${{ steps.metadata.outputs.start_epoch }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - name: Checkout exact resolved target SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-target.outputs.resolved_sha }}
          fetch-depth: 1

      - name: Reconstruct and validate Firebase iOS configuration
        shell: bash
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64"
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > iosApp/GoogleService-Info.plist
          test -s iosApp/GoogleService-Info.plist
          plutil -lint iosApp/GoogleService-Info.plist
          /usr/libexec/PlistBuddy -c 'Print :GOOGLE_APP_ID' iosApp/GoogleService-Info.plist >/dev/null

      - name: Verify target SHA, branch, version and unique build
        id: metadata
        shell: bash
        env:
          REQUESTED_TARGET_SHA: ${{ needs.resolve-target.outputs.requested_sha }}
          RESOLVED_TARGET_SHA: ${{ needs.resolve-target.outputs.resolved_sha }}
          EXPECTED_SHA: ${{ needs.resolve-target.outputs.resolved_sha }}
          WORKFLOW_RUN_SHA: ${{ needs.resolve-target.outputs.workflow_run_sha }}
          BRANCH_NAME: ${{ needs.resolve-target.outputs.branch }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "REQUESTED_TARGET_SHA=$REQUESTED_TARGET_SHA"
          echo "RESOLVED_TARGET_SHA=$RESOLVED_TARGET_SHA"
          echo "CHECKOUT_SHA=$ACTUAL_SHA"
          echo "TARGET_APPLICATION_SHA=$RESOLVED_TARGET_SHA"
          echo "BRANCH=$BRANCH_NAME"
          echo "WORKFLOW_RUN_SHA=$WORKFLOW_RUN_SHA"
          [[ "$REQUESTED_TARGET_SHA" == "$RESOLVED_TARGET_SHA" ]] || { echo "::error::Requested/resolved SHA mismatch"; exit 1; }
          [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" && "$ACTUAL_SHA" == "$RESOLVED_TARGET_SHA" ]] || { echo "::error::Checkout SHA mismatch"; exit 1; }
          [[ "$BRANCH_NAME" == "develop/1.0.3" ]] || { echo "::error::Manual dispatch is only authorized on develop/1.0.3"; exit 1; }
          VERSION="$(grep -m1 'MARKETING_VERSION =' iosApp/iosApp.xcodeproj/project.pbxproj | sed -E 's/.*MARKETING_VERSION = ([^;]+);.*/\1/' | tr -d ' ')"
          BASE_BUILD="$(grep -m1 'CURRENT_PROJECT_VERSION =' iosApp/iosApp.xcodeproj/project.pbxproj | sed -E 's/.*CURRENT_PROJECT_VERSION = ([^;]+);.*/\1/' | tr -d ' ')"
          [[ "$VERSION" == "1.0.3" ]] || { echo "::error::Expected marketing version 1.0.3, found $VERSION"; exit 1; }
          [[ "$BASE_BUILD" == "20011" ]] || { echo "::error::Expected project build baseline 20011, found $BASE_BUILD"; exit 1; }
          BUILD_NUMBER=20011
          [[ "$BUILD_NUMBER" == "20011" ]] || exit 1
          START_EPOCH="$(date +%s)"
          echo "start_epoch=$START_EPOCH" >> "$GITHUB_OUTPUT"
          echo "RUN_START_EPOCH=$START_EPOCH" >> "$GITHUB_ENV"
          mkdir -p release-artifacts
          printf 'IOS PHYSICAL TESTFLIGHT REPORT\nREQUESTED_TARGET_SHA=%s\nRESOLVED_TARGET_SHA=%s\nCHECKOUT_SHA=%s\nWORKFLOW_RUN_SHA=%s\nARCHIVED_SHA=NOT_ARCHIVED\nSHARED_IOS_COMPILED_FROM_TARGET_SHA=NOT_VERIFIED\nSHA=%s\nBRANCH=%s\nVERSION=%s\nBUILD=%s\nBUNDLE_ID=es.criosrango.app\nARCHIVE=NOT_FOUND\nIPA=NOT_FOUND\nSIGNATURE=RED\nAPP_STORE_VALIDATION=RED\nUPLOAD=RED\nTESTFLIGHT_UPLOAD=FAILURE\nFAMILIA_GROUP=NOT_CONFIRMED\n' "$REQUESTED_TARGET_SHA" "$RESOLVED_TARGET_SHA" "$ACTUAL_SHA" "$WORKFLOW_RUN_SHA" "$ACTUAL_SHA" "$BRANCH_NAME" "$VERSION" "$BUILD_NUMBER" > release-artifacts/ios-physical-testflight-report.txt
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "ipa_name=CriosRango-${VERSION}-${BUILD_NUMBER}.ipa" >> "$GITHUB_OUTPUT"
          {
            echo "### iOS Physical TestFlight"
            echo "- Requested target SHA: $REQUESTED_TARGET_SHA"
            echo "- Resolved target SHA: $RESOLVED_TARGET_SHA"
            echo "- Checkout SHA: $ACTUAL_SHA"
            echo "- Workflow run SHA (context only): $WORKFLOW_RUN_SHA"
            echo "- SHA: $ACTUAL_SHA"
            echo "- Branch: $BRANCH_NAME"
            echo "- Version: $VERSION"
            echo "- Generated build: $BUILD_NUMBER"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Java 17 for Kotlin Multiplatform
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native Konan downloads
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: macos-konan-physical-v1-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'shared/build.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            macos-konan-physical-v1-

      - name: Check existing signing and App Store Connect secrets
        id: credentials
        shell: bash
        env:
          DIST_P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$DIST_P12" ]] || missing+=("IOS_DISTRIBUTION_P12_BASE64")
          [[ -n "$DIST_P12_PASSWORD" ]] || missing+=("IOS_DISTRIBUTION_P12_PASSWORD")
          [[ -n "$PROFILE" ]] || missing+=("IOS_PROVISIONING_PROFILE_BASE64")
          [[ -n "$ASC_KEY_ID" ]] || missing+=("APP_STORE_CONNECT_KEY_ID")
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=("APP_STORE_CONNECT_ISSUER_ID")
          [[ -n "$ASC_PRIVATE_KEY_BASE64" ]] || missing+=("APP_STORE_CONNECT_API_KEY_BASE64")
          if (( ${#missing[@]} )); then
            printf 'Missing required existing GitHub Actions secrets: %s\n' "${missing[*]}" | tee -a release-artifacts/ios-physical-testflight-report.txt
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install the existing Apple Distribution certificate and provisioning profile
        if: steps.credentials.outputs.ready == 'true'
        id: signing
        shell: bash
        env:
          DIST_P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/criosrango-distribution.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          PROFILE_APS=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/profile.plist")
          PROFILE_GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$RUNNER_TEMP/profile.plist" 2>/dev/null || true)
          echo "PROFILE_NAME=$PROFILE_NAME"
          echo "APPLICATION_IDENTIFIER=$APP_IDENTIFIER"
          echo "TEAM_IDENTIFIER=$TEAM_ID"
          echo "APS_ENVIRONMENT=$PROFILE_APS"
          python3 - "$RUNNER_TEMP/profile.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              profile = plistlib.load(f)
          entitlements = profile.get("Entitlements", {})
          raw = entitlements.get("com.apple.developer.associated-domains", [])
          domains = [raw] if isinstance(raw, str) else raw if isinstance(raw, list) else []
          authorized = "*" in domains or (
              "applinks:criosrango.es" in domains and
              "applinks:www.criosrango.es" in domains
          )
          print("ASSOCIATED_DOMAINS_AUTHORIZATION=" + (",".join(str(x) for x in domains) if domains else "MISSING"))
          if not authorized:
              raise SystemExit("::error::Provisioning profile does not authorize required Associated Domains")
          PY
          [[ "$TEAM_ID" == "3793344J72" && "$APP_IDENTIFIER" == "3793344J72.es.criosrango.app" && "$PROFILE_APS" == "production" ]] || { echo "::error::Provisioning profile identifiers or production push entitlement are invalid"; exit 1; }
          [[ "$PROFILE_GET_TASK_ALLOW" != "true" && "$PROFILE_GET_TASK_ALLOW" != "YES" ]] || { echo "::error::Distribution profile unexpectedly enables get-task-allow"; exit 1; }
          RELEASE_ENTITLEMENTS="$RUNNER_TEMP/CriosRango-release.entitlements"
          cp iosApp/iosApp.entitlements "$RELEASE_ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c 'Set :aps-environment production' "$RELEASE_ENTITLEMENTS"
          plutil -lint "$RELEASE_ENTITLEMENTS"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Apple Distribution:/ {print $2; exit}')"
          [[ "$IDENTITY" =~ ^[0-9A-Fa-f]{40}$ ]] || { echo "::error::No valid Apple Distribution identity found in supplied certificate"; security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true; exit 1; }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "TEAM_ID=$TEAM_ID"
            echo "SIGNING_IDENTITY=$IDENTITY"
            echo "RELEASE_ENTITLEMENTS=$RELEASE_ENTITLEMENTS"
          } >> "$GITHUB_ENV"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"
          echo "signature=GREEN" >> "$GITHUB_OUTPUT"
          echo "Existing Apple Distribution identity and exact bundle-ID provisioning profile installed." >> release-artifacts/signing.log

      - name: Clean shared build outputs before archive
        if: steps.signing.outcome == 'success'
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.caching=false
        run: |
          set -euo pipefail
          ./gradlew --no-build-cache clean

      - name: Archive Release for physical iPhone
        if: steps.signing.outcome == 'success'
        id: archive
        timeout-minutes: 65
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
          EXPECTED_SHA: ${{ needs.resolve-target.outputs.resolved_sha }}
          GRADLE_OPTS: -Dorg.gradle.caching=false
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]] || { echo "::error::Pre-archive SHA mismatch; archive blocked"; exit 1; }
          echo "PRE_ARCHIVE_CHECKOUT_SHA=$ACTUAL_SHA"
          echo "PRE_ARCHIVE_EXPECTED_SHA=$EXPECTED_SHA"
          ARCHIVE="$RUNNER_TEMP/CriosRango.xcarchive"
          DERIVED="$RUNNER_TEMP/CriosRangoDerivedData"
          if /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' iosApp/Info.plist >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Set :CFBundlePackageType APPL' iosApp/Info.plist
          else
            /usr/libexec/PlistBuddy -c 'Add :CFBundlePackageType string APPL' iosApp/Info.plist
          fi
          plutil -lint iosApp/Info.plist
          set +e
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme CriosRangoKMPSpike \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGN_ENTITLEMENTS="$RELEASE_ENTITLEMENTS" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION=1.0.3 \
            archive 2>&1 | tee release-artifacts/xcodebuild-archive.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [[ "$BUILD_STATUS" -ne 0 || ! -d "$ARCHIVE/Products/Applications/CriosRango.app" ]]; then
            echo "ARCHIVE=NOT_FOUND" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ARCHIVE_PATH=$ARCHIVE" >> "$GITHUB_ENV"
          echo "ARCHIVE=FOUND" >> "$GITHUB_OUTPUT"
          grep -Fq ':shared:embedAndSignAppleFrameworkForXcode' release-artifacts/xcodebuild-archive.log || { echo "::error::Kotlin Multiplatform framework build task not visible in archive log"; exit 1; }
          grep -Eq 'BUILD SUCCESSFUL|BUILD SUCCESSFUL in' release-artifacts/xcodebuild-archive.log || { echo "::error::Kotlin Multiplatform Gradle success not visible in archive log"; exit 1; }
          sed -i '' "s/^ARCHIVED_SHA=.*/ARCHIVED_SHA=$ACTUAL_SHA/" release-artifacts/ios-physical-testflight-report.txt
          sed -i '' "s/^SHARED_IOS_COMPILED_FROM_TARGET_SHA=.*/SHARED_IOS_COMPILED_FROM_TARGET_SHA=YES/" release-artifacts/ios-physical-testflight-report.txt
          ditto "$ARCHIVE/dSYMs" release-artifacts/dSYMs 2>/dev/null || true

      - name: Export signed App Store IPA and validate bundle
        if: steps.archive.outcome == 'success'
        id: ipa
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
          VERSION: ${{ steps.metadata.outputs.version }}
          IPA_NAME: ${{ steps.metadata.outputs.ipa_name }}
        run: |
          set -euo pipefail
          EXPORT_DIR="$RUNNER_TEMP/ipa-export"
          mkdir -p "$EXPORT_DIR"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$RUNNER_TEMP/export-options.plist" 2>/dev/null || true
          cat > "$RUNNER_TEMP/export-options.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>export</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>provisioningProfiles</key><dict><key>es.criosrango.app</key><string>$PROFILE_NAME</string></dict>
          <key>manageAppVersionAndBuildNumber</key><false/>
          <key>stripSwiftSymbols</key><true/>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportPath "$EXPORT_DIR" -exportOptionsPlist "$RUNNER_TEMP/export-options.plist" 2>&1 | tee release-artifacts/xcodebuild-export.log
          SOURCE_IPA="$(find "$EXPORT_DIR" -maxdepth 1 -name '*.ipa' -type f -print -quit)"
          [[ -n "$SOURCE_IPA" && -s "$SOURCE_IPA" ]]
          cp "$SOURCE_IPA" "release-artifacts/$IPA_NAME"
          unzip -t "release-artifacts/$IPA_NAME" > release-artifacts/ipa-structure.log
          rm -rf "$RUNNER_TEMP/ipa-unpacked"
          mkdir -p "$RUNNER_TEMP/ipa-unpacked"
          unzip -q "release-artifacts/$IPA_NAME" -d "$RUNNER_TEMP/ipa-unpacked"
          APP="$RUNNER_TEMP/ipa-unpacked/Payload/CriosRango.app"
          [[ -d "$APP" ]]
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          ACTUAL_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          [[ "$BUNDLE" == "es.criosrango.app" && "$ACTUAL_VERSION" == "$VERSION" && "$ACTUAL_BUILD" == "$BUILD_NUMBER" ]] || { echo "::error::IPA metadata mismatch: $BUNDLE $ACTUAL_VERSION ($ACTUAL_BUILD)"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tee release-artifacts/signature-verification.log
          IPA_ENTITLEMENTS="$RUNNER_TEMP/ipa-entitlements.plist"
          codesign -d --entitlements :- "$APP" > "$IPA_ENTITLEMENTS" 2>/dev/null
          plutil -lint "$IPA_ENTITLEMENTS"
          IPA_APS=$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$IPA_ENTITLEMENTS")
          IPA_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$IPA_ENTITLEMENTS")
          IPA_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$IPA_ENTITLEMENTS")
          IPA_GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' "$IPA_ENTITLEMENTS" 2>/dev/null || true)
          [[ "$TEAM_ID" == "3793344J72" && "$IPA_APS" == production && "$IPA_APP_ID" == "3793344J72.es.criosrango.app" && "$IPA_TEAM" == "3793344J72" && "$IPA_GET_TASK_ALLOW" != true && "$IPA_GET_TASK_ALLOW" != YES ]] || { echo "::error::IPA distribution entitlements are invalid"; exit 1; }
          python3 - "$IPA_ENTITLEMENTS" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              entitlements = plistlib.load(f)
          domains = entitlements.get("com.apple.developer.associated-domains", [])
          required = {"applinks:criosrango.es", "applinks:www.criosrango.es"}
          missing = required.difference(domains if isinstance(domains, list) else [])
          print("SIGNED_APPLICATION_IDENTIFIER=" + str(entitlements.get("application-identifier", "")))
          print("SIGNED_ASSOCIATED_DOMAINS=" + ",".join(domains if isinstance(domains, list) else []))
          if missing:
              raise SystemExit("::error::Signed IPA is missing Associated Domains: " + ", ".join(sorted(missing)))
          PY
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/embedded-profile.plist"
          EMBEDDED_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/embedded-profile.plist")
          [[ "$EMBEDDED_UUID" == "$PROFILE_UUID" ]] || { echo "::error::Exported IPA embedded a different provisioning profile"; exit 1; }
          echo "IPA_PATH=release-artifacts/$IPA_NAME" >> "$GITHUB_ENV"
          echo "ipa=FOUND" >> "$GITHUB_OUTPUT"
          echo "signature=GREEN" >> "$GITHUB_OUTPUT"
          echo "IPA=FOUND" >> release-artifacts/ios-physical-testflight-report.txt
          echo "SIGNATURE=GREEN" >> release-artifacts/ios-physical-testflight-report.txt
          echo "App Store IPA structure, bundle metadata, code signature and provisioning profile validated." >> release-artifacts/signing.log

      - name: Record archive, IPA and duration
        if: always()
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
          RUN_START_EPOCH: ${{ steps.metadata.outputs.start_epoch }}
          ARCHIVE_STATUS: ${{ steps.archive.outputs.archive }}
          IPA_STATUS: ${{ steps.ipa.outputs.ipa }}
          SIGNATURE_STATUS: ${{ steps.ipa.outputs.signature }}
        run: |
          set -u
          REPORT=release-artifacts/ios-physical-testflight-report.txt
          mkdir -p release-artifacts
          [[ -f "$REPORT" ]] || printf 'IOS PHYSICAL TESTFLIGHT REPORT\n' > "$REPORT"
          [[ "$ARCHIVE_STATUS" == FOUND ]] && sed -i '' 's/^ARCHIVE=.*/ARCHIVE=FOUND/' "$REPORT" || sed -i '' 's/^ARCHIVE=.*/ARCHIVE=NOT_FOUND/' "$REPORT"
          [[ "$IPA_STATUS" == FOUND ]] && sed -i '' 's/^IPA=.*/IPA=FOUND/' "$REPORT" || sed -i '' 's/^IPA=.*/IPA=NOT_FOUND/' "$REPORT"
          [[ "$SIGNATURE_STATUS" == GREEN ]] && sed -i '' 's/^SIGNATURE=.*/SIGNATURE=GREEN/' "$REPORT" || sed -i '' 's/^SIGNATURE=.*/SIGNATURE=RED/' "$REPORT"
          sed -i '' 's/^APP_STORE_VALIDATION=.*/APP_STORE_VALIDATION=RED/' "$REPORT"
          sed -i '' 's/^UPLOAD=.*/UPLOAD=RED/' "$REPORT"
          sed -i '' 's/^TESTFLIGHT_UPLOAD=.*/TESTFLIGHT_UPLOAD=FAILURE/' "$REPORT"
          [[ -n "${RUN_START_EPOCH:-}" ]] || RUN_START_EPOCH="$(date +%s)"
          DURATION=$(( $(date +%s) - RUN_START_EPOCH ))
          echo "TOTAL_DURATION=$DURATION seconds" >> "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA, archive report, dSYM and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-physical-testflight-build-${{ github.run_id }}
          path: release-artifacts/**
          if-no-files-found: warn
          retention-days: 14

  upload-testflight:
    name: Validate and upload to internal TestFlight
    needs: [resolve-target, build-release-ipa]
    if: needs.resolve-target.result == 'success' && needs.build-release-ipa.result == 'success'
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - name: Checkout exact resolved target SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-target.outputs.resolved_sha }}
          fetch-depth: 1

      - name: Download signed IPA and evidence
        uses: actions/download-artifact@v4
        with:
          name: ios-physical-testflight-build-${{ github.run_id }}
          path: release-artifacts

      - name: Verify downloaded IPA and checkout match exact target SHA
        id: freshness
        shell: bash
        env:
          REQUESTED_TARGET_SHA: ${{ needs.resolve-target.outputs.requested_sha }}
          RESOLVED_TARGET_SHA: ${{ needs.resolve-target.outputs.resolved_sha }}
          EXPECTED_SHA: ${{ needs.resolve-target.outputs.resolved_sha }}
          WORKFLOW_RUN_SHA: ${{ needs.resolve-target.outputs.workflow_run_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "REQUESTED_TARGET_SHA=$REQUESTED_TARGET_SHA"
          echo "RESOLVED_TARGET_SHA=$RESOLVED_TARGET_SHA"
          echo "CHECKOUT_SHA=$ACTUAL_SHA"
          echo "WORKFLOW_RUN_SHA=$WORKFLOW_RUN_SHA"
          [[ "$REQUESTED_TARGET_SHA" == "$RESOLVED_TARGET_SHA" ]] || { echo "::error::Requested/resolved SHA mismatch in upload job"; exit 1; }
          [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]] || { echo "::error::Upload checkout SHA differs from resolved target SHA"; exit 1; }
          grep -Fx "REQUESTED_TARGET_SHA=$REQUESTED_TARGET_SHA" release-artifacts/ios-physical-testflight-report.txt
          grep -Fx "RESOLVED_TARGET_SHA=$RESOLVED_TARGET_SHA" release-artifacts/ios-physical-testflight-report.txt
          grep -Fx "CHECKOUT_SHA=$EXPECTED_SHA" release-artifacts/ios-physical-testflight-report.txt
          grep -Fx "ARCHIVED_SHA=$EXPECTED_SHA" release-artifacts/ios-physical-testflight-report.txt
          grep -Fx "SHARED_IOS_COMPILED_FROM_TARGET_SHA=YES" release-artifacts/ios-physical-testflight-report.txt
          echo "current=true" >> "$GITHUB_OUTPUT"
          echo "Verified requested, resolved, archive checkout and upload checkout all match $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Install App Store Connect API key
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$ASC_PRIVATE_KEY_BASE64" ]]
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          python3 - "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" "$RUNNER_TEMP/asc-api-key.json" <<'PY'
          import json,sys
          kid,issuer,keyfile,out=sys.argv[1:]
          with open(keyfile,encoding="utf-8") as f: key=f.read()
          with open(out,"w",encoding="utf-8") as f: json.dump({"key_id":kid,"issuer_id":issuer,"key":key,"duration":1200,"in_house":False},f)
          PY
          chmod 600 "$RUNNER_TEMP/asc-api-key.json"

      - name: Validate IPA with App Store Connect altool
        if: steps.freshness.outputs.current == 'true'
        id: validate
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IPA_NAME: ${{ needs.build-release-ipa.outputs.ipa_name }}
        run: |
          set -euo pipefail
          IPA="release-artifacts/$IPA_NAME"
          [[ -s "$IPA" ]]
          xcrun altool \
            --validate-app \
            -f "$IPA" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json \
            2>&1 | tee release-artifacts/app-store-validation.log
          echo "validation=GREEN" >> "$GITHUB_OUTPUT"

      - name: Resolve exact existing App Store Connect build
        if: steps.validate.outputs.validation == 'GREEN' && steps.freshness.outputs.current == 'true'
        id: duplicate
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION: ${{ needs.build-release-ipa.outputs.version }}
          BUILD_NUMBER: ${{ needs.build-release-ipa.outputs.build_number }}
        run: |
          set -euo pipefail
          ruby - <<'RUBY' 2>&1 | tee release-artifacts/build-duplicate-precheck.log
          require 'json'
          require 'net/http'
          require 'openssl'
          require 'uri'
          require 'jwt'

          key_id = ENV.fetch('ASC_KEY_ID')
          issuer_id = ENV.fetch('ASC_ISSUER_ID')
          requested_version = ENV.fetch('VERSION')
          build_number = ENV.fetch('BUILD_NUMBER')
          key_path = File.join(Dir.home, ".appstoreconnect/private_keys/AuthKey_#{key_id}.p8")
          private_key = OpenSSL::PKey.read(File.read(key_path))
          now = Time.now.to_i
          token = JWT.encode({ iss: issuer_id, iat: now, exp: now + 900, aud: 'appstoreconnect-v1' }, private_key, 'ES256', { kid: key_id, typ: 'JWT' })

          def request_asc(token, path)
            uri = URI("https://api.appstoreconnect.apple.com#{path}")
            request = Net::HTTP::Get.new(uri)
            request['Authorization'] = "Bearer #{token}"
            response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(request) }
            raise "App Store Connect API returned HTTP #{response.code}: #{response.body}" unless response.is_a?(Net::HTTPSuccess)
            JSON.parse(response.body)
          end

          def query(path, pairs)
            "#{path}?#{URI.encode_www_form(pairs)}"
          end

          app_response = request_asc(token, query('/v1/apps', [['filter[bundleId]', 'es.criosrango.app'], ['limit', '200']]))
          app = (app_response['data'] || []).find { |item| item.dig('attributes', 'bundleId') == 'es.criosrango.app' }
          raise 'App Store Connect app es.criosrango.app was not found' unless app
          app_id = app.fetch('id')

          response = request_asc(token, query('/v1/builds', [
            ['filter[app]', app_id],
            ['filter[version]', build_number],
            ['include', 'preReleaseVersion'],
            ['fields[builds]', 'version,processingState,uploadedDate,expired,preReleaseVersion'],
            ['fields[preReleaseVersions]', 'version,platform'],
            ['limit', '200']
          ]))
          builds = response['data'] || []
          included = (response['included'] || []).select { |item| item['type'] == 'preReleaseVersions' }
          pre_release_by_id = included.to_h { |item| [item['id'], item['attributes'] || {}] }

          if builds.empty?
            puts "BUILD_ID="
            puts "BUILD_VERSION="
            puts "PROCESSING_STATE="
            puts "UPLOADED_DATE="
            puts "PRE_RELEASE_VERSION="
            puts "PLATFORM="
            puts "BUILD_ALREADY_EXISTS=NO"
            puts "REUSE_EXISTING_BUILD=NO"
            puts "UPLOAD_REQUIRED=YES"
            puts "UPLOAD_EXECUTED=NO"
            File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |f|
              f.puts 'exists=false'
              f.puts 'reuse=false'
              f.puts 'upload_required=true'
              f.puts 'build_id='
            end
          else
            exact = builds.select do |item|
              attrs = item['attributes'] || {}
              relationship_id = item.dig('relationships', 'preReleaseVersion', 'data', 'id')
              pre = pre_release_by_id[relationship_id] || {}
              attrs['version'].to_s == build_number.to_s &&
                pre['version'].to_s == requested_version.to_s &&
                pre['platform'].to_s.upcase == 'IOS'
            end

            if exact.length != 1
              details = builds.map do |item|
                attrs = item['attributes'] || {}
                rel_id = item.dig('relationships', 'preReleaseVersion', 'data', 'id')
                pre = pre_release_by_id[rel_id] || {}
                "id=#{item['id']} build=#{attrs['version']} prerelease=#{pre['version'] || 'UNRESOLVED'} platform=#{pre['platform'] || 'UNRESOLVED'}"
              end
              raise "BUILD_MATCH_NOT_EXACT_OR_AMBIGUOUS: requested build=#{build_number}, prerelease=#{requested_version}, platform=IOS; results: #{details.join('; ')}"
            end

            build = exact.first
            attrs = build.fetch('attributes')
            pre = pre_release_by_id.fetch(build.dig('relationships', 'preReleaseVersion', 'data', 'id'))
            raise "BUILD_EXPIRED: exact App Store Connect build #{build.fetch('id')} is expired" if attrs['expired'] == true
            puts "EXPIRED=#{attrs['expired']}"
            puts "BUILD_ID=#{build.fetch('id')}"
            puts "BUILD_VERSION=#{attrs['version']}"
            puts "PROCESSING_STATE=#{attrs['processingState']}"
            puts "UPLOADED_DATE=#{attrs['uploadedDate']}"
            puts "PRE_RELEASE_VERSION=#{pre['version']}"
            puts "PLATFORM=#{pre['platform']}"
            puts "BUILD_ALREADY_EXISTS=YES"
            puts "REUSE_EXISTING_BUILD=YES"
            puts "UPLOAD_REQUIRED=NO"
            puts "UPLOAD_EXECUTED=NO"
            File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |f|
              f.puts 'exists=true'
              f.puts 'reuse=true'
              f.puts 'upload_required=false'
              f.puts "build_id=#{build.fetch('id')}"
              f.puts "processing_state=#{attrs['processingState']}"
              f.puts "uploaded_date=#{attrs['uploadedDate']}"
            end
          end
          RUBY

      - name: Upload signed IPA to App Store Connect
        if: steps.validate.outputs.validation == 'GREEN' && steps.freshness.outputs.current == 'true' && steps.duplicate.outputs.upload_required == 'true' && steps.duplicate.outcome == 'success'
        id: upload
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IPA_NAME: ${{ needs.build-release-ipa.outputs.ipa_name }}
        run: |
          set -euo pipefail
          IPA="release-artifacts/$IPA_NAME"
          xcrun altool \
            --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json \
            2>&1 | tee release-artifacts/app-store-upload.log
          echo "UPLOAD_EXECUTED=YES"
          echo "upload=GREEN" >> "$GITHUB_OUTPUT"

      - name: Wait for Apple processing and associate internal group Familia
        if: steps.validate.outputs.validation == 'GREEN' && steps.freshness.outputs.current == 'true' && steps.duplicate.outcome == 'success' && (steps.duplicate.outputs.reuse == 'true' || steps.upload.outputs.upload == 'GREEN')
        id: familia
        timeout-minutes: 120
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          VERSION: ${{ needs.build-release-ipa.outputs.version }}
          BUILD_NUMBER: ${{ needs.build-release-ipa.outputs.build_number }}
          EXISTING_BUILD_ID: ${{ steps.duplicate.outputs.build_id }}
          REUSE_EXISTING_BUILD: ${{ steps.duplicate.outputs.reuse }}
        run: |
          set -euo pipefail
          ruby - <<'RUBY' 2>&1 | tee release-artifacts/testflight-familia.log
          require 'json'
          require 'net/http'
          require 'openssl'
          require 'uri'
          require 'jwt'

          key_id = ENV.fetch('ASC_KEY_ID')
          issuer_id = ENV.fetch('ASC_ISSUER_ID')
          version = ENV.fetch('VERSION')
          build_number = ENV.fetch('BUILD_NUMBER')
          reuse = ENV.fetch('REUSE_EXISTING_BUILD') == 'true'
          existing_build_id = ENV.fetch('EXISTING_BUILD_ID', '')
          key_path = File.join(Dir.home, ".appstoreconnect/private_keys/AuthKey_#{key_id}.p8")
          private_key = OpenSSL::PKey.read(File.read(key_path))
          now = Time.now.to_i
          token = JWT.encode({ iss: issuer_id, iat: now, exp: now + 900, aud: 'appstoreconnect-v1' }, private_key, 'ES256', { kid: key_id, typ: 'JWT' })

          def request_asc(token, method, path, body = nil)
            uri = URI("https://api.appstoreconnect.apple.com#{path}")
            request = case method
                      when :get then Net::HTTP::Get.new(uri)
                      when :post then Net::HTTP::Post.new(uri)
                      else raise "Unsupported method #{method}"
                      end
            request['Authorization'] = "Bearer #{token}"
            request['Content-Type'] = 'application/json'
            request.body = JSON.generate(body) if body
            response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(request) }
            unless response.is_a?(Net::HTTPSuccess)
              raise "App Store Connect API #{method.to_s.upcase} #{uri.path} returned HTTP #{response.code}: #{response.body}"
            end
            response.body.nil? || response.body.empty? ? {} : JSON.parse(response.body)
          end

          def asc_query(path, pairs)
            "#{path}?#{URI.encode_www_form(pairs)}"
          end

          def exact_builds(token, app_id, build_number, version)
            response = request_asc(token, :get, asc_query('/v1/builds', [
              ['filter[app]', app_id], ['filter[version]', build_number],
              ['include', 'preReleaseVersion'],
              ['fields[builds]', 'version,processingState,uploadedDate,expired,preReleaseVersion'],
              ['fields[preReleaseVersions]', 'version,platform'], ['limit', '200']
            ]))
            included = (response['included'] || []).select { |item| item['type'] == 'preReleaseVersions' }
            pre_by_id = included.to_h { |item| [item['id'], item['attributes'] || {}] }
            builds = response['data'] || []
            candidates = builds.select do |item|
              pre = pre_by_id[item.dig('relationships', 'preReleaseVersion', 'data', 'id')] || {}
              item.dig('attributes', 'version').to_s == build_number.to_s &&
                pre['version'].to_s == version.to_s && pre['platform'].to_s.upcase == 'IOS'
            end
            if !builds.empty? && candidates.empty?
              raise "BUILD_MATCH_NOT_EXACT: App Store Connect returned build-number results, but none matched build=#{build_number}, prerelease=#{version}, platform=IOS"
            end
            raise "BUILD_MATCH_AMBIGUOUS: #{candidates.length} exact matches for build #{build_number}" if candidates.length > 1
            [candidates.first, pre_by_id]
          end

          app_response = request_asc(token, :get, asc_query('/v1/apps', [['filter[bundleId]', 'es.criosrango.app'], ['limit', '200']]))
          app = (app_response['data'] || []).find { |item| item.dig('attributes', 'bundleId') == 'es.criosrango.app' }
          raise 'App Store Connect app es.criosrango.app was not found for this API key' unless app
          app_id = app.fetch('id')

          group_response = request_asc(token, :get, asc_query('/v1/betaGroups', [
            ['filter[app]', app_id], ['filter[name]', 'Familia'],
            ['fields[betaGroups]', 'name,isInternalGroup,hasAccessToAllBuilds'], ['limit', '200']
          ]))
          group = (group_response['data'] || []).find do |item|
            item.dig('attributes', 'name') == 'Familia' && item.dig('attributes', 'isInternalGroup') == true
          end
          raise 'Internal TestFlight group Familia was not found for es.criosrango.app' unless group
          group_id = group.fetch('id')
          automatic = group.dig('attributes', 'hasAccessToAllBuilds') == true

          deadline = Time.now + 7200
          build = nil
          loop do
            if reuse && !existing_build_id.empty?
              build, pre_by_id = exact_builds(token, app_id, build_number, version)
              raise "Previously resolved BUILD_ID=#{existing_build_id} no longer resolves to the exact requested build" if build && build.fetch('id') != existing_build_id
            else
              build, pre_by_id = exact_builds(token, app_id, build_number, version)
            end

            if build
              attrs = build.fetch('attributes')
              pre = pre_by_id.fetch(build.dig('relationships', 'preReleaseVersion', 'data', 'id'))
              state = attrs['processingState'].to_s
              puts "BUILD_ID=#{build.fetch('id')}"
              puts "BUILD_VERSION=#{attrs['version']}"
              puts "PROCESSING_STATE=#{state}"
              puts "UPLOADED_DATE=#{attrs['uploadedDate']}"
              puts "PRE_RELEASE_VERSION=#{pre['version']}"
              puts "PLATFORM=#{pre['platform']}"
              case state
              when 'VALID'
                break
              when 'PROCESSING'
                puts "Apple is processing exact build #{build_number}; polling continues."
              when 'FAILED', 'INVALID'
                raise "Apple processing terminal failure for build #{build_number}: PROCESSING_STATE=#{state}"
              else
                raise "Unexpected Apple processing state for build #{build_number}: #{state.inspect}"
              end
            else
              puts "Exact build #{build_number} not visible yet after upload; waiting."
            end
            raise "Timed out waiting for Apple to process exact build #{build_number}" if Time.now >= deadline
            sleep 30
          end

          build_id = build.fetch('id')
          if automatic
            puts "Familia automatic distribution is enabled; build is available to the group."
            puts "FAMILIA_GROUP_ALREADY_ASSOCIATED=YES"
            puts "FAMILIA_GROUP_ASSOCIATED=YES"
          else
            relationships = request_asc(token, :get, asc_query("/v1/betaGroups/#{group_id}/relationships/builds", [['limit', '200']]))
            already_associated = (relationships['data'] || []).any? { |item| item['id'] == build_id }
            puts "FAMILIA_GROUP_ALREADY_ASSOCIATED=#{already_associated ? 'YES' : 'NO'}"
            unless already_associated
              begin
                request_asc(token, :post, "/v1/betaGroups/#{group_id}/relationships/builds", { data: [{ type: 'builds', id: build_id }] })
              rescue => e
                # A concurrent/duplicate association is accepted only after confirming the relationship exists.
                refreshed = request_asc(token, :get, asc_query("/v1/betaGroups/#{group_id}/relationships/builds", [['limit', '200']]))
                raise e unless (refreshed['data'] || []).any? { |item| item['id'] == build_id }
              end
            end
            puts "FAMILIA_GROUP_ASSOCIATED=YES"
          end
          puts "External distribution: NOT_REQUESTED; App Review: NOT_SUBMITTED."
          RUBY
          echo "familia=GREEN" >> "$GITHUB_OUTPUT"

      - name: Final report and upload evidence
        if: always()
        shell: bash
        env:
          VALIDATION: ${{ steps.validate.outputs.validation }}
          UPLOAD: ${{ steps.upload.outputs.upload }}
          FAMILIA: ${{ steps.familia.outputs.familia }}
          REUSE_EXISTING_BUILD: ${{ steps.duplicate.outputs.reuse }}
          RUN_START_EPOCH: ${{ needs.build-release-ipa.outputs.start_epoch }}
          VERSION: ${{ needs.build-release-ipa.outputs.version }}
          BUILD_NUMBER: ${{ needs.build-release-ipa.outputs.build_number }}
        run: |
          set -u
          REPORT=release-artifacts/ios-physical-testflight-report.txt
          [[ -f "$REPORT" ]] || printf 'IOS PHYSICAL TESTFLIGHT REPORT\n' > "$REPORT"
          [[ "$VALIDATION" == GREEN ]] && VALIDATION_STATUS=GREEN || VALIDATION_STATUS=RED
          if [[ "$REUSE_EXISTING_BUILD" == true ]]; then
            UPLOAD_STATUS=SKIPPED_REUSED
          elif [[ "$UPLOAD" == GREEN ]]; then
            UPLOAD_STATUS=GREEN
          else
            UPLOAD_STATUS=RED
          fi
          [[ "$FAMILIA" == GREEN ]] && TF_STATUS=SUCCESS || TF_STATUS=FAILURE
          [[ "$FAMILIA" == GREEN ]] && GROUP_STATUS=AVAILABLE || GROUP_STATUS=PENDING_OR_FAILED
          sed -i '' "s/^APP_STORE_VALIDATION=.*/APP_STORE_VALIDATION=$VALIDATION_STATUS/" "$REPORT"
          sed -i '' "s/^UPLOAD=.*/UPLOAD=$UPLOAD_STATUS/" "$REPORT"
          sed -i '' "s/^TESTFLIGHT_UPLOAD=.*/TESTFLIGHT_UPLOAD=$TF_STATUS/" "$REPORT"
          sed -i '' "s/^FAMILIA_GROUP=.*/FAMILIA_GROUP=$GROUP_STATUS/" "$REPORT"
          sed -i '' "s/^VERSION=.*/VERSION=$VERSION/" "$REPORT"
          sed -i '' "s/^BUILD=.*/BUILD=$BUILD_NUMBER/" "$REPORT"
          sed -i '' "s/^TOTAL_DURATION=.*/TOTAL_DURATION=$(( $(date +%s) - RUN_START_EPOCH )) seconds/" "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final report, IPA and App Store logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-physical-testflight-final-${{ github.run_id }}
          path: release-artifacts/**
          if-no-files-found: warn
          retention-days: 14
