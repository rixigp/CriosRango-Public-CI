name: Android debug APK

on:
  workflow_dispatch:
    inputs:
      validation_mode:
        description: "Full batch validation, or full validation plus Crashlytics mapping upload for a release candidate"
        required: true
        type: choice
        options:
          - full
          - release_candidate
        default: full
  push:
    branches:
      - kmp-migration
      - compose-multiplatform-convergence
      - home-novedades-marcas-convergence
      - fix/ios-outlet-category-state
    paths:
      - "app/**"
      - "shared/**"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/android-debug-apk.yml"
      - ".github/workflows/ios-fast-simulator-debug.yml"

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Google Services
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s app/google-services.json
      - name: Prepare permanent debug keystore
        env:
          CRIOSRANGO_DEBUG_KEYSTORE_BASE64: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_BASE64 }}
          CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD }}
          CRIOSRANGO_DEBUG_KEY_ALIAS: ${{ secrets.CRIOSRANGO_DEBUG_KEY_ALIAS }}
          CRIOSRANGO_DEBUG_KEY_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CRIOSRANGO_DEBUG_KEYSTORE_BASE64"
          test -n "$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD"
          test -n "$CRIOSRANGO_DEBUG_KEY_ALIAS"
          test -n "$CRIOSRANGO_DEBUG_KEY_PASSWORD"
          printf '%s' "$CRIOSRANGO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/criosrango-debug.jks"
          chmod 600 "$RUNNER_TEMP/criosrango-debug.jks"
          {
            echo "CRIOSRANGO_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/criosrango-debug.jks"
            echo "CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD=$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD"
            echo "CRIOSRANGO_DEBUG_KEY_ALIAS=$CRIOSRANGO_DEBUG_KEY_ALIAS"
            echo "CRIOSRANGO_DEBUG_KEY_PASSWORD=$CRIOSRANGO_DEBUG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Verify permanent signing certificate
        env:
          CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          STOREPASS="$(printf '%s' "$CRIOSRANGO_DEBUG_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          keytool -list -keystore "$RUNNER_TEMP/criosrango-debug.jks" -storepass "$STOREPASS" -alias "criosrango-development"
      - name: Build Android Debug APK (push-fast)
        if: github.event_name == 'push' && github.ref != 'refs/heads/fix/release-test-suite'
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --warning-mode all --stacktrace

      - name: Validate Android debug, tests, lint, and minified release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/home-novedades-marcas-convergence' || github.ref == 'refs/heads/fix/release-test-suite' || github.ref == 'refs/heads/fix/ios-outlet-category-state'))
        run: |
          set +e
          ./gradlew clean :app:assembleDebug :app:lintDebug test :app:assembleRelease --warning-mode all --stacktrace
          STATUS=$?
          if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          fi
          exit $STATUS
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            shared/build/test-results/**/*.xml
            shared/build/reports/tests/**
            app/build/test-results/**/*.xml
            app/build/reports/tests/**
      - name: Validate R8 outputs and release manifest
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/home-novedades-marcas-convergence' || github.ref == 'refs/heads/fix/release-test-suite' || github.ref == 'refs/heads/fix/ios-outlet-category-state'))
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$RELEASE_APK"
          test -s "$RELEASE_APK"
          MAPPING="app/build/outputs/mapping/release/mapping.txt"
          test -s "$MAPPING"
          echo "RELEASE_APK=$RELEASE_APK"
          echo "RELEASE_APK_SIZE=$(stat -c '%s' "$RELEASE_APK") bytes"
          echo "MAPPING=$MAPPING"
          echo "MAPPING_SIZE=$(stat -c '%s' "$MAPPING") bytes"
          echo "=== R8 outputs ==="
          find app/build/outputs/mapping/release -maxdepth 1 -type f -print | sort
          echo "=== Release manifest check ==="
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          if "$BUILD_TOOLS/aapt" dump badging "$RELEASE_APK" | grep -q "CrashlyticsDebugCrashActivity"; then
            echo "::error::CrashlyticsDebugCrashActivity leaked into release artifact"
            exit 1
          fi
          echo "CrashlyticsDebugCrashActivity absent from release artifact"
          echo "=== Crashlytics mapping upload task available ==="
          ./gradlew :app:tasks --all | grep -E "uploadCrashlyticsMappingFileRelease|assembleRelease" || true
      - name: Upload Crashlytics mapping (release candidate only)
        if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'release_candidate'
        run: ./gradlew :app:uploadCrashlyticsMappingFileRelease --stacktrace

      - name: Locate and validate exactly one APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/debug"
          APK_COUNT=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | wc -l)
          test "$APK_COUNT" -eq 1
          APK_PATH="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          test -s "$APK_PATH"
          echo "APK_PATH=$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=$(basename "$APK_PATH")"
          echo "APK_SIZE=$(stat -c '%s' "$APK_PATH") bytes"
          VERSION_NAME=$(grep -E 'versionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/')
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: CriosRango-v${{ steps.apk.outputs.version_name }}-build${{ steps.apk.outputs.version_code }}-debug-apk
          retention-days: 2
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
      - name: Cleanup
        if: always()
        run: |
          rm -f app/google-services.json
          rm -f "$RUNNER_TEMP/criosrango-debug.jks"
